<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a3f">
<title>Imagify</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תמונותיפיי">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="../shared/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared/fonts/heebo.css">
<link rel="stylesheet" href="../shared/rg-site.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img src="icons/icon-192.png" width="56" height="56" alt="">
    <div>
      <p class="eyebrow"><span class="pill ver" id="ver">v2</span></p>
      <h1>תמונותיפיי</h1>
      <p class="sub">הקובץ המקורי נשמר במלואו, בלי כיווץ.</p>
    </div>
  </header>

  <p class="device-note">התמונות נשמרות במכשיר הזה בלבד לעכשיו.</p>

  <div class="add-row">
    <button type="button" class="btn" id="add-btn">מהגלריה</button>
    <button type="button" class="btn ghost" id="cam-btn">צילום</button>
  </div>
  <input id="file-gallery" type="file" accept="image/*" multiple hidden>
  <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>

  <p class="count" id="count"></p>
  <div class="empty" id="empty">
    <img src="icons/icon-192.png" width="72" height="72" alt="">
    <p>עדיין אין תמונות. הוסיפו מהגלריה או מהמצלמה.</p>
  </div>
  <div class="cards" id="cards"></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="rg-install-wrap" id="install-wrap">
    <span class="inst-anchor">
      <button type="button" class="rg-install" id="install-btn"><span class="inst-emoji" aria-hidden="true">📲</span> התקנה למסך הבית</button>
      <button type="button" class="inst-x" id="install-x" aria-label="סגירה">✕</button>
    </span>
  </div>
  <footer>© כל הזכויות שמורות לחברת היליפיי בע"מ 2026</footer>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="גלריה">
  <div class="viewer-top" data-chrome>
    <button type="button" class="icon-btn" id="viewer-close" aria-label="סגירה">×</button>
    <span class="spacer"></span>
    <span class="count-lg" id="viewer-count" dir="ltr"></span>
    <span class="pill ver">v2</span>
  </div>
  <div class="stage" id="stage">
    <img id="viewer-img" alt="">
  </div>
  <div class="viewer-bottom" data-chrome>
    <p class="viewer-name" id="viewer-name"></p>
    <p class="viewer-date" id="viewer-date"></p>
    <div class="viewer-actions">
      <button type="button" class="btn slim" id="viewer-share">שיתוף</button>
      <button type="button" class="btn slim ghost" id="viewer-delete">מחיקה</button>
    </div>
    <p class="hint-line">החליקו ימינה או שמאלה · לחיצה על התמונה סוגרת</p>
  </div>
</div>

<div class="sheet-bg" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheet-title">התקנה למסך הבית</h2>
    <div id="sheet-body"></div>
    <button type="button" class="btn" id="sheet-close">הבנתי</button>
  </div>
</div>

<div class="confirm-bg" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="confirm">
    <h2 id="confirm-title">למחוק את התמונה?</h2>
    <p id="confirm-body"></p>
    <div class="confirm-actions">
      <button type="button" class="btn ghost" id="confirm-cancel">ביטול</button>
      <button type="button" class="btn" id="confirm-ok">מחיקה</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
