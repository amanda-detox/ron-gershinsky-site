<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1238">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>לייטיפיי · Lightify</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --gold:#f3cf6b; --gold2:#ffe7a3; --blue:#2c5cff; --navy:#0a1238; --ink:#eaf0ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--navy); color:var(--ink);
    font-family:'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
  #c { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
  .hidden { display:none !important; }
  button { font-family:inherit; color:inherit; cursor:pointer; }

  /* ---------- Menu ---------- */
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% 20%, rgba(60,90,220,.35), rgba(5,9,35,.88) 70%); z-index:20; overflow-y:auto; }
  .panel { width:min(720px, 100%); max-height:100%; overflow-y:auto; text-align:center; padding:6px 4px 10px; }
  h1 { margin:4px 0 2px; font-size:clamp(30px, 7vw, 48px); font-weight:800; letter-spacing:.5px;
    background:linear-gradient(180deg,#fff, var(--gold2) 55%, var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,231,163,.25); }
  .sub { margin:0 0 12px; font-weight:300; color:#c9d6ff; font-size:15px; }
  .heroes { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0 12px; }
  .hcard { background:rgba(20,34,100,.55); border:1px solid rgba(243,207,107,.35); border-radius:14px; padding:8px 6px; font-size:12.5px; line-height:1.45; }
  .hcard b { display:block; font-size:14.5px; color:var(--gold2); margin-bottom:3px; }
  .hcard .p { display:block; color:#dfe7ff; }
  .hcard .p i { font-style:normal; color:#9fb4ff; font-size:11px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; margin:8px 0; }
  .btn { border:1px solid rgba(243,207,107,.55); background:rgba(30,52,150,.6); border-radius:999px; padding:10px 18px; font-size:15px; font-weight:500; }
  .btn.main { font-size:20px; font-weight:700; padding:12px 40px; color:#1a1d3a; border:none;
    background:linear-gradient(180deg, #fff7d6, var(--gold)); box-shadow:0 0 28px rgba(243,207,107,.45); }
  .btn:active { transform:scale(.97); }
  .set { display:flex; align-items:center; gap:10px; justify-content:center; font-size:14.5px; flex-wrap:wrap; }
  input[type=range] { width:180px; accent-color:var(--gold); }
  .help { font-size:12.5px; color:#b9c8f5; font-weight:300; line-height:1.55; margin:8px auto 0; max-width:560px; }
  .foot { margin-top:12px; font-size:12px; color:#9fb0e6; font-weight:300; }
  .install-hint { margin:8px auto 0; max-width:440px; font-size:13px; line-height:1.55; color:#c9d6ff; text-align:start; }
  .install-hint ol { margin:.2rem 0; padding-inline-start:1.3em; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #hud .top { position:absolute; top:max(8px, env(safe-area-inset-top)); left:8px; right:8px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .stat { background:rgba(8,16,60,.55); border:1px solid rgba(243,207,107,.3); border-radius:12px; padding:5px 10px; font-size:13.5px; line-height:1.35; }
  .stat b { color:var(--gold2); font-size:17px; }
  .lightbar { width:min(150px, 30vw); height:8px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:4px; }
  .lightbar > div { height:100%; width:100%; background:linear-gradient(90deg, #8fb0ff, #fff, var(--gold2)); transition:width .2s; }
  .hbtns { display:flex; gap:6px; pointer-events:auto; }
  .hbtn { width:46px; height:46px; border-radius:50%; border:2px solid rgba(255,255,255,.25); background:rgba(20,36,110,.7); font-size:20px; display:flex; align-items:center; justify-content:center; position:relative; padding:0; }
  .hbtn.on { border-color:var(--gold); box-shadow:0 0 14px rgba(243,207,107,.7); background:rgba(50,80,200,.85); }
  .hbtn small { position:absolute; bottom:-3px; font-size:10px; background:#0a1238; border-radius:6px; padding:0 4px; }
  .tools { display:flex; gap:6px; pointer-events:auto; }
  .tbtn { min-width:40px; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.25); background:rgba(8,16,60,.6); font-size:15px; padding:0 8px; }
  #anglePop { position:absolute; top:calc(max(8px, env(safe-area-inset-top)) + 100px); left:50%; transform:translateX(-50%); pointer-events:auto; background:rgba(8,16,60,.85); border:1px solid rgba(243,207,107,.4); border-radius:12px; padding:8px 12px; }
  #powers { position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); right:14px; display:flex; flex-direction:column; align-items:flex-end; gap:10px; pointer-events:auto; }
  #powers .prow { display:flex; gap:10px; align-items:flex-end; }
  .pbtn { width:68px; height:68px; border-radius:50%; border:2px solid rgba(243,207,107,.75); position:relative; padding:0; font-size:26px;
    background:radial-gradient(circle at 50% 35%, rgba(90,130,255,.9), rgba(20,36,110,.9)); box-shadow:0 0 18px rgba(120,160,255,.35); overflow:hidden; }
  .pbtn.big { width:80px; height:80px; font-size:30px; }
  .pbtn .cd { position:absolute; inset:0; border-radius:50%; background:conic-gradient(rgba(5,10,40,.75) var(--p, 0%), transparent 0); }
  .pbtn .lbl { position:absolute; bottom:6px; left:0; right:0; font-size:9.5px; line-height:1; font-weight:500; text-shadow:0 1px 2px #000; }
  .pbtn.ready { box-shadow:0 0 22px rgba(255,231,163,.85); }
  .basic { font-size:11.5px; background:rgba(8,16,60,.6); border-radius:10px; padding:3px 8px; color:#dfe7ff; }
  #banner { position:absolute; top:30%; left:0; right:0; text-align:center; font-size:clamp(26px, 6vw, 44px); font-weight:800; color:#fff; text-shadow:0 0 24px rgba(255,231,163,.9); opacity:0; transition:opacity .5s; }
  #joy { position:absolute; width:120px; height:120px; border-radius:50%; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06); transform:translate(-50%,-50%); }
  #joy div { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:rgba(255,240,200,.35); border:2px solid rgba(243,207,107,.7); }
  #fade { position:fixed; inset:0; background:#02040f; opacity:0; pointer-events:none; z-index:15; transition:opacity 1.6s; }
  @media (max-height:460px) { .heroes { margin:6px 0; } .help { display:none; } h1 { font-size:30px; } .sub { margin-bottom:4px; } .pbtn { width:58px; height:58px; font-size:22px; } .pbtn.big { width:68px; height:68px; } .hcard { padding:5px; font-size:11.5px; } }
  @media (max-width:430px) { .heroes { grid-template-columns:1fr; } .hcard { display:flex; flex-wrap:wrap; gap:4px 10px; justify-content:center; align-items:baseline; } .hcard b { width:100%; margin:0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>

<div id="hud" class="hidden">
  <div class="top">
    <div class="stat"><span data-t="souls"></span>: <b id="score">0</b> · <span data-t="wave"></span> <b id="wave">1</b>
      <div class="lightbar"><div id="light"></div></div></div>
    <div class="hbtns" id="hbtns"></div>
    <div class="tools">
      <button class="tbtn" id="angleBtn" aria-label="angle">∠ <span id="angleVal">55°</span></button>
      <button class="tbtn" id="pauseBtn" aria-label="pause">❚❚</button>
    </div>
  </div>
  <div id="anglePop" class="hidden"><div class="set"><span data-t="angle"></span> <input type="range" min="45" max="70" step="1" id="angle2"> <span id="angle2v"></span></div></div>
  <div id="powers">
    <div class="prow">
      <button class="pbtn" id="p1"><span class="ic"></span><div class="cd"></div><span class="lbl"></span></button>
      <button class="pbtn big" id="p2"><span class="ic"></span><div class="cd"></div><span class="lbl"></span></button>
    </div>
    <div class="basic" id="basicLbl"></div>
  </div>
  <div id="banner"></div>
  <div id="joy" class="hidden"><div></div></div>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1 data-t="title"></h1>
    <p class="sub" data-t="tag"></p>
    <div class="heroes" id="heroCards"></div>
    <div class="row"><button class="btn main" id="startBtn" data-t="start"></button></div>
    <div class="set"><span data-t="angle"></span> <input type="range" min="45" max="70" step="1" id="angle"> <span id="anglev"></span></div>
    <div class="row">
      <button class="btn" id="soundBtn"></button>
      <button class="btn" id="langBtn"></button>
      <button class="btn" id="installBtn" data-t="install"></button>
    </div>
    <div class="install-hint hidden" id="installHint"></div>
    <p class="help" id="help"></p>
    <div class="foot" data-t="copy"></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h1 data-t="paused"></h1>
    <div class="set"><span data-t="angle"></span> <input type="range" min="45" max="70" step="1" id="angle3"> <span id="angle3v"></span></div>
    <div class="row"><button class="btn main" id="resumeBtn" data-t="resume"></button></div>
    <div class="row"><button class="btn" id="sound2Btn"></button><button class="btn" id="menuBtn" data-t="toMenu"></button></div>
    <div class="foot" data-t="copy"></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h1 data-t="overT"></h1>
    <p class="sub" data-t="overS"></p>
    <p class="sub"><span data-t="souls"></span>: <b id="finalScore">0</b> · <span data-t="best"></span>: <b id="best">0</b></p>
    <div class="row"><button class="btn main" id="againBtn" data-t="again"></button></div>
    <div class="row"><button class="btn" id="menu2Btn" data-t="toMenu"></button></div>
    <div class="foot" data-t="copy"></div>
  </div>
</div>

<div id="nogl" class="overlay hidden"><div class="panel"><h1 data-t="title"></h1><p class="sub" data-t="nogl"></p></div></div>

<script type="module" src="game.js"></script>
</body>
</html>
