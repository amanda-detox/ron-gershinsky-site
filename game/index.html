<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1238">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>לייטיפיי · Lightify</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --gold:#f3cf6b; --gold2:#ffe7a3; --blue:#2c5cff; --navy:#0a1238; --ink:#eaf0ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--navy); color:var(--ink);
    font-family:'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
  #c { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
  .hidden { display:none !important; }
  button { font-family:inherit; color:inherit; cursor:pointer; }

  /* ---------- Menu ---------- */
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% 20%, rgba(60,90,220,.35), rgba(5,9,35,.88) 70%); z-index:20; overflow-y:auto; }
  .panel { width:min(720px, 100%); max-height:100%; overflow-y:auto; text-align:center; padding:6px 4px 10px; }
  h1 { margin:4px 0 2px; font-size:clamp(30px, 7vw, 48px); font-weight:800; letter-spacing:.5px;
    background:linear-gradient(180deg,#fff, var(--gold2) 55%, var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,231,163,.25); }
  .sub { margin:0 0 12px; font-weight:300; color:#c9d6ff; font-size:15px; }
  .heroes { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0 12px; }
  .hcard { background:rgba(20,34,100,.55); border:1px solid rgba(243,207,107,.35); border-radius:14px; padding:8px 6px; font-size:12.5px; line-height:1.45; }
  .hcard b { display:block; font-size:14.5px; color:var(--gold2); margin-bottom:3px; }
  .hcard .p { display:block; color:#dfe7ff; }
  .hcard .p i { font-style:normal; color:#9fb4ff; font-size:11px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; margin:8px 0; }
  .btn { border:1px solid rgba(243,207,107,.55); background:rgba(30,52,150,.6); border-radius:999px; padding:10px 18px; font-size:15px; font-weight:500; }
  .btn.main { font-size:20px; font-weight:700; padding:12px 40px; color:#1a1d3a; border:none;
    background:linear-gradient(180deg, #fff7d6, var(--gold)); box-shadow:0 0 28px rgba(243,207,107,.45); }
  .btn:active { transform:scale(.97); }
  .set { display:flex; align-items:center; gap:10px; justify-content:center; font-size:14.5px; flex-wrap:wrap; }
  input[type=range] { width:180px; accent-color:var(--gold); }
  .help { font-size:12.5px; color:#b9c8f5; font-weight:300; line-height:1.55; margin:8px auto 0; max-width:560px; }
  .foot { margin-top:12px; font-size:12px; color:#9fb0e6; font-weight:300; }
  .btn.install { border:2px solid var(--gold); font-weight:700; font-size:16px; padding:10px 26px; }
  .install-hint { margin:8px auto 0; max-width:440px; font-size:13px; line-height:1.55; color:#c9d6ff; text-align:start; }
  .install-hint ol { margin:.2rem 0; padding-inline-start:1.3em; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #hud .top { position:absolute; top:max(8px, env(safe-area-inset-top)); left:max(8px, env(safe-area-inset-left)); right:max(8px, env(safe-area-inset-right)); display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:6px 8px; }
  #hud .top .stat { flex:0 1 auto; min-width:0; }
  #hud .top .tools { flex:0 0 auto; }
  @media (max-width:599px) { #hud .top .hbtns { order:3; width:100%; justify-content:center; } }
  .stat { background:rgba(8,16,60,.55); border:1px solid rgba(243,207,107,.3); border-radius:12px; padding:5px 10px; font-size:13.5px; line-height:1.35; }
  .stat b { color:var(--gold2); font-size:17px; }
  .lightbar { width:min(150px, 34vw); height:8px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:4px; }
  .lightbar > div { height:100%; width:100%; background:linear-gradient(90deg, #8fb0ff, #fff, var(--gold2)); transition:width .2s; }
  .hbtns { display:flex; gap:6px; pointer-events:auto; }
  .hbtn { width:46px; height:46px; border-radius:50%; border:2px solid rgba(255,255,255,.25); background:rgba(20,36,110,.7); font-size:20px; display:flex; align-items:center; justify-content:center; position:relative; padding:0; }
  .hbtn.on { border-color:var(--gold); box-shadow:0 0 14px rgba(243,207,107,.7); background:rgba(50,80,200,.85); }
  .hbtn small { position:absolute; bottom:-3px; font-size:10px; background:#0a1238; border-radius:6px; padding:0 4px; }
  .tools { display:flex; gap:6px; pointer-events:auto; }
  .tbtn { min-width:44px; height:44px; border-radius:12px; border:1px solid rgba(255,255,255,.25); background:rgba(8,16,60,.6); font-size:15px; padding:0 8px; }
  #angleBtn { border:2px solid var(--gold); background:rgba(30,52,150,.85); color:#fff; font-weight:700; font-size:16px; box-shadow:0 0 12px rgba(243,207,107,.45); white-space:nowrap; }
  #angleBtn .ai { color:var(--gold2); font-size:18px; }
  #anglePop { position:absolute; top:calc(max(8px, env(safe-area-inset-top)) + 112px); left:max(8px, env(safe-area-inset-left)); right:max(8px, env(safe-area-inset-right)); margin:0 auto; max-width:440px; pointer-events:auto; background:rgba(8,16,60,.92); border:2px solid rgba(243,207,107,.6); border-radius:14px; padding:10px 14px; }
  #anglePop .set { flex-wrap:nowrap; }
  #anglePop input[type=range] { flex:1 1 auto; width:auto; min-width:0; height:28px; }
  @media (min-width:600px) { #anglePop { top:calc(max(8px, env(safe-area-inset-top)) + 64px); } }
  /* power pad: 5 icon buttons around a circle, bottom-left */
  #pad { position:absolute; left:max(10px, env(safe-area-inset-left)); bottom:max(10px, env(safe-area-inset-bottom)); width:172px; height:172px; border-radius:50%; pointer-events:auto;
    background:radial-gradient(circle, rgba(30,52,150,.35), rgba(8,16,60,.25) 70%); border:2px solid rgba(243,207,107,.35); direction:ltr; }
  #pad .hub { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(8,16,60,.7); border:1px solid rgba(243,207,107,.4); pointer-events:none; }
  .pw { position:absolute; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; border:2px solid rgba(243,207,107,.8); padding:0; overflow:hidden; touch-action:none;
    background:radial-gradient(circle at 50% 35%, rgba(90,130,255,.95), rgba(20,36,110,.95)); box-shadow:0 0 14px rgba(120,160,255,.4); display:flex; align-items:center; justify-content:center; }
  .pw svg { position:relative; z-index:1; pointer-events:none; }
  .pw .cd { position:absolute; inset:0; border-radius:50%; background:conic-gradient(rgba(5,10,40,.78) var(--p, 0%), transparent 0); z-index:2; pointer-events:none; }
  .pw.ready { box-shadow:0 0 20px rgba(255,231,163,.9); }
  .pw.on { border-color:#fff; box-shadow:0 0 24px rgba(255,255,255,.95); }
  .pw:active { transform:scale(.94); }
  /* movement joystick, bottom-right */
  #joy { position:absolute; right:max(14px, env(safe-area-inset-right)); bottom:max(14px, env(safe-area-inset-bottom)); width:136px; height:136px; border-radius:50%; pointer-events:auto; touch-action:none;
    border:2px solid rgba(243,207,107,.65); background:radial-gradient(circle, rgba(60,90,220,.28), rgba(10,18,70,.45)); box-shadow:0 0 18px rgba(120,160,255,.3); }
  #joy i { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 40% 35%, #fff7d6, var(--gold) 70%); box-shadow:0 0 16px rgba(243,207,107,.7); }
  #joy.act { border-color:#fff; }
  @media (max-width:359px) { #pad { transform:scale(.88); transform-origin:left bottom; } #joy { width:120px; height:120px; } }
  #banner { position:absolute; top:30%; left:0; right:0; text-align:center; font-size:clamp(26px, 6vw, 44px); font-weight:800; color:#fff; text-shadow:0 0 24px rgba(255,231,163,.9); opacity:0; transition:opacity .5s; }
  #fade { position:fixed; inset:0; background:#02040f; opacity:0; pointer-events:none; z-index:15; transition:opacity 1.6s; }
  @media (max-height:460px) { .heroes { margin:6px 0; } .help { display:none; } h1 { font-size:30px; } .sub { margin-bottom:4px; } #pad { transform:scale(.82); transform-origin:left bottom; } #joy { width:118px; height:118px; } .hcard { padding:5px; font-size:11.5px; } }
  @media (max-width:430px) { .heroes { grid-template-columns:1fr; } .hcard { display:flex; flex-wrap:wrap; gap:4px 10px; justify-content:center; align-items:baseline; } .hcard b { width:100%; margin:0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>

<div id="hud" class="hidden">
  <div class="top">
    <div class="stat"><span data-t="souls"></span>: <b id="score">0</b> · <span data-t="wave"></span> <b id="wave">1</b>
      <div class="lightbar"><div id="light"></div></div></div>
    <div class="hbtns" id="hbtns"></div>
    <div class="tools">
      <button class="tbtn" id="angleBtn" aria-label="angle"><span class="ai">∠</span> <span id="angleVal">55°</span></button>
      <button class="tbtn" id="pauseBtn" aria-label="pause">❚❚</button>
    </div>
  </div>
  <div id="anglePop" class="hidden"><div class="set"><span data-t="angle"></span> <input type="range" min="3" max="70" step="1" id="angle2"> <span id="angle2v"></span></div></div>
  <div id="pad"><div class="hub" id="padHub"></div></div>
  <div id="banner"></div>
  <div id="joy"><i></i></div>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1 data-t="title"></h1>
    <p class="sub" data-t="tag"></p>
    <div class="heroes" id="heroCards"></div>
    <div class="row"><button class="btn main" id="startBtn" data-t="start"></button></div>
    <div class="set"><span data-t="angle"></span> <input type="range" min="3" max="70" step="1" id="angle"> <span id="anglev"></span></div>
    <div class="row">
      <button class="btn" id="soundBtn"></button>
      <button class="btn" id="langBtn"></button>
    </div>
    <p class="help" id="help"></p>
    <div class="row"><button class="btn install" id="installBtn" data-t="install"></button></div>
    <div class="install-hint hidden" id="installHint"></div>
    <div class="foot" data-t="copy"></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h1 data-t="paused"></h1>
    <div class="set"><span data-t="angle"></span> <input type="range" min="3" max="70" step="1" id="angle3"> <span id="angle3v"></span></div>
    <div class="row"><button class="btn main" id="resumeBtn" data-t="resume"></button></div>
    <div class="row"><button class="btn" id="sound2Btn"></button><button class="btn" id="menuBtn" data-t="toMenu"></button></div>
    <div class="foot" data-t="copy"></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h1 data-t="overT"></h1>
    <p class="sub" data-t="overS"></p>
    <p class="sub"><span data-t="souls"></span>: <b id="finalScore">0</b> · <span data-t="best"></span>: <b id="best">0</b></p>
    <div class="row"><button class="btn main" id="againBtn" data-t="again"></button></div>
    <div class="row"><button class="btn" id="menu2Btn" data-t="toMenu"></button></div>
    <div class="foot" data-t="copy"></div>
  </div>
</div>

<div id="nogl" class="overlay hidden"><div class="panel"><h1 data-t="title"></h1><p class="sub" data-t="nogl"></p></div></div>

<script type="module" src="game.js"></script>
</body>
</html>
