<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>/* display size (rg-zoom, set from the top bar) before first paint */(function(){try{var z=+localStorage.getItem("rg-zoom");if([75,90,110,125,150].indexOf(z)>-1)document.documentElement.style.zoom=z/100;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a6b">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="באלאנסיפיי">
<meta name="description" content="באלאנסיפיי · הרגעה, איזון וזרימה. Balancify, calm, balance and flow.">
<script>/* before first paint: theme (dark default), background, language */(function(){var d=document.documentElement,t="dark",b="sunset";try{t=localStorage.getItem("rg-balancify-theme")==="light"?"light":"dark";b=localStorage.getItem("rg-balancify-bg")||"sunset";if(!/^[a-z]+$/.test(b))b="sunset";}catch(e){}d.setAttribute("data-theme",t);d.style.setProperty("--bgimg",'url("bg/'+b+'.webp")');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#f4efe9":"#0d2a6b");try{if(localStorage.getItem("rg-lang")==="en"){d.lang="en";d.dir="ltr";}}catch(e){}})();</script>
<title>Balancify</title>
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<link rel="preload" href="../shared/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared/fonts/heebo.css">
<link rel="stylesheet" href="../shared/rg-site.css">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <a hidden class="back" id="back"></a>
    <div class="tools">
      <span data-rg-account style="display:inline-flex;min-width:0"></span>
      <button type="button" class="pill" id="bg-btn"></button>
      <button type="button" class="pill" id="theme-btn"><span class="ti"></span><span class="tl"></span></button>
      <div class="lang" role="group" aria-label="Language / שפה">
        <button type="button" id="lang-he" aria-pressed="true">עב</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="home">
    <div class="hero">
      <img src="icon.svg?v=3" alt="" width="60" height="60">
      <div>
        <h1 id="title"></h1>
        <p class="tagline" id="tagline"></p>
      </div>
    </div>
    <nav class="choices" id="choices"></nav>
    <p class="home-restore"><button type="button" class="btn" id="restore-all"></button></p>
  </main>

  <main id="list" hidden>
    <button type="button" class="homebtn" id="home-btn"></button>
    <section class="card">
      <h2 id="list-title"></h2>
      <span class="tag" id="list-tag" hidden></span>
      <p class="instr" id="instr"></p>
      <p class="ghint" id="ghint"></p>
      <p class="lnote" id="list-note" hidden></p>
      <form class="padd" id="add-form" autocomplete="off" onsubmit="return false">
        <input type="text" id="add-text" maxlength="300" enterkeyhint="done" autocomplete="off" dir="auto">
        <button type="button" class="btn primary" id="add-btn"></button>
      </form>
      <ul class="items" id="items"></ul>
      <section class="questions" id="questions" hidden></section>
      <p class="more" id="list-more" hidden></p>
      <p class="soon" id="soon" hidden></p>
      <div class="listfoot" id="listfoot">
        <span class="count" id="count"></span>
        <span class="footbtns">
          <button type="button" class="btn" id="restore-btn"></button>
          <button type="button" class="btn" id="clear-btn"></button>
        </span>
      </div>
    </section>
  </main>

  <div class="rg-install-wrap" id="install-wrap" hidden><button type="button" class="rg-install" id="install-btn"></button><div class="rg-install-hint" id="install-hint" hidden></div></div>
  <footer>
    <p class="crisis" id="crisis"></p>
    <p class="rg-copy"><span lang="he" dir="rtl">© כל הזכויות שמורות לחברת היליפיי בע"מ 2026</span><span lang="en" dir="ltr">© 2026 Healify Ltd. All rights reserved.</span></p>
  </footer>
</div>

<div class="sheet" id="bg-sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="bg-title">
    <div class="sheet-head"><h3 id="bg-title"></h3><button type="button" class="x" id="bg-close" aria-label="Close">✕</button></div>
    <div class="bg-grid" id="bg-grid"></div>
  </div>
</div>

<div class="sheet" id="mv-sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="mv-title">
    <div class="sheet-head"><h3 id="mv-title"></h3></div>
    <div class="mv-grid" id="mv-grid"></div>
  </div>
</div>
<div class="sheet" id="note-sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <div class="sheet-head"><h3 id="note-title"></h3><button type="button" class="x" id="note-close" aria-label="Close">✕</button></div>
    <label class="note-label" id="title-label" for="item-title"></label>
    <textarea id="item-title" class="notearea titlearea" rows="2" maxlength="200" dir="auto" enterkeyhint="next" autocomplete="off"></textarea>
    <label class="note-label" id="note-label" for="note-text"></label>
    <textarea id="note-text" class="notearea" rows="4" maxlength="500" dir="auto"></textarea>
    <div class="note-actions">
      <button type="button" class="btn primary" id="note-save"></button>
      <button type="button" class="btn" id="note-clear"></button>
      <button type="button" class="btn" id="note-cancel"></button>
    </div>
  </div>
</div>

<div class="sheet" id="cf-sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="cf-title">
    <div class="sheet-head"><h3 id="cf-title"></h3><button type="button" class="x" id="cf-close" aria-label="Close">✕</button></div>
    <p class="cf-body" id="cf-body"></p>
    <div class="note-actions">
      <button type="button" class="btn primary" id="cf-yes"></button>
      <button type="button" class="btn" id="cf-no"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="data.js?v=5"></script>
<script src="app.js?v=11"></script>
<script src="../shared/rg-account.js"></script>
<script>if (window.RGAccount) RGAccount.syncPrefs(["rg-lang", "rg-balancify-theme", "rg-balancify-bg", "rg-balancify-order", "rg-balancify-user"]);</script>
<script src="../shared/rg-topbar.js?v=5" data-nohome="1" data-slot="header.top"></script>

<!-- rg-install v3: button only when the browser offers a real install prompt -->
<style>#rg-inst-w{position:fixed;bottom:14px;inset-inline-start:14px;z-index:9999;font:14px/1.4 Heebo,system-ui,sans-serif}#rg-inst-w[hidden]{display:none}#rg-inst{display:block;font:600 15px/1.2 Heebo,system-ui,sans-serif;background:linear-gradient(135deg,#0b2a6b,#1e4fd1);color:#f5d27a;border:1.5px solid #d4af37;border-radius:22px;padding:9px 40px 9px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}[dir=rtl] #rg-inst{padding:9px 14px 9px 40px}#rg-inst-x{position:absolute;top:-10px;right:-10px;width:32px;height:32px;border-radius:50%;border:1.5px solid #d4af37;background:#0b1a3f;color:#f5d27a;font:700 18px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);padding:0}[dir=rtl] #rg-inst-x{right:auto;left:-10px}</style>
<div id="rg-inst-w" hidden><button id="rg-inst" type="button"></button><button id="rg-inst-x" type="button">✕</button></div>
<script>(function(){
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});}
var K="rg-inst-off",w=document.getElementById("rg-inst-w"),b=document.getElementById("rg-inst"),x=document.getElementById("rg-inst-x"),dp=null;
var T={he:{b:"📲 התקנה למסך הבית",x:"סגירה"},en:{b:"📲 Install app",x:"Close"}};
function L(){var l="";try{l=localStorage.getItem("rg-lang")||"";}catch(e){}if(l!=="en"&&l!=="he")l=/^en/i.test(document.documentElement.lang)?"en":"he";return l;}
function R(){var t=T[L()];b.textContent=t.b;x.title=t.x;x.setAttribute("aria-label",t.x);}
function sa(){return(window.matchMedia&&(matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: minimal-ui)").matches))||navigator.standalone===true;}
function off(){try{return localStorage.getItem(K)==="1";}catch(e){return false;}}
function U(){w.hidden=!(dp&&!sa()&&!off());}
R();U();
addEventListener("storage",function(e){if(e.key==="rg-lang")R();});addEventListener("rg-lang",R);
new MutationObserver(R).observe(document.documentElement,{attributes:true,attributeFilter:["lang","dir"]});
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;U();});
addEventListener("appinstalled",function(){dp=null;U();});
b.onclick=function(){if(!dp)return;var d=dp;dp=null;U();d.prompt();};
x.onclick=function(){try{localStorage.setItem(K,"1");}catch(e){}U();};
})();</script>
</body>
</html>
