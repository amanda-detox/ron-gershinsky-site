<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>/* display size (rg-zoom, set from the top bar) before first paint */(function(){try{var z=+localStorage.getItem("rg-zoom");if([75,90,110,125,150].indexOf(z)>-1)document.documentElement.style.zoom=z/100;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a6b">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="באלאנסיפיי">
<meta name="description" content="באלאנסיפיי · הרגעה, איזון וזרימה. Balancify, calm, balance and flow.">
<script>/* before first paint: theme (dark default), background, language */(function(){var d=document.documentElement,t="dark",b="sunset";try{t=localStorage.getItem("rg-balancify-theme")==="light"?"light":"dark";b=localStorage.getItem("rg-balancify-bg")||"sunset";if(!/^[a-z]+$/.test(b))b="sunset";}catch(e){}d.setAttribute("data-theme",t);d.style.setProperty("--bgimg",'url("bg/'+b+'.webp")');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#f4efe9":"#0d2a6b");try{if(localStorage.getItem("rg-lang")==="en"){d.lang="en";d.dir="ltr";}}catch(e){}})();</script>
<title>באלאנסיפיי · Balancify</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="preload" href="../shared/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared/fonts/heebo.css">
<link rel="stylesheet" href="../shared/rg-site.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <a class="back" id="back" href="../"></a>
    <div class="tools">
      <span data-rg-account style="display:inline-flex;min-width:0"></span>
      <button type="button" class="pill" id="bg-btn"></button>
      <button type="button" class="pill" id="theme-btn"><span class="ti"></span><span class="tl"></span></button>
      <div class="lang" role="group" aria-label="Language / שפה">
        <button type="button" id="lang-he" aria-pressed="true">עב</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="home">
    <div class="hero">
      <img src="icon.svg?v=2" alt="" width="60" height="60">
      <div>
        <h1 id="title"></h1>
        <p class="tagline" id="tagline"></p>
      </div>
    </div>
    <nav class="choices" id="choices"></nav>
  </main>

  <main id="list" hidden>
    <button type="button" class="homebtn" id="home-btn"></button>
    <section class="card">
      <h2 id="list-title"></h2>
      <span class="tag" id="list-tag" hidden></span>
      <p class="instr" id="instr"></p>
      <p class="lnote" id="list-note" hidden></p>
      <ul class="items" id="items"></ul>
      <div class="power-box" id="power-box" hidden>
        <form class="padd" onsubmit="return false"><input type="text" id="p-add" enterkeyhint="done" autocomplete="off"><button type="button" class="btn" id="p-add-btn"></button></form>
        <section class="questions" id="questions"></section>
      </div>
      <p class="more" id="list-more" hidden></p>
      <p class="soon" id="soon" hidden></p>
      <div class="listfoot" id="listfoot">
        <span class="count" id="count"></span>
        <button type="button" class="btn" id="clear-btn"></button>
      </div>
    </section>
  </main>

  <div class="rg-install-wrap" id="install-wrap" hidden><button type="button" class="rg-install" id="install-btn"></button><div class="rg-install-hint" id="install-hint" hidden></div></div>
  <footer>
    <p class="crisis" id="crisis"></p>
    <p class="rg-copy"><span lang="he" dir="rtl">© כל הזכויות שמורות לחברת היליפיי בע"מ 2026</span><span lang="en" dir="ltr">© 2026 Healify Ltd. All rights reserved.</span></p>
  </footer>
</div>

<div class="sheet" id="bg-sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="bg-title">
    <div class="sheet-head"><h3 id="bg-title"></h3><button type="button" class="x" id="bg-close" aria-label="Close">✕</button></div>
    <div class="bg-grid" id="bg-grid"></div>
  </div>
</div>

<div class="sheet" id="mv-sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="mv-title">
    <div class="sheet-head"><h3 id="mv-title"></h3></div>
    <div class="mv-grid" id="mv-grid"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="data.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../shared/rg-account.js"></script>
<script>if (window.RGAccount) RGAccount.syncPrefs(["rg-lang", "rg-balancify-theme", "rg-balancify-bg", "rg-balancify-order", "rg-balancify-user"]);</script>
<script src="../shared/rg-topbar.js?v=3" data-slot="header.top"></script>

</body>
</html>
