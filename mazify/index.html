<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>(function(){try{var z=+localStorage.getItem("rg-zoom");if([75,90,110,125,150].indexOf(z)>-1)document.documentElement.style.zoom=z/100;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1238">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מבוכפיי · Mazify</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="../shared/fonts/heebo.css">
<style>
:root{--gold:#f3cf6b;--gold2:#ffe7a3;--blue:#2c5cff;--navy:#0a1238;--ink:#eaf0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#1a2f8a,#070d2e 70%) fixed;color:var(--ink);font-family:Heebo,system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px 16px;text-align:center}
h1{margin:4px 0;font-size:30px;background:linear-gradient(180deg,#fff,var(--gold2) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.btn{border:1px solid rgba(243,207,107,.55);background:rgba(30,52,150,.6);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;cursor:pointer}
.btn.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1d3a;border:none;font-weight:700}
.stats{display:flex;justify-content:center;gap:14px;font-size:15px;margin:4px 0}
.stats b{color:var(--gold2)}
#c{display:block;margin:6px auto;width:100%;max-width:520px;aspect-ratio:1;border-radius:14px;border:1px solid rgba(243,207,107,.4);background:#081040;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:8px;direction:ltr}
.pad button{height:56px;font-size:24px;border-radius:14px;border:1px solid rgba(243,207,107,.45);background:rgba(30,52,150,.6);color:var(--gold2);touch-action:manipulation}
.msg{min-height:24px;color:var(--gold2);font-weight:700}
.hint{font-size:13px;color:#9fb4ff}
#langBtn{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top"><button id="langBtn" type="button">EN</button></div>
  <h1 id="title">מבוכפיי</h1>
  <div class="row">
    <button class="btn on" id="mLevels"></button>
    <button class="btn" id="mDaily"></button>
    <button class="btn" id="mFree"></button>
    <button class="btn" id="sizeBtn"></button>
    <button class="btn" id="newBtn"></button>
  </div>
  <div class="stats"><b id="lvl"></b></div>
  <div class="stats"><span><span id="lTime"></span> <b id="time">0.0</b></span><span><span id="lBest"></span> <b id="best">—</b></span></div>
  <div class="msg" id="msg"></div>
  <canvas id="c" width="520" height="520"></canvas>
  <div class="pad">
    <span></span><button data-d="0,-1">▲</button><span></span>
    <button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
  </div>
  <p class="hint" id="hint"></p>
</div>
<script src="game.js?v=3"></script>
<script src="../shared/rg-topbar.js?v=5" data-nohome="1" data-slot="#top" data-where="prepend"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});</script>

<!-- rg-install v3: button only when the browser offers a real install prompt -->
<style>#rg-inst-w{position:fixed;bottom:14px;inset-inline-start:14px;z-index:9999;font:14px/1.4 Heebo,system-ui,sans-serif}#rg-inst-w[hidden]{display:none}#rg-inst{display:block;font:600 15px/1.2 Heebo,system-ui,sans-serif;background:linear-gradient(135deg,#0b2a6b,#1e4fd1);color:#f5d27a;border:1.5px solid #d4af37;border-radius:22px;padding:9px 40px 9px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}[dir=rtl] #rg-inst{padding:9px 14px 9px 40px}#rg-inst-x{position:absolute;top:-10px;right:-10px;width:32px;height:32px;border-radius:50%;border:1.5px solid #d4af37;background:#0b1a3f;color:#f5d27a;font:700 18px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);padding:0}[dir=rtl] #rg-inst-x{right:auto;left:-10px}</style>
<div id="rg-inst-w" hidden><button id="rg-inst" type="button"></button><button id="rg-inst-x" type="button">✕</button></div>
<script>(function(){
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});}
var K="rg-inst-off",w=document.getElementById("rg-inst-w"),b=document.getElementById("rg-inst"),x=document.getElementById("rg-inst-x"),dp=null;
var T={he:{b:"📲 התקנה למסך הבית",x:"סגירה"},en:{b:"📲 Install app",x:"Close"}};
function L(){var l="";try{l=localStorage.getItem("rg-lang")||"";}catch(e){}if(l!=="en"&&l!=="he")l=/^en/i.test(document.documentElement.lang)?"en":"he";return l;}
function R(){var t=T[L()];b.textContent=t.b;x.title=t.x;x.setAttribute("aria-label",t.x);}
function sa(){return(window.matchMedia&&(matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: minimal-ui)").matches))||navigator.standalone===true;}
function off(){try{return localStorage.getItem(K)==="1";}catch(e){return false;}}
function U(){w.hidden=!(dp&&!sa()&&!off());}
R();U();
addEventListener("storage",function(e){if(e.key==="rg-lang")R();});addEventListener("rg-lang",R);
new MutationObserver(R).observe(document.documentElement,{attributes:true,attributeFilter:["lang","dir"]});
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;U();});
addEventListener("appinstalled",function(){dp=null;U();});
b.onclick=function(){if(!dp)return;var d=dp;dp=null;U();d.prompt();};
x.onclick=function(){try{localStorage.setItem(K,"1");}catch(e){}U();};
})();</script>
<!-- rg-about -->
<script>(function(){var HE="מבוך חדש בכל יום, ומשחק חופשי עם שיא אישי",EN="A new maze every day, plus free play with a personal best";
function L(){var l=localStorage.getItem("rg-lang")||document.documentElement.lang||"he";return /^en/.test(l)?"en":"he";}
var s=document.createElement("style");s.textContent="#rgAbBtn{position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:50%;transform:translateX(-50%);z-index:99998;width:24px;height:24px;border-radius:50%;border:1px solid rgba(212,175,55,.6);background:rgba(13,42,92,.55);color:#f3d77a;font:600 14px/22px system-ui,sans-serif;padding:0;cursor:pointer;opacity:.7}#rgAbBtn:hover{opacity:1}#rgAbOv{position:fixed;inset:0;z-index:99999;background:rgba(4,14,34,.55);display:none;align-items:center;justify-content:center;padding:20px}#rgAbOv.on{display:flex}#rgAbBox{position:relative;max-width:360px;width:100%;background:linear-gradient(160deg,#0d2a5c,#123b7a);color:#fff;border:1px solid #d4af37;border-radius:14px;padding:18px 18px 16px;font:16px/1.5 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)}#rgAbBox h3{margin:0 0 8px;color:#f3d77a;font-size:18px}#rgAbBox p{margin:0}#rgAbX{position:absolute;top:8px;inset-inline-end:8px;background:none;border:0;color:#f3d77a;font-size:20px;cursor:pointer;line-height:1}";
function init(){document.head.appendChild(s);var b=document.createElement("button");b.id="rgAbBtn";b.type="button";b.textContent="i";
var o=document.createElement("div");o.id="rgAbOv";o.innerHTML='<div id="rgAbBox" role="dialog"><button id="rgAbX" type="button">✕</button><h3></h3><p></p></div>';
function open(){var e=L()=="en";var x=o.firstChild;x.dir=e?"ltr":"rtl";x.querySelector("h3").textContent=e?"About":"אודות";x.querySelector("p").textContent=e?EN:HE;o.querySelector("#rgAbX").setAttribute("aria-label",e?"Close":"סגירה");o.classList.add("on");}
function upd(){var e=L()=="en";b.title=e?"About":"אודות";b.setAttribute("aria-label",b.title);}

document.addEventListener("keydown",function(ev){if(ev.key=="Escape")o.classList.remove("on");});
upd();document.body.appendChild(b);document.body.appendChild(o);window.rgAbout=open;}
if(document.body)init();else document.addEventListener("DOMContentLoaded",init);})();</script>
</body>
</html>
