<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1d44">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Plant glowing flowers in a dusk meadow and draw your own constellations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23c9b8ff%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relax">
<script src="lang.js"></script>
<title>Glow Garden</title>
<link rel="preload" href="../shared/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared/fonts/heebo.css">
<link rel="stylesheet" href="../shared/rg-site.css">
<style>
  :root {
    --ui-fg: rgba(238,230,255,0.8); --ui-bg: rgba(20,18,50,0.35); --ui-bd: rgba(255,255,255,0.12);
    --ui-on: rgba(255,226,200,0.95); --ui-on-bd: rgba(255,214,180,0.3);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d44; overscroll-behavior: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #efe8ff; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui {
    position: fixed; z-index: 10;
    top: calc(14px + env(safe-area-inset-top, 0px));
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0; box-sizing: border-box;
    font: inherit; color: var(--ui-fg);
    background: var(--ui-bg); border: 1px solid var(--ui-bd);
    cursor: pointer; touch-action: manipulation; outline: none;
    -webkit-tap-highlight-color: transparent; text-decoration: none;
    transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .ui svg { width: 22px; height: 22px; }
  .ui:focus-visible { border-color: var(--ui-on); }
  #home { left: calc(14px + env(safe-area-inset-left, 0px)); }
  #fs { left: calc(74px + env(safe-area-inset-left, 0px)); }
  #sound { right: calc(14px + env(safe-area-inset-right, 0px)); }
  #sound[aria-pressed="true"] { color: var(--ui-on); border-color: var(--ui-on-bd); }
  #sound .on { display: none; }
  #sound[aria-pressed="true"] .on { display: inline; }
  #sound[aria-pressed="true"] .off { display: none; }

  #hint {
    position: fixed; left: 24px; right: 24px; text-align: center; pointer-events: none;
    top: 40%; font-size: 19px; font-weight: 300; letter-spacing: 0.05em; line-height: 1.6;
    color: rgba(240,232,255,0.85); text-shadow: 0 0 16px rgba(190,160,255,0.5);
    transition: opacity 1.4s ease; opacity: 0;
  }
  #clear {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    min-width: 120px; min-height: 48px; padding: 0 20px; border-radius: 999px;
    font: inherit; font-size: 15px; letter-spacing: 0.05em;
    color: rgba(238,230,255,0.55); background: rgba(20,18,50,0.35); border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer; outline: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
<canvas id="c" aria-label="A dusk meadow. Tap the ground to plant glowing flowers, tap the sky to place stars."></canvas>
<a id="home" class="ui" href="index.html" aria-label="Back to all games">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v8.5h11V10"/></svg>
</a>
<button id="fs" class="ui" aria-label="Full screen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9V4.5H9M19.5 9V4.5H15M4.5 15v4.5H9M19.5 15v4.5H15"/></svg>
</button>
<button id="sound" class="ui" aria-pressed="false" aria-label="Turn sound on">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/>
    <g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
    <g class="on"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></g>
  </svg>
</button>

<div id="hint">Tap the ground to plant a flower<br>Tap the sky to place a star</div>
<button id="clear">New evening</button>
<script>
(function () {
  'use strict';
  // ---------- Shared: gentle Web Audio core (off until the player taps the sound button) ----------
  function AudioCore(build, level) {
    var core = { ctx: null, master: null, reverb: null, on: false };
    level = level || 0.8;
    function impulse(sec) {
      var a = core.ctx, rate = a.sampleRate, len = Math.floor(rate * sec);
      var buf = a.createBuffer(2, len, rate);
      for (var ch = 0; ch < 2; ch++) {
        var d = buf.getChannelData(ch);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      return buf;
    }
    core.noise = function (sec) {
      var a = core.ctx, len = Math.floor(a.sampleRate * sec), buf = a.createBuffer(1, len, a.sampleRate);
      var d = buf.getChannelData(0), last = 0;
      for (var i = 0; i < len; i++) { var w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = last * 3.2 + w * 0.12; }
      return buf;
    };
    core.loop = function (buf) {
      var s = core.ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s;
    };
    function init() {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      var a = core.ctx = new AC();
      var comp = a.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4;
      core.master = a.createGain(); core.master.gain.value = 0;
      core.master.connect(comp); comp.connect(a.destination);
      core.reverb = a.createConvolver(); core.reverb.buffer = impulse(3.2);
      var rev = a.createGain(); rev.gain.value = 0.55;
      core.reverb.connect(rev); rev.connect(core.master);
      if (build) build(core);
      return true;
    }
    core.setOn = function (v) {
      if (v) {
        if (!core.ctx && !init()) return false;
        core.on = true;
        if (core.ctx.state !== 'running') core.ctx.resume();
        var t = core.ctx.currentTime, g = core.master.gain;
        g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(level, t + 1.5);
      } else {
        core.on = false;
        if (!core.ctx) return true;
        var t2 = core.ctx.currentTime, g2 = core.master.gain;
        g2.cancelScheduledValues(t2); g2.setValueAtTime(g2.value, t2); g2.linearRampToValueAtTime(0, t2 + 0.6);
        setTimeout(function () { if (!core.on && core.ctx) core.ctx.suspend(); }, 800);
      }
      return true;
    };
    core.isOn = function () { return core.on; };
    core.ready = function () { return core.on && core.ctx && core.ctx.state === 'running'; };
    core.visibility = function (hidden) {
      if (!core.ctx) return;
      if (hidden) core.ctx.suspend(); else if (core.on) core.ctx.resume();
    };
    // soft bell / kalimba-like tone
    core.bell = function (freq, vel, opt) {
      if (!core.ready()) return;
      opt = opt || {};
      var a = core.ctx, t = a.currentTime + (opt.delay || 0), dec = opt.decay || 3;
      var g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16 * vel, t + (opt.attack || 0.02));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
      var dry = a.createGain(); dry.gain.value = opt.dry == null ? 0.55 : opt.dry;
      g.connect(dry); dry.connect(core.master);
      var wet = a.createGain(); wet.gain.value = opt.wet == null ? 1 : opt.wet;
      g.connect(wet); wet.connect(core.reverb);
      var partials = opt.partials || [[1, 1], [2.0, 0.22], [3.01, 0.07]];
      for (var i = 0; i < partials.length; i++) {
        var o = a.createOscillator(); o.type = 'sine';
        o.frequency.value = freq * partials[i][0];
        var pg = a.createGain(); pg.gain.value = partials[i][1];
        o.connect(pg); pg.connect(g);
        o.start(t); o.stop(t + dec + 0.1);
      }
    };
    // a quiet, slowly breathing chord pad
    core.pad = function (notes, vol, cutoff) {
      var a = core.ctx;
      var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff || 600; f.Q.value = 0.5;
      var pg = a.createGain(); pg.gain.value = 0;
      f.connect(pg); pg.connect(core.master);
      var send = a.createGain(); send.gain.value = 0.5; pg.connect(send); send.connect(core.reverb);
      for (var i = 0; i < notes.length; i++) {
        var vg = a.createGain(); vg.gain.value = vol;
        var o1 = a.createOscillator(); o1.type = 'sine'; o1.frequency.value = notes[i];
        var o2 = a.createOscillator(); o2.type = 'triangle'; o2.frequency.value = notes[i]; o2.detune.value = (i % 2 ? 6 : -6);
        var g2 = a.createGain(); g2.gain.value = 0.3;
        o1.connect(vg); o2.connect(g2); g2.connect(vg);
        var lfo = a.createOscillator(); lfo.frequency.value = 0.035 + i * 0.015;
        var depth = a.createGain(); depth.gain.value = vol * 0.7;
        lfo.connect(depth); depth.connect(vg.gain);
        vg.connect(f);
        o1.start(); o2.start(); lfo.start();
      }
      pg.gain.setTargetAtTime(1, a.currentTime, 2.5);
      return { filter: f, gain: pg };
    };
    return core;
  }

  // ---------- Shared: sound + full-screen buttons ----------
  function setupUI(Sound) {
    var sb = document.getElementById('sound');
    sb.addEventListener('click', function () {
      var want = !Sound.isOn();
      if (!Sound.setOn(want)) return;
      sb.setAttribute('aria-pressed', want ? 'true' : 'false');
      sb.setAttribute('aria-label', RGT(want ? 'Turn sound off' : 'Turn sound on'));
    });
    document.addEventListener('visibilitychange', function () { Sound.visibility(document.hidden); });
    var fb = document.getElementById('fs'), de = document.documentElement;
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!req) { fb.style.display = 'none'; return; }
    fb.addEventListener('click', function () {
      var fe = document.fullscreenElement || document.webkitFullscreenElement;
      if (fe) { var ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) ex.call(document); }
      else { var r = req.call(de); if (r && r.catch) r.catch(function () {}); }
    });
  }


  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var W = 0, H = 0, DPR = 1, HOR = 0;
  var TAU = Math.PI * 2;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(p) { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); }
  function easeOut(p) { p = clamp(p, 0, 1); return 1 - Math.pow(1 - p, 3); }

  function makeGlow(size, rgb, a0) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var g = c.getContext('2d'), m = size / 2, gr = g.createRadialGradient(m, m, 0, m, m, m);
    gr.addColorStop(0, 'rgba(' + rgb + ',' + a0 + ')'); gr.addColorStop(0.25, 'rgba(' + rgb + ',' + (a0 * 0.4) + ')');
    gr.addColorStop(0.6, 'rgba(' + rgb + ',' + (a0 * 0.08) + ')'); gr.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
  }
  var PALETTE = ['255,170,205', '196,176,255', '255,204,160', '160,236,210', '168,212,255', '255,236,170'];
  var glows = {};
  for (var pi = 0; pi < PALETTE.length; pi++) glows[PALETTE[pi]] = makeGlow(128, PALETTE[pi], 0.9);
  var starGlow = makeGlow(64, '240,236,255', 1);

  // ---------- Scenery ----------
  var bg = document.createElement('canvas'), bctx = bg.getContext('2d'), bgStars = [];
  function hill(g, base, amp, freq, seed, color) {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
    for (var x = 0; x <= W + 8; x += 8) g.lineTo(x, base - Math.sin(x * freq + seed) * amp - Math.sin(x * freq * 2.2 + seed * 1.6) * amp * 0.35);
    g.lineTo(W, H); g.closePath(); g.fill();
  }
  function buildBg() {
    bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
    var g = bctx; g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var sky = g.createLinearGradient(0, 0, 0, HOR);
    sky.addColorStop(0, '#141838'); sky.addColorStop(0.5, '#2a2a62'); sky.addColorStop(0.85, '#5a4580'); sky.addColorStop(1, '#8a6090');
    g.fillStyle = sky; g.fillRect(0, 0, W, HOR + 2);
    var glow = g.createRadialGradient(W * 0.5, HOR, 0, W * 0.5, HOR, W * 0.8);
    glow.addColorStop(0, 'rgba(255,190,170,0.28)'); glow.addColorStop(1, 'rgba(255,190,170,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, HOR + 2);
    hill(g, HOR + 4, 14, 0.007, 1.2, '#3a3064');
    hill(g, HOR + 10, 12, 0.011, 3.7, '#2c2954');
    var ground = g.createLinearGradient(0, HOR, 0, H);
    ground.addColorStop(0, '#232447'); ground.addColorStop(0.4, '#1b2140'); ground.addColorStop(1, '#121831');
    g.fillStyle = ground; g.fillRect(0, HOR + 14, W, H - HOR);
    hill(g, HOR + 16, 4, 0.02, 0.4, '#232447');
    // grass texture
    for (var i = 0; i < W * (H - HOR) / 260; i++) {
      var y = rand(HOR + 16, H), s = 0.5 + (y - HOR) / (H - HOR), x = rand(0, W);
      g.strokeStyle = 'rgba(' + (Math.random() < 0.5 ? '90,110,150' : '40,50,90') + ',' + (0.18 + s * 0.12) + ')';
      g.lineWidth = 0.8 * s; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + rand(-2, 2) * s, y - 4 * s, x + rand(-4, 4) * s, y - rand(5, 10) * s); g.stroke();
    }
    bgStars = [];
    var n = Math.round(clamp(W * HOR / 3500, 30, 140));
    for (var j = 0; j < n; j++) bgStars.push({ x: Math.random() * W, y: Math.pow(Math.random(), 1.3) * HOR * 0.9, r: rand(0.3, 1.1), a: rand(0.2, 0.7), ph: rand(0, TAU), sp: rand(0.2, 0.7) });
  }

  // ---------- Flowers ----------
  var flowers = [];
  function plant(x, y) {
    y = Math.max(y, HOR + 18);
    var depth = clamp((y - HOR) / (H - HOR), 0, 1), s = 0.45 + depth * 0.95;
    var f = { x: x, y: y, s: s, h: rand(60, 110) * s, lean: rand(-0.22, 0.22), age: 0, ph: rand(0, TAU),
      col: PALETTE[(Math.random() * PALETTE.length) | 0], kind: (Math.random() * 3) | 0, petals: 5 + ((Math.random() * 4) | 0),
      rot: rand(0, TAU), leaf: rand(0.3, 0.55), leafSide: Math.random() < 0.5 ? -1 : 1, dying: -1, chimed: false };
    flowers.push(f);
    flowers.sort(function (a, b) { return a.y - b.y; });
    var live = 0; for (var i = 0; i < flowers.length; i++) if (flowers[i].dying < 0) live++;
    if (live > 48) { var oldest = null; for (var j = 0; j < flowers.length; j++) if (flowers[j].dying < 0 && (!oldest || flowers[j].age > oldest.age)) oldest = flowers[j]; if (oldest) oldest.dying = 0; }
    Sound.plant(x);
    return f;
  }
  function drawFlower(f, t, dt) {
    f.age += dt;
    var fade = 1;
    if (f.dying >= 0) { f.dying += dt; fade = 1 - smooth(f.dying / 2.5); }
    if (fade <= 0) return false;
    var g = easeOut(f.age / 2.6), b = easeOut((f.age - 1.9) / 2.2);
    if (!f.chimed && f.age > 1.9) { f.chimed = true; Sound.bloom(f); }
    var sway = Math.sin(t * 0.55 + f.ph) * 5 * f.s * g + Math.sin(t * 1.3 + f.ph * 2) * 1.2 * f.s;
    var tipX = f.x + f.lean * f.h * g + sway, tipY = f.y - f.h * g;
    var cX = f.x + f.lean * f.h * 0.15 + sway * 0.3, cY = f.y - f.h * g * 0.55;
    ctx.globalAlpha = fade;
    // stem
    ctx.strokeStyle = 'rgba(120,190,160,0.75)'; ctx.lineWidth = 1.8 * f.s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo(cX, cY, tipX, tipY); ctx.stroke();
    // leaf
    var la = smooth((f.age - 0.8) / 1.2);
    if (la > 0) {
      var lt = f.leaf, lx = (1 - lt) * (1 - lt) * f.x + 2 * (1 - lt) * lt * cX + lt * lt * tipX, ly = (1 - lt) * (1 - lt) * f.y + 2 * (1 - lt) * lt * cY + lt * lt * tipY;
      ctx.save(); ctx.translate(lx, ly); ctx.rotate(f.leafSide * (0.9 + Math.sin(t * 0.7 + f.ph) * 0.08) - Math.PI / 2 * 0);
      ctx.fillStyle = 'rgba(110,180,150,0.7)';
      ctx.beginPath(); ctx.ellipse(f.leafSide * 9 * f.s * la, -4 * f.s * la, 10 * f.s * la, 3.4 * f.s * la, f.leafSide * -0.5, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // glow on the ground
    if (b > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = fade * b * 0.12;
      var gw = 60 * f.s;
      ctx.drawImage(glows[f.col], f.x - gw, f.y - gw * 0.3, gw * 2, gw * 0.6);
      // bloom halo
      var pulse = 0.85 + 0.15 * Math.sin(t * 0.8 + f.ph);
      ctx.globalAlpha = fade * b * 0.75 * pulse;
      var hs = 64 * f.s * (0.6 + 0.4 * b);
      ctx.drawImage(glows[f.col], tipX - hs / 2, tipY - hs / 2, hs, hs);
      ctx.globalCompositeOperation = 'source-over';
      // petals
      f.rot += dt * 0.05;
      ctx.save(); ctx.translate(tipX, tipY);
      var pr = 11 * f.s * b;
      ctx.globalAlpha = fade * 0.9;
      ctx.fillStyle = 'rgba(' + f.col + ',0.85)';
      if (f.kind === 0) {           // daisy
        for (var i = 0; i < f.petals + 3; i++) { var a = f.rot + i / (f.petals + 3) * TAU; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(pr * 0.7, 0, pr * 0.7, pr * 0.2, 0, 0, TAU); ctx.fill(); ctx.restore(); }
      } else if (f.kind === 1) {    // round blossom
        for (var j = 0; j < f.petals; j++) { var a2 = f.rot + j / f.petals * TAU; ctx.beginPath(); ctx.arc(Math.cos(a2) * pr * 0.55, Math.sin(a2) * pr * 0.55, pr * 0.5, 0, TAU); ctx.fill(); }
      } else {                      // tulip cup
        ctx.rotate(f.lean * 0.6 + sway * 0.01);
        for (var k = -1; k <= 1; k++) { ctx.save(); ctx.rotate(k * 0.45 * b); ctx.beginPath(); ctx.ellipse(0, -pr * 0.55, pr * 0.42, pr * 0.85, 0, 0, TAU); ctx.fill(); ctx.restore(); }
      }
      ctx.fillStyle = 'rgba(255,250,235,' + (0.9 * b) + ')';
      ctx.beginPath(); ctx.arc(0, f.kind === 2 ? -pr * 0.2 : 0, pr * 0.22, 0, TAU); ctx.fill();
      ctx.restore();
      // pollen motes
      if (!reduceMotion && Math.random() < dt * 0.25 * b) motes.push({ x: tipX, y: tipY, vx: rand(-4, 4), vy: rand(-10, -5), age: 0, life: rand(4, 7), col: f.col });
    } else if (g > 0.3) {
      ctx.fillStyle = 'rgba(' + f.col + ',0.5)';
      ctx.beginPath(); ctx.arc(tipX, tipY, 2.4 * f.s, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    return true;
  }

  // ---------- Stars & constellations ----------
  var stars = [];
  function placeStar(x, y) {
    y = Math.min(y, HOR - 10);
    var st = { x: x, y: y, age: 0, r: rand(1.6, 2.6), ph: rand(0, TAU), link: null, dying: -1 };
    var prev = null;
    for (var i = stars.length - 1; i >= 0; i--) if (stars[i].dying < 0) { prev = stars[i]; break; }
    if (prev && prev.age < 25) {
      var dx = prev.x - x, dy = prev.y - y;
      if (Math.sqrt(dx * dx + dy * dy) < Math.max(W, H) * 0.35) st.link = prev;
    }
    stars.push(st);
    var live = 0; for (var j = 0; j < stars.length; j++) if (stars[j].dying < 0) live++;
    if (live > 36) for (var k = 0; k < stars.length; k++) if (stars[k].dying < 0) { stars[k].dying = 0; break; }
    Sound.star(y);
  }
  function drawStars(t, dt) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (var i = stars.length - 1; i >= 0; i--) {
      var s = stars[i]; s.age += dt;
      var fade = 1; if (s.dying >= 0) { s.dying += dt; fade = 1 - smooth(s.dying / 2.5); }
      if (fade <= 0) { for (var j = 0; j < stars.length; j++) if (stars[j].link === s) stars[j].link = null; stars.splice(i, 1); continue; }
      if (s.link) {
        var p = easeOut(s.age / 1.4), lx = s.x + (s.link.x - s.x) * p, ly = s.y + (s.link.y - s.y) * p;
        ctx.globalAlpha = 0.22 * fade; ctx.strokeStyle = 'rgb(220,210,255)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(lx, ly); ctx.stroke();
      }
      var tw = 0.75 + 0.25 * Math.sin(t * 1.3 + s.ph), inA = easeOut(s.age / 0.8);
      var sz = s.r * 12 * inA * (1 + 0.6 * Math.max(0, 1 - s.age / 0.6));
      ctx.globalAlpha = fade * tw;
      ctx.drawImage(starGlow, s.x - sz / 2, s.y - sz / 2, sz, sz);
      ctx.fillStyle = 'rgb(255,252,240)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.6 * inA, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  var motes = [];
  function drawMotes(dt) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (var i = motes.length - 1; i >= 0; i--) {
      var m = motes[i]; m.age += dt;
      if (m.age > m.life) { motes.splice(i, 1); continue; }
      m.x += (m.vx + Math.sin(m.age * 0.9) * 5) * dt; m.y += m.vy * dt;
      var a = Math.sin(Math.PI * m.age / m.life);
      ctx.globalAlpha = a * 0.7; ctx.drawImage(glows[m.col], m.x - 7, m.y - 7, 14, 14);
    }
    ctx.restore();
    if (motes.length > 80) motes.splice(0, motes.length - 80);
  }

  // ---------- Sound ----------
  var SCALE = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0];
  var Sound = AudioCore(function (core) { core.pad([130.81, 196.0, 261.63, 329.63], 0.02, 520); }, 0.8);
  Sound.plant = function (x) {
    var idx = clamp(Math.round(clamp(x / W, 0, 1) * 5), 0, 5);
    Sound.bell(SCALE[idx] / 2, 0.35, { decay: 2.5, attack: 0.05 });
  };
  Sound.bloom = function (f) {
    var idx = clamp(Math.round(clamp(f.x / W, 0, 1) * 5) + 2, 0, SCALE.length - 1);
    Sound.bell(SCALE[idx], 0.55, { decay: 4 });
  };
  Sound.star = function (y) {
    var idx = clamp(SCALE.length - 1 - Math.round(clamp(y / HOR, 0, 1) * 4), 0, SCALE.length - 1);
    Sound.bell(SCALE[idx] * 2, 0.3, { decay: 4.5, partials: [[1, 1], [2.99, 0.12], [5.02, 0.04]] });
  };
  setupUI(Sound);

  document.getElementById('clear').addEventListener('click', function () {
    for (var i = 0; i < flowers.length; i++) if (flowers[i].dying < 0) flowers[i].dying = 0;
    for (var j = 0; j < stars.length; j++) if (stars[j].dying < 0) stars[j].dying = 0;
  });

  // ---------- Input ----------
  var trails = {}, hintOn = true;
  function down(id, x, y) {
    if (hintOn) { hintOn = false; hint.style.opacity = '0'; }
    if (y < HOR + 6) { placeStar(x, y); trails[id] = null; }
    else { plant(x, y); trails[id] = { x: x, y: y }; }
  }
  function move(id, x, y) {
    var s = trails[id]; if (!s || y < HOR + 6) return;
    var depth = clamp((y - HOR) / (H - HOR), 0, 1), gap = 34 + 40 * depth;
    var dx = x - s.x, dy = y - s.y;
    if (dx * dx + dy * dy > gap * gap) { s.x = x; s.y = y; plant(x, y); }
  }
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; down('t' + t.identifier, t.clientX, t.clientY); }
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; move('t' + t.identifier, t.clientX, t.clientY); }
  }, { passive: false });
  function tend(e) { for (var i = 0; i < e.changedTouches.length; i++) delete trails['t' + e.changedTouches[i].identifier]; }
  canvas.addEventListener('touchend', tend); canvas.addEventListener('touchcancel', tend);
  canvas.addEventListener('pointerdown', function (e) { if (e.pointerType === 'touch') return; down('p' + e.pointerId, e.clientX, e.clientY); });
  window.addEventListener('pointermove', function (e) { if (e.pointerType === 'touch') return; move('p' + e.pointerId, e.clientX, e.clientY); });
  window.addEventListener('pointerup', function (e) { delete trails['p' + e.pointerId]; });
  window.addEventListener('pointercancel', function (e) { delete trails['p' + e.pointerId]; });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- Resize / loop ----------
  function resize() {
    var oldW = W, oldH = H, oldHor = HOR;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight; HOR = Math.round(H * 0.5);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildBg();
    if (oldW) {
      for (var i = 0; i < flowers.length; i++) { var f = flowers[i]; f.x = f.x / oldW * W; f.y = HOR + (f.y - oldHor) / (oldH - oldHor) * (H - HOR); }
      for (var j = 0; j < stars.length; j++) { stars[j].x = stars[j].x / oldW * W; stars[j].y = stars[j].y / oldHor * HOR; }
    }
  }
  window.addEventListener('resize', resize);

  var last = performance.now() / 1000;
  function frame(ms) {
    var t = ms / 1000, dt = clamp(t - last, 0, 0.05); last = t;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0, W, H);
    ctx.fillStyle = '#fff';
    for (var i = 0; i < bgStars.length; i++) {
      var s = bgStars[i]; ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(t * s.sp + s.ph));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawStars(t, dt);
    for (var j = 0; j < flowers.length; j++) if (!drawFlower(flowers[j], t, dt)) { flowers.splice(j, 1); j--; }
    drawMotes(dt);
    requestAnimationFrame(frame);
  }

  resize();
  // a few flowers already waiting for you
  (function seed() {
    var pts = [[0.22, 0.72], [0.7, 0.66], [0.52, 0.86]];
    for (var i = 0; i < pts.length; i++) { var f = plant(W * pts[i][0], H * pts[i][1]); f.age = 5; f.chimed = true; }
  })();
  setTimeout(function () { if (hintOn) hint.style.opacity = '1'; }, 800);
  setTimeout(function () { hint.style.opacity = '0'; hintOn = false; }, 8000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
