      help: {"desktop": "<ul><li>משאירים את קלוקיפיי פתוח, בלשונית או כאפליקציה מותקנת. אפשר לעבור לחלונות אחרים או למזער אותו, אבל לא לסגור.</li><li>המחשב צריך להישאר ער. כשסוגרים את המכסה או שהמחשב נכנס למצב שינה, לא יהיה צלצול. בהגדרות החשמל של Windows או של המק אפשר לקבוע שהמחשב לא יירדם כשהוא מחובר לחשמל.</li><li>כשקלוקיפיי ברקע, הדפדפן מאט אותו, ולכן הצלצול יכול להתעכב עד כדקה.</li><li>כדי שהדפדפן לא ירדים את הלשונית: ב־Chrome נכנסים להגדרות ← ביצועים, ומוסיפים את האתר לרשימת האתרים שתמיד יישארו פעילים. ב־Edge: הגדרות ← מערכת וביצועים ← „לעולם אל תכניס את האתרים האלה למצב שינה”.</li><li>הרמקולים צריכים להיות פתוחים, והלשונית לא מושתקת.</li><li>לחיצה על „הפעלת התראות” תקפיץ הודעה גם כשהחלון מאחור. „נא לא להפריע” ב־Windows או „ריכוז” במק מסתירים את ההודעה, אבל הצליל עצמו עדיין יישמע.</li></ul><p class=\"tip\">לשעון חשוב (תרופות, יציאה מהבית) כדאי לכוון גם שעון מעורר בטלפון.</p>", "android": "<ul><li>קלוקיפיי צריך להיות פתוח על המסך. כשהמסך כבה או כשעוברים לאפליקציה אחרת, אנדרואיד עוצר את הדף אחרי זמן קצר, והשעון עלול לא לצלצל. גם התקנה למסך הבית לא משנה את זה.</li><li>לפני שהולכים לישון: פותחים את קלוקיפיי, לוחצים „מסך דלוק” ומחברים למטען. המסך יישאר דלוק כל עוד קלוקיפיי פתוח על המסך.</li><li>הצליל יוצא בעוצמת המדיה, לא בעוצמת הצלצול, אז צריך להעלות את עוצמת המדיה. במצב „נא לא להפריע” זה תלוי בהגדרות הטלפון, אז כדאי לבדוק עם „בדיקת צליל”.</li><li>מאשרים התראות. ההתראה מופיעה רק כשקלוקיפיי פועל, ולא כשהוא סגור.</li><li>כדאי לבטל את חיסכון הסוללה לדפדפן: הגדרות ← אפליקציות ← Chrome ← סוללה ← „ללא הגבלה”.</li></ul><p class=\"tip\">לשעון חשוב (תרופות, יציאה מהבית) כוון גם את השעון המעורר המובנה בטלפון. אפשר גם ללחוץ למטה על „הוסף את השעונים ליומן”: היומן מזכיר גם כשהמסך כבוי, אבל זו התראה קצרה ולא צלצול מתמשך.</p>", "ios": "<ul><li>באייפון ובאייפד קלוקיפיי מצלצל רק כשהוא פתוח על המסך והמסך דלוק. כשנועלים את המסך, חוזרים למסך הבית או עוברים לאפליקציה אחרת, iOS עוצר את הדף מיד, ולא יהיה צלצול וגם לא התראה. גם התקנה למסך הבית לא משנה את זה.</li><li>כשמתג השקט בצד הטלפון מופעל, הצליל לא יישמע. אתרים גם לא יכולים להפעיל רטט באייפון.</li><li>אם בכל זאת משאירים את קלוקיפיי פתוח: מחברים למטען, לוחצים „מסך דלוק” אם הכפתור מופיע, או בוחרים בהגדרות ← תצוגה ובהירות ← נעילה אוטומטית ← „אף פעם”.</li></ul><p class=\"tip\">באייפון כדאי לסמוך על השעון המעורר של אפליקציית „שעון”, ולהשתמש בקלוקיפיי לרשימת המשימות. אפשר גם ללחוץ למטה על „הוסף את השעונים ליומן”: היומן מזכיר גם כשהמסך נעול, אבל זו התראה קצרה ולא צלצול מתמשך.</p>"},

      note: "<b>Good to know:</b> Clockify rings only while it is open and running. When it is closed, or the device is asleep or locked, it will not ring, even if you installed it as an app. After opening it, tap the page once and press “Test sound” to make sure you hear it. What to do depends on your device:",

      help: {"desktop": "<ul><li>Keep Clockify open, in a tab or as an installed app. You can switch to other windows or minimize it, but don't close it.</li><li>The computer must stay awake. If you close the lid or it goes to sleep, there will be no alarm. In the Windows or Mac power settings you can stop it from sleeping while plugged in.</li><li>When Clockify is in the background the browser slows it down, so the alarm can be up to about a minute late.</li><li>To stop the browser from putting the tab to sleep: in Chrome go to Settings → Performance and add this site to the sites that always stay active. In Edge: Settings → System and performance → “Never put these sites to sleep”.</li><li>Speakers must be on and the tab not muted.</li><li>Press “Enable notifications” to get a pop-up even when the window is behind others. Do Not Disturb on Windows or Focus on Mac hides the pop-up, but the sound still plays.</li></ul><p class=\"tip\">For an important alarm (pills, leaving home) also set an alarm on your phone.</p>", "android": "<ul><li>Clockify needs to be open on the screen. When the screen turns off or you switch to another app, Android pauses the page after a short while and the alarm may not ring. Installing it to the home screen doesn't change this.</li><li>Before you go to sleep: open Clockify, press “Keep screen on” and plug in the charger. The screen stays on as long as Clockify is open on it.</li><li>The sound plays at media volume, not ringer volume, so turn the media volume up. In Do Not Disturb it depends on your phone settings, so check with “Test sound”.</li><li>Allow notifications. They only appear while Clockify is running, not when it is closed.</li><li>Turn off battery saving for the browser: Settings → Apps → Chrome → Battery → “Unrestricted”.</li></ul><p class=\"tip\">For an important alarm (pills, leaving home) also set the phone's built-in alarm clock. You can also press “Add alarms to phone calendar” below: the calendar reminds you even with the screen off, but it is a short alert, not a ringing alarm.</p>", "ios": "<ul><li>On iPhone and iPad, Clockify rings only while it is open on the screen and the screen is on. When you lock the screen, go to the home screen or switch apps, iOS pauses the page right away, so there is no sound and no notification. Installing it to the home screen doesn't change this.</li><li>When the silent switch on the side of the phone is on, you won't hear the sound. Websites also can't vibrate an iPhone.</li><li>If you still leave Clockify open: plug in the charger, press “Keep screen on” if the button shows, or set Settings → Display &amp; Brightness → Auto-Lock → “Never”.</li></ul><p class=\"tip\">On iPhone, rely on the alarm in the Clock app and use Clockify for the task list. You can also press “Add alarms to phone calendar” below: the calendar reminds you even when the phone is locked, but it is a short alert, not a ringing alarm.</p>"},

      var id = del.getAttribute("data-id"), c = cats.filter(function (x) { return x.id === id; })[0]; if (!c) return;
      var k = alarms.filter(function (a) { return a.cat === id; }).length;
      if (!confirm(t("confirmDelCat")(cname(c), k))) return;
      var r = C.removeCategory(alarms, cats, id); cats = r.cats; alarms = r.alarms;
      if (filter === id) { filter = "all"; localStorage.setItem(FILT, filter); }
      saveCats(); save(); renderCatRows(); renderList(); renderCatSelect(); toast(t("catDeleted"));
    }
  });
  $("cats-sheet").addEventListener("change", function (e) {
    var el = e.target;
    if (el.classList.contains("snd-sel")) {
      var id = el.getAttribute("data-id");
      if (!id) { defSound = el.value; localStorage.setItem(DEFSND, defSound); }
      else { cats.forEach(function (c) { if (c.id === id) c.sound = el.value; }); saveCats(); }
      S.play(audio(), el.value);
    } else if (el.classList.contains("cat-name")) {
      var row = el.closest(".catrow"), cid = row.getAttribute("data-id");
      if (C.renameCategory(cats, cid, el.value)) { saveCats(); renderList(); renderCatSelect(); toast(t("catRenamed")); }
      else { var c0 = cats.filter(function (x) { return x.id === cid; })[0]; el.value = cname(c0); toast(t("errCatName")); }
    }
  });
  $("addcat-form").onsubmit = function (e) {
    e.preventDefault();
    var c = C.addCategory(cats, $("addcat-name").value, defSound);
    if (!c) { toast(t("errCatName")); return; }
    saveCats(); $("addcat-name").value = ""; renderCatRows(); renderList(); renderCatSelect(); toast(t("catAdded"));
  };
  // chip row: arrows, wheel, mouse drag (desktop); native swipe on touch
  function rtlDir() { return document.documentElement.dir === "rtl"; }
  function updateArrows() {
    var c = $("chips"), pos = Math.abs(c.scrollLeft), max = c.scrollWidth - c.clientWidth, over = max > 4;
    $("chip-prev").hidden = !over || pos <= 4;
    $("chip-next").hidden = !over || pos >= max - 4;
  }
  function scrollChips(dir) { var c = $("chips"); c.scrollBy({ left: dir * (rtlDir() ? -1 : 1) * Math.max(160, c.clientWidth * 0.7), behavior: "smooth" }); }
  $("chip-prev").onclick = function () { scrollChips(-1); };
  $("chip-next").onclick = function () { scrollChips(1); };
  $("chips").addEventListener("scroll", updateArrows, { passive: true });
  window.addEventListener("resize", updateArrows);
  $("chips").addEventListener("wheel", function (e) {
    var c = $("chips"); if (c.scrollWidth <= c.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault(); c.style.scrollBehavior = "auto"; c.scrollLeft += (rtlDir() ? -1 : 1) * e.deltaY; c.style.scrollBehavior = "";
  }, { passive: false });
  (function () {
    var c = $("chips"), down = false, moved = false, x0 = 0, s0 = 0;
    c.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse" || e.button !== 0) return; down = true; moved = false; x0 = e.clientX; s0 = c.scrollLeft; });
    window.addEventListener("pointermove", function (e) {
      if (!down) return; var dx = e.clientX - x0;
      if (!moved && Math.abs(dx) > 5) { moved = true; c.classList.add("dragging"); }
      if (moved) c.scrollLeft = s0 - dx;
    });
    window.addEventListener("pointerup", function () { if (!down) return; down = false; setTimeout(function () { c.classList.remove("dragging"); }, 0); });
  })();

  /* ---------- night / light + background picker (own keys: rg-alarm-theme, rg-alarm-bg, rg-alarm-bg-light) ---------- */
  var THEME_KEY = "rg-alarm-theme", BG_KEY = "rg-alarm-bg", LBG_KEY = "rg-alarm-bg-light";
  var DE = document.documentElement;
  var theme = DE.getAttribute("data-theme") === "light" ? "light" : "dark", bg = DE.getAttribute("data-bg") || "0", lbg = DE.getAttribute("data-lbg") || "0";
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg>';
  function themeColor() { return theme === "light" ? ((window.RG_LBG_TC || {})[lbg] || "#f3efe6") : ((window.RG_BG_TC || {})[bg] || "#0f172a"); }
  function applyTheme() {
    DE.setAttribute("data-theme", theme); DE.setAttribute("data-bg", bg); DE.setAttribute("data-lbg", lbg);
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", themeColor());
    var b = $("theme-btn");
    b.querySelector(".ti").innerHTML = theme === "light" ? MOON : SUN;
    b.querySelector(".tl").textContent = theme === "light" ? t("dark") : t("light");
    b.setAttribute("aria-label", theme === "light" ? t("toDark") : t("toLight")); b.title = b.getAttribute("aria-label");
    if (!$("bg-sheet").hidden) renderSwatches();
  }
  function validBg(v) { return /^([0-9]|10)$/.test(String(v)) ? String(v) : "0"; }
  function readThemeFromStorage() {
    theme = localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark";
    bg = validBg(localStorage.getItem(BG_KEY) || "0"); lbg = validBg(localStorage.getItem(LBG_KEY) || "0"); applyTheme();
  }
  function setTheme(v) { theme = v === "light" ? "light" : "dark"; try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} applyTheme(); }
  function setBg(v, mode) {
    v = validBg(v);
    if ((mode || theme) === "light") { lbg = v; try { localStorage.setItem(LBG_KEY, v); } catch (e) {} }
    else { bg = v; try { localStorage.setItem(BG_KEY, v); } catch (e) {} }
    applyTheme(); renderSwatches();
  }
  function renderSwatches() {
    var light = theme === "light", cur = light ? lbg : bg, names = light ? t("lbgs") : t("bgs"), html = "";
    for (var i = 0; i <= 10; i++) {
      var pv = i === 0 ? (light ? "linear-gradient(180deg,#f6f2ea 0%,#ebe5d8 100%)" : "linear-gradient(180deg,#0f172a 0%,#1e293b 100%)")
        : light ? "var(--lbgi-" + i + "),var(--lbgc-" + i + ")" : "var(--bgi-" + i + "),var(--bgc-" + i + ")";
      html += '<button type="button" class="sw" data-bg="' + i + '" aria-pressed="' + (String(i) === cur ? "true" : "false") + '">' +
        '<span class="pv" style="background:' + pv + '"><span class="num">' + (i === 0 ? "★" : i) + "</span></span>" +
        '<span class="nm">' + esc(names[i]) + "</span></button>";
    }
    $("swatches").innerHTML = html;
  }
  $("theme-btn").onclick = function () { setTheme(theme === "light" ? "dark" : "light"); };
  $("bg-btn").onclick = function () { renderSwatches(); $("bg-sheet").hidden = false; };
  $("bg-close").onclick = function () { $("bg-sheet").hidden = true; };
  $("bg-sheet").addEventListener("click", function (e) {
    if (e.target === $("bg-sheet")) { $("bg-sheet").hidden = true; return; }
    var b = e.target.closest && e.target.closest(".sw"); if (b) setBg(b.getAttribute("data-bg"));
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("bg-sheet").hidden) $("bg-sheet").hidden = true;
    if (!$("cats-sheet").hidden) closeCats();
  });
  window.__alarmTheme = { setTheme: setTheme, setBg: setBg, readThemeFromStorage: readThemeFromStorage };

  /* ---------- wiring ---------- */
  $("he").onclick = function () { lang = "he"; localStorage.setItem(LANG, lang); render(); };
  $("en").onclick = function () { lang = "en"; localStorage.setItem(LANG, lang); render(); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("editor").hidden) closeEditor(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { loop(); if (wantWake && !wakeLock) requestWake(); }
  });
  window.addEventListener("storage", function (e) {
    if (e.key === KEY) { alarms = load(KEY, alarms); renderList(); }
    if (e.key === SNZ) { snoozes = load(SNZ, snoozes); }
    if (e.key === CATS) { cats = load(CATS, cats); renderList(); renderCatSelect(); if (!$("cats-sheet").hidden) renderCatRows(); }
    if (e.key === DEFSND) { defSound = e.newValue || S.DEFAULT; }
    if (e.key === THEME_KEY || e.key === BG_KEY || e.key === LBG_KEY) { readThemeFromStorage(); }
    if (e.key === LANG) { lang = e.newValue === "en" ? "en" : "he"; render(); }
  });

  render(); updateInstall(); loop();
  setInterval(loop, 1000);
  window.__alarmApp = { check: check, get alarms() { return alarms; }, get ringing() { return ringing; }, get cats() { return cats; }, soundOfItem: soundOfItem };
})();
</script>
<script src="../shared/rg-account.js"></script>
<script>if (window.RGAccount) RGAccount.syncPrefs(["rg-lang", "rg-alarm-theme", "rg-alarm-bg", "rg-alarm-bg-light"], function (c) {
  if ("rg-lang" in c) { var b = document.getElementById(c["rg-lang"] === "en" ? "en" : "he"); if (b) b.click(); }
  if (("rg-alarm-theme" in c || "rg-alarm-bg" in c || "rg-alarm-bg-light" in c) && window.__alarmTheme) window.__alarmTheme.readThemeFromStorage();
  return true;
});</script>
<script src="../shared/rg-topbar.js" data-slot=".top"></script>
</body>
