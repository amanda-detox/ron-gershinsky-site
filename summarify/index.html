<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a3f">
<meta name="robots" content="noindex">
<title>סיכומים · עדכוניפיי</title>
<link rel="canonical" href="../news/?tab=summaries">
<script>
/* Summarify now lives in Updatify. Keep ?item= / #item= so old summary links open the same summary. */
(function () {
  var item = null;
  try { item = new URLSearchParams(location.search).get("item"); } catch (e) {}
  if (!item) {
    var m = /(?:^#|&)item=([^&]+)/.exec(location.hash || "");
    if (m) { try { item = decodeURIComponent(m[1]); } catch (e2) { item = m[1]; } }
  }
  var dest = "../news/?tab=summaries" + (item ? "&item=" + encodeURIComponent(String(item).slice(0, 200)) : "");
  try { location.replace(dest); } catch (e3) { location.href = dest; }
})();
</script>
<meta http-equiv="refresh" content="0; url=../news/?tab=summaries">
</head>
<body style="margin:0;background:#0a1a3f;color:#f4f7ff;font-family:Heebo,system-ui,sans-serif">

</body>
</html>
