<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<script>/* display size (rg-zoom, set from the top bar) before first paint */(function(){try{var z=+localStorage.getItem("rg-zoom");if([75,90,110,125,150].indexOf(z)>-1)document.documentElement.style.zoom=z/100;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a3f">
<meta name="robots" content="noindex">
<title>יומןלי</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg?v=5" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יומןלי">
<script>(function(){var d=document.documentElement,l,t;try{l=localStorage.getItem("rg-lang");t=localStorage.getItem("rg-home-theme");}catch(e){}if(l==="en"){d.lang="en";d.dir="ltr";}d.setAttribute("data-theme",t==="light"?"light":"dark");if(t==="light"){var m=document.querySelector("meta[name=theme-color]");if(m)m.content="#f3efe6";}})();</script>
<link rel="preload" href="../../shared/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts/heebo.css">
<link rel="stylesheet" href="../../shared/rg-site.css">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="../care.css">
<style>
  .hidden { display: none !important; }
  .jentry { align-items: flex-start !important; }
  .jtext { margin: 4px 0 2px; white-space: pre-wrap; line-height: 1.6; font-size: 15.5px; overflow-wrap: anywhere; }
  .jfilters { display: flex; gap: 8px; margin-top: 10px; }
  .jfilters > * { flex: 1 1 50%; }
  .sec h2 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  details.jtopics > summary { cursor: pointer; list-style: none; }
  details.jtopics > summary::-webkit-details-marker { display: none; }
  details.jtopics > summary h2 { display: inline; }
  details.jtopics > summary::after { content: " ▾"; color: var(--muted); }
  details.jtopics form { margin-top: 10px; display: flex; gap: 8px; }
</style>
<script src="../../shared/rg-bg.js" data-app="myjournal" data-slot=".topbar .tools" data-before="#theme-btn"></script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="tools">
      <label class="langsel"><span class="globe" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><select id="lang-sel"><option value="he">עברית</option><option value="en">English</option></select><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span></label>
      <span data-rg-account></span>
      <button type="button" class="themebtn" id="theme-btn"></button>
    </div>
  </header>
  <div class="backrow"><a class="back" href="../" data-i18n="backHub"></a></div>
  <section class="card gate" data-when="out" hidden>
    <div class="lock" aria-hidden="true">🔒</div>
    <h2 data-i18n="gateTitle"></h2>
    <p data-i18n="gateText"></p>
    <span data-rg-account></span>
  </section>
  <main data-when="in" hidden>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div id="panels"></div>
  </main>
  <p class="privnote" data-i18n="privNote"></p>
  <div class="rg-install-wrap" id="install-wrap"><button type="button" class="rg-install" id="install-btn" data-i18n="install"></button><div class="rg-install-hint" id="install-hint" hidden></div></div>
  <footer data-i18n="footer"></footer>
</div>
<script src="strings.js?v=2"></script>
<script src="../../shared/rg-account.js"></script>
<script src="../common.js"></script>
<script src="../store.js?v=2"></script>
<script src="app.js?v=2"></script>
<script src="../../shared/rg-topbar.js?v=3" data-slot=".topbar"></script>
</body>
</html>
