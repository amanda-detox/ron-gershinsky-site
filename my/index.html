<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<script>/* display size (rg-zoom, set from the top bar) before first paint */(function(){try{var z=+localStorage.getItem("rg-zoom");if([75,90,110,125,150].indexOf(z)>-1)document.documentElement.style.zoom=z/100;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a3f">
<meta name="robots" content="noindex">
<title>האפליקציות הפרטיות שלי</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הפרטי שלי">
<script>(function(){var d=document.documentElement,l,t;try{l=localStorage.getItem("rg-lang");t=localStorage.getItem("rg-home-theme");}catch(e){}if(l==="en"){d.lang="en";d.dir="ltr";}d.setAttribute("data-theme",t==="light"?"light":"dark");if(t==="light"){var m=document.querySelector("meta[name=theme-color]");if(m)m.content="#f3efe6";}})();</script>
<link rel="preload" href="../shared/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared/fonts/heebo.css">
<link rel="stylesheet" href="../shared/rg-site.css">
<link rel="stylesheet" href="common.css">
<style>
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 16px; text-align: center; text-decoration: none; color: var(--fg); transition: transform .15s, border-color .15s; }
  .app:hover { transform: translateY(-2px); border-color: var(--line2); }
  .app img { width: 64px; height: 64px; border-radius: 16px; }
  .app b { font-size: 17px; }
  .app span { color: var(--muted); font-size: 13.5px; line-height: 1.35; }
  .app.soon { border-style: dashed; box-shadow: none; background: transparent; color: var(--faint); justify-content: center; min-height: 150px; }
  .app.soon:hover { transform: none; }
  .app.soon .plus { font-size: 30px; line-height: 1; color: var(--faint); }
</style>
<script src="../shared/rg-bg.js" data-app="my" data-slot=".topbar .tools" data-before="#theme-btn"></script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="tools">
      <label class="langsel"><span class="globe" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><select id="lang-sel"><option value="he">עברית</option><option value="en">English</option></select><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span></label>
      <span data-rg-account></span>
      <button type="button" class="themebtn" id="theme-btn"></button>
    </div>
  </header>
  <div class="backrow"><a class="back" href="../" data-i18n="back"></a></div>
  <div class="hero">
    <img src="icon-192.png" alt="" width="56" height="56">
    <div><h1 data-i18n="title"></h1><p class="sub" data-i18n="sub"></p></div>
  </div>

  <section class="card gate" data-when="out" hidden>
    <div class="lock" aria-hidden="true">🔒</div>
    <h2 data-i18n="gateTitle"></h2>
    <p data-i18n="gateText"></p>
    <span data-rg-account></span>
  </section>

  <main data-when="in" hidden>
    <div class="apps">
      <a class="card app" href="shopping/"><img src="shopping/icon-192.png" alt="" width="64" height="64"><b data-i18n="shopName"></b><span data-i18n="shopDesc"></span></a>
      <a class="card app" href="ideas/"><img src="ideas/icon-192.png" alt="" width="64" height="64"><b data-i18n="ideasName"></b><span data-i18n="ideasDesc"></span></a>
      <a class="card app" href="clock/" hidden style="display:none"><!-- hidden 2026-10-28 at Ron's request; remove hidden + style to show again --><img src="clock/icon-192.png" alt="" width="64" height="64"><b data-i18n="clockName"></b><span data-i18n="clockDesc"></span></a>
      <a class="card app" href="rehabify/"><img src="rehabify/icon-192.png" alt="" width="64" height="64"><b data-i18n="rehabName"></b><span data-i18n="rehabDesc"></span></a>
      <a class="card app" href="calmify/"><img src="calmify/icon-192.png" alt="" width="64" height="64"><b data-i18n="calmName"></b><span data-i18n="calmDesc"></span></a>
      <div class="card app soon" aria-hidden="true"><span class="plus">＋</span><span data-i18n="soon"></span></div>
    </div>
  </main>
  <p class="privnote" data-i18n="privNote"></p>
  <div class="rg-install-wrap" id="install-wrap"><button type="button" class="rg-install" id="install-btn" data-i18n="install"></button><div class="rg-install-hint" id="install-hint" hidden></div></div>
  <footer data-i18n="footer"></footer>
</div>
<script>
window.RGMY_SW = "sw.js";
window.RGMY_STRINGS = {
  he: { doc: "האפליקציות הפרטיות שלי", title: "האפליקציות הפרטיות שלי", sub: "האזור האישי שלך בחשבון – רק אתה רואה אותו.", shopName: "קניותיפיי", shopDesc: "מתעדכנת בזמן אמת בנייד ובלפטופ", clockName: "קלוקיפיי", clockDesc: "שעונים מעוררים עם רשימות משימות, שמורים בחשבון", ideasName: "ליסטיפיי", ideasDesc: "רשימות לפי קטגוריות, שמורות בחשבון", rehabName: "ריהאביפיי", rehabDesc: "ספירת ימים נקיים, צ'ק-אין יומי וכלים לרגעי חשק", calmName: "רוגעלי", calmDesc: "צ'ק-אין רגשי, תרגילי נשימה וקרקוע ותוכנית התמודדות", soon: "עוד אפליקציות בדרך" },
  en: { doc: "My private apps", title: "My private apps", sub: "Your personal area in your account – only you can see it.", shopName: "Purchasify", shopDesc: "Updates live on your phone and laptop", clockName: "Clockify", clockDesc: "Alarms with task lists, saved in your account", ideasName: "Listify", ideasDesc: "Lists by category, saved in your account", rehabName: "Rehabify", rehabDesc: "Clean-day counter, daily check-ins and tools for cravings", calmName: "Calmify", calmDesc: "Mood check-ins, breathing and grounding exercises and a coping plan", soon: "More apps coming" }
};

<script src="../shared/rg-account.js"></script>
<script src="common.js"></script>
<script src="../shared/rg-topbar.js?v=2" data-slot=".topbar"></script>
</body>
</html>
