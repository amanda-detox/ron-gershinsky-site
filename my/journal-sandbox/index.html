<head>
<meta charset="utf-8">
<script>/* display size (rg-zoom, set from the top bar) before first paint */(function(){try{var z=+localStorage.getItem("rg-zoom");if([75,90,110,125,150].indexOf(z)>-1)document.documentElement.style.zoom=z/100;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>(function(){var d=document.documentElement,l,t;try{l=localStorage.getItem("rg-lang");t=localStorage.getItem("rg-home-theme");}catch(e){}if(l==="en"){d.lang="en";d.dir="ltr";}d.setAttribute("data-theme",t==="light"?"light":"dark");if(t==="light"){var m=document.querySelector("meta[name=theme-color]");if(m)m.content="#f3efe6";}})();</script>

<style>
  .hidden { display: none !important; }
  .jentry { align-items: flex-start !important; }
  .jtext { margin: 4px 0 2px; white-space: pre-wrap; line-height: 1.6; font-size: 15.5px; overflow-wrap: anywhere; }
  .jfilters { display: flex; gap: 8px; margin-top: 10px; }
  .jfilters > * { flex: 1 1 50%; }
  .sec h2 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .jhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
  .jhead h2 { margin: 0; flex: 1 1 auto; min-width: 0; }
  .syncslot { display: flex; align-items: flex-start; justify-content: flex-end; gap: 2px; min-width: 0; max-width: 58%; }
  .syncslot[hidden] { display: none !important; }
  .syncslot .status { display: block; margin: 3px 0 0; padding: 0; text-align: end; color: var(--muted); font-size: 12px; line-height: 1.35; opacity: .9; white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  .syncslot .status:empty { display: none; }
  .syncslot .status.off { color: var(--accent); font-weight: 700; opacity: 1; }
  .syncpeek { display: none; margin-top: 9px; font: 700 12px/1.2 var(--sans); white-space: nowrap; }
  .synctog { flex: none; width: 36px; height: 36px; margin: -7px 0 0; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
  .synctog svg { width: 18px; height: 18px; display: block; margin: auto; transition: transform .15s; }
  .syncslot.shut { max-width: none; }
  .syncslot.shut .synctog svg { transform: rotate(180deg); }
  .syncslot.shut .status { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .syncslot.shut.attn .syncpeek { display: inline; color: var(--accent); }
  .syncslot.shut.attn .synctog { color: var(--accent); }
  html[data-theme="light"] .syncslot .status.off,
  html[data-theme="light"] .syncslot.shut.attn .syncpeek,
  html[data-theme="light"] .syncslot.shut.attn .synctog { color: #8a5a00; }
  details.jtopics > summary { cursor: pointer; list-style: none; }
  details.jtopics > summary::-webkit-details-marker { display: none; }
  details.jtopics > summary h2 { display: inline; }
  details.jtopics > summary::after { content: " ▾"; color: var(--muted); }
  details.jtopics form { margin-top: 10px; display: flex; gap: 8px; }
  .sandbox-tag { display: inline-block; margin: 0 0 8px; font: 800 11px/1.3 Heebo, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: #f5c542; color: #0b2a6b; }
  .sbxnote { margin: 0 2px 4px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  /* Bookmark: same glyph and gold states as Updatify (news/index.html .card .bm). 44px so a thumb can hit it. */
  .jentry { position: relative; }
  .jentry .bm { position: absolute; top: 0; inset-inline-end: -6px; z-index: 1; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid transparent; border-radius: 50%; background: none; color: var(--faint); cursor: pointer; touch-action: manipulation; transition: color .15s, background .15s, transform .15s; }
  .jentry .bm svg { width: 19px; height: 19px; }
  .jentry .bm:hover { color: #b8892b; background: rgba(11, 42, 107, .06); }
  .jentry .bm[aria-pressed="true"] { color: #b8892b; }
  html[data-theme="dark"] .jentry .bm:hover { color: #e3bd5b; background: rgba(127, 182, 255, .1); }
  html[data-theme="dark"] .jentry .bm[aria-pressed="true"] { color: #f5c542; }
  .jentry .bm:active { transform: scale(.9); }
  .jentry .meta, .jentry .jtext { padding-inline-end: 40px; }
  .jentry form.grow textarea.inp { padding-inline-end: 44px; }
  .chips .savedchip { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; }
  .chips .bi { display: inline-flex; color: #b8892b; }
  html[data-theme="dark"] .chips .bi { color: #f5c542; }
  .chips .bi svg { width: 14px; height: 14px; }
  .chips button[aria-pressed="true"] .bi { color: inherit; }
</style>
<script src="../../shared/rg-bg.js" data-app="sbx-journal" data-slot=".topbar .tools" data-before="#theme-btn"></script>
</head>
<body>
<div class="wrap">
  <p class="sandbox-tag">Sandbox</p>
  <header class="topbar">
    <div class="tools">
      <label class="langsel"><span class="globe" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><select id="lang-sel"><option value="he">עברית</option><option value="en">English</option></select><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span></label>
      <span data-rg-account></span>
      <button type="button" class="themebtn" id="theme-btn"></button>
    </div>
  </header>
  <div class="backrow" hidden><a hidden class="back" data-i18n="backHub"></a></div>
  <section class="card gate" data-when="out" hidden>
    <div class="lock" aria-hidden="true">🔒</div>
    <h2 data-i18n="gateTitle"></h2>
    <p data-i18n="gateText"></p>
    <span data-rg-account></span>
  </section>
  <p class="sbxnote" data-when="in" hidden data-i18n="sbxNote"></p>
  <main data-when="in" hidden>
    <div id="panels"></div>
  </main>
  <p class="privnote" data-i18n="privNote"></p>
  <div class="rg-install-wrap" id="install-wrap"><button type="button" class="rg-install" id="install-btn" data-i18n="install"></button><div class="rg-install-hint" id="install-hint" hidden></div></div>
  <footer data-i18n="footer"></footer>
</div>

<script src="../../shared/rg-account.js"></script>
<script src="../common.js"></script>

<script src="bookmarks.js?v=1"></script>
<script src="app.js?v=1"></script>

<!-- rg-install v3: button only when the browser offers a real install prompt -->
<style>#rg-inst-w{position:fixed;bottom:14px;inset-inline-start:14px;z-index:9999;font:14px/1.4 Heebo,system-ui,sans-serif}#rg-inst-w[hidden]{display:none}#rg-inst{display:block;font:600 15px/1.2 Heebo,system-ui,sans-serif;background:linear-gradient(135deg,#0b2a6b,#1e4fd1);color:#f5d27a;border:1.5px solid #d4af37;border-radius:22px;padding:9px 40px 9px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}[dir=rtl] #rg-inst{padding:9px 14px 9px 40px}#rg-inst-x{position:absolute;top:-10px;right:-10px;width:32px;height:32px;border-radius:50%;border:1.5px solid #d4af37;background:#0b1a3f;color:#f5d27a;font:700 18px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);padding:0}[dir=rtl] #rg-inst-x{right:auto;left:-10px}</style>
<div id="rg-inst-w" hidden><button id="rg-inst" type="button"></button><button id="rg-inst-x" type="button">✕</button></div>
<script>(function(){
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});}
var K="rg-sbx-journal-inst",w=document.getElementById("rg-inst-w"),b=document.getElementById("rg-inst"),x=document.getElementById("rg-inst-x"),dp=null;
var T={he:{b:"📲 התקנה למסך הבית",x:"סגירה"},en:{b:"📲 Install app",x:"Close"}};
function L(){var l="";try{l=localStorage.getItem("rg-lang")||"";}catch(e){}if(l!=="en"&&l!=="he")l=/^en/i.test(document.documentElement.lang)?"en":"he";return l;}
function R(){var t=T[L()];b.textContent=t.b;x.title=t.x;x.setAttribute("aria-label",t.x);}
function sa(){return(window.matchMedia&&(matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: minimal-ui)").matches))||navigator.standalone===true;}
function off(){try{return localStorage.getItem(K)==="1";}catch(e){return false;}}
function U(){w.hidden=!(dp&&!sa()&&!off());}
R();U();
addEventListener("storage",function(e){if(e.key==="rg-lang")R();});addEventListener("rg-lang",R);
new MutationObserver(R).observe(document.documentElement,{attributes:true,attributeFilter:["lang","dir"]});
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;U();});
addEventListener("appinstalled",function(){dp=null;U();});
b.onclick=function(){if(!dp)return;var d=dp;dp=null;U();d.prompt();};
x.onclick=function(){try{localStorage.setItem(K,"1");}catch(e){}U();};
})();</script>
