<style>
  .catbar { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .tabs { flex: 1; min-width: 0; display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; -webkit-user-select: none; user-select: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; min-height: 42px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 15.5px; font-weight: 700; white-space: nowrap; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: pan-x; transition: transform .12s, box-shadow .12s; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accentink); }
  .tab.lifted { transform: scale(1.08); box-shadow: 0 0 0 2px var(--accent), 0 6px 16px rgba(0,0,0,.35); position: relative; z-index: 2; }
  .tab.drop { box-shadow: 0 0 0 2px var(--accent) inset; color: var(--fg); }
  .tabs.dragging { overflow-x: hidden; }
  .tabs.dragging .tab:not(.lifted) { opacity: .75; }
  .tabadd { flex: none; width: 46px; height: 46px; border: 1px dashed var(--accent); box-shadow: var(--shadow); border-radius: 999px; background: transparent; color: var(--accent); font-size: 20px; font-weight: 800; line-height: 1; }
  .cathint, .drophint { margin: 6px 4px 0; color: var(--faint); font-size: 12.5px; }
  .drophint { color: var(--accent); font-weight: 700; }
  .sheetwrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 12px; background: rgba(3, 10, 30, .55); }
  .sheet { width: 100%; max-width: 460px; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .sheet h3 { margin: 0 4px 4px; font-size: 18px; overflow-wrap: anywhere; }
  .sheet .sform { display: flex; flex-direction: column; gap: 10px; }
  .sheet .s-name { height: 50px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line2); background: var(--card2); color: var(--fg); font-size: 16.5px; outline: none; }
  .sheet .s-name:focus { border-color: var(--accent); }
  .sheet .row { display: flex; gap: 8px; }
  .btn { flex: 1; min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font-size: 16px; font-weight: 700; }
  .btn.pri { border: 0; background: var(--accent); color: var(--accentink); font-weight: 800; }
  .mi { min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font-size: 16px; font-weight: 700; text-align: start; }
  .mi.big { border-color: var(--accent); }
  .mi.dng { color: var(--muted); }
  .mnote { margin: 0 4px; color: var(--faint); font-size: 13px; }
  .list li { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .list li.ilifted { opacity: .45; }
  .ighost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -130%); max-width: 70vw; padding: 8px 14px; border-radius: 999px; background: var(--accent); color: var(--accentink); font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  body.idragging { -webkit-user-select: none; user-select: none; }
  @media (max-width: 420px) { .tab { padding: 0 12px; font-size: 14.5px; } .tabs { gap: 2px; } }
  .addform { display: flex; gap: 8px; margin-top: 16px; }
  .addform input { flex: 1; min-width: 0; height: 50px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line2); background: var(--card); color: var(--fg); font-size: 17px; outline: none; }
  .addform input:focus { border-color: var(--accent); }
  .addform input::placeholder { color: var(--faint); }
  .addform button { flex: none; height: 50px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accentink); font-weight: 800; font-size: 16px; }
  .status { display: flex; align-items: center; gap: 6px; min-height: 22px; margin: 10px 2px 0; color: var(--faint); font-size: 13px; }
  .status.off { color: var(--accent); font-weight: 600; }
  html[data-theme="light"] .status.off { color: #8a5a00; }
  .list { list-style: none; margin: 12px 0 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 4px; min-height: 54px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .listcard { padding: 4px 8px; }
  .chk { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; }
  .chk i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line2); display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 15px; font-weight: 900; color: transparent; transition: background .15s, border-color .15s; }
  .chk:hover i { border-color: var(--accent); }
  .done .chk i { background: var(--accent); border-color: var(--accent); color: var(--accentink); }
  .txt { flex: 1; min-width: 0; padding: 10px 4px; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; cursor: text; border-radius: 8px; }
  .done .txt { color: var(--faint); }
  .edit { flex: 1; min-width: 0; height: 42px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--accent); background: var(--bg); color: var(--fg); font-size: 17px; outline: none; }
  .del { flex: none; width: 40px; height: 40px; border: 0; background: none; color: var(--faint); font-size: 22px; line-height: 1; border-radius: 50%; }
  .del:hover { color: var(--fg); background: var(--card2); }
  .donehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 2px 0; }
  .donehead h2 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 700; }
  .clear { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font-size: 13.5px; font-weight: 600; }
  .clear:hover { border-color: var(--accent); }
  .empty { margin-top: 18px; padding: 22px 18px; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 8px; }
  .suggest { background: none; border: 0; padding: 4px; color: var(--accent); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
  html[data-theme="light"] .suggest { color: var(--blue); }
  .count { color: var(--faint); font-size: 13px; margin-inline-start: auto; }
</style>

  <main data-when="in" hidden>
    <div class="catbar"><nav class="tabs" id="tabs" role="tablist"></nav><button type="button" class="tabadd" id="cat-add">＋</button></div>
    <p class="cathint" id="cathint" hidden></p>
    <p class="drophint" id="drophint" hidden></p>
    <form class="addform" id="add-form" autocomplete="off">
      <input id="add-input" type="text" maxlength="200" enterkeyhint="done" data-i18n-ph="ph" data-i18n-label="ph">
      <button type="submit" data-i18n="add"></button>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="card empty" id="empty" hidden><p id="empty-p"></p><button type="button" class="suggest" id="suggest" data-i18n="suggest"></button></div>
    <div class="card listcard" id="active-card"><ul class="list" id="active"></ul></div>
    <div id="done-wrap" hidden>
      <div class="donehead"><h2 id="done-h"></h2><button type="button" class="clear" id="clear" data-i18n="clear"></button></div>
      <div class="card listcard"><ul class="list" id="done"></ul></div>
    </div>
  </main>
  <p class="privnote" data-i18n="privNote"></p>
  <div class="rg-install-wrap" id="install-wrap"><button type="button" class="rg-install" id="install-btn" data-i18n="install"></button><div class="rg-install-hint" id="install-hint" hidden></div></div>
  <footer data-i18n="footer"></footer>
</div>
