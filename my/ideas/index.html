<style>
  .tabs { display: flex; gap: 6px; margin-top: 18px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; min-height: 42px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 15.5px; font-weight: 700; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accentink); }
  .tab .n { font-weight: 600; opacity: .8; font-size: 13px; margin-inline-start: 4px; }
  .addform { margin-top: 14px; }
  .addrow { display: flex; gap: 8px; }
  .addform input, .addform textarea, .ed input, .ed textarea, .ed select, .tools2 select { min-width: 0; border-radius: 14px; border: 2px solid var(--line2); background: var(--card); color: var(--fg); font-size: 16.5px; outline: none; }
  .addform input[type=text] { flex: 1; height: 50px; padding: 0 16px; }
  .addform input:focus, .addform textarea:focus, .ed input:focus, .ed textarea:focus, .ed select:focus { border-color: var(--accent); }
  .addform ::placeholder, .ed ::placeholder { color: var(--faint); }
  .addform button[type=submit] { flex: none; height: 50px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accentink); font-weight: 800; font-size: 16px; }
  .addextra { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .addextra input, .addextra textarea { flex: 1; height: 42px; padding: 0 14px; font-size: 15px; border-width: 1px; }
  .addextra label { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
  .addextra input[type=date] { flex: 0 1 11rem; }
  .status { display: flex; align-items: center; gap: 6px; min-height: 22px; margin: 10px 2px 0; color: var(--faint); font-size: 13px; }
  .status.off { color: var(--accent); font-weight: 600; }
  html[data-theme="light"] .status.off { color: #8a5a00; }
  .tools2 { display: flex; align-items: center; gap: 8px; margin: 6px 2px 0; color: var(--muted); font-size: 13.5px; }
  .tools2 select { height: 36px; padding: 0 10px; font-size: 14px; border-width: 1px; border-radius: 10px; }
  .tools2 .count { margin-inline-start: auto; color: var(--faint); }
  .listcard { padding: 2px 8px; margin-top: 10px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { display: flex; align-items: flex-start; gap: 4px; min-height: 54px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .list > li:last-child { border-bottom: 0; }
  .chk { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; }
  .chk i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line2); display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 15px; font-weight: 900; color: transparent; }
  .chk:hover i { border-color: var(--accent); }
  .done .chk i { background: var(--accent); border-color: var(--accent); color: var(--accentink); }
  .body { flex: 1; min-width: 0; padding: 9px 4px; cursor: pointer; border-radius: 8px; }
  .txt { display: block; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
  .note { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-line; }
  .due { display: inline-block; margin-top: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .due.late { color: var(--accent); } html[data-theme="light"] .due.late { color: #8a5a00; }
  .done .txt { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--faint); }
  .chip { flex: none; margin-top: 9px; min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .chip.s-dev { border-color: var(--blue); color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, transparent); }
  .chip.s-done { border-color: var(--accent); background: var(--accent); color: var(--accentink); }
  .idea.s-done .txt { color: var(--muted); }
  .mv { flex: none; display: flex; flex-direction: column; margin-top: 2px; }
  .mv button { width: 34px; height: 24px; border: 0; background: none; color: var(--faint); font-size: 14px; border-radius: 8px; padding: 0; }
  .mv button:hover:not(:disabled) { color: var(--fg); background: var(--card2); }
  .mv button:disabled { opacity: .25; cursor: default; }
  .ed { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 6px 2px 8px; }
  .ed input[type=text], .ed select, .ed input[type=date] { height: 44px; padding: 0 12px; }
  .ed textarea { min-height: 70px; padding: 10px 12px; resize: vertical; font-size: 15px; }
  .ed .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ed .row label { color: var(--muted); font-size: 13.5px; }
  .btn { height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font-size: 14.5px; font-weight: 700; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accentink); }
  .btn.dng { margin-inline-start: auto; color: var(--muted); }
  .btn.dng:hover { color: #ff9a9a; border-color: #ff9a9a; }
  html[data-theme="light"] .btn.dng:hover { color: #a3122a; border-color: #a3122a; }
  .empty { margin-top: 14px; padding: 22px 18px; text-align: center; color: var(--muted); }
  .empty p { margin: 0; }
  details.donebox { margin-top: 18px; }
  details.donebox > summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; padding: 6px 2px; color: var(--muted); font-size: 15px; font-weight: 700; }
  details.donebox > summary::-webkit-details-marker { display: none; }
  details.donebox > summary::before { content: "▸"; display: inline-block; transition: transform .15s; }
  html[dir="rtl"] details.donebox > summary::before { content: "◂"; }
  details.donebox[open] > summary::before { transform: rotate(90deg); }
  html[dir="rtl"] details.donebox[open] > summary::before { transform: rotate(-90deg); }
  .pbar { display: flex; height: 8px; margin-top: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .pbar i { flex: none; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--accent)); }
  html[dir="rtl"] .pbar i { margin-inline-start: 0; background: linear-gradient(270deg, var(--blue), var(--accent)); }
  .plabel { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .goal.done .pbar i { background: var(--accent); }
  .prow { display: flex; align-items: center; gap: 10px; }
  .prow label { color: var(--muted); font-size: 13.5px; }
  .prow input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 30px; }
  .prow output { min-width: 3.2em; text-align: end; font-weight: 800; font-variant-numeric: tabular-nums; }
  .btn.sm { height: 34px; padding: 0 12px; font-size: 13.5px; }
  @media (max-width: 420px) { .tab { padding: 0 10px; font-size: 14.5px; } .tabs { gap: 2px; } }
  .clear { margin-inline-start: auto; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font-size: 13px; font-weight: 600; }
</style>
