<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b1f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="קלוקיפיי: שעון מעורר עם רשימת משימות. Clockify: alarm clock with task lists.">
<title>קלוקיפיי</title>
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<style>
  :root {
    --bg: #0f172a; --bg-end: #1e293b; --surface: #1e293b; --surface-2: #334155;
    --fg: #f8fafc; --muted: #cbd5e1; --faint: #94a3b8; --line: #334155; --field: #475569;
    --accent: #3b82f6; --accent-hover: #2563eb; --ink: #ffffff; --violet: #8b5cf6; --danger: #ef4444;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; min-height: 100vh; color: var(--fg); font-family: var(--sans);
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-end) 100%) fixed; }
  button, a, label { -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .app-title { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin: 1.25rem 0 0; font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
  .app-title img { border-radius: 0.55rem; }
  .wrap { width: 100%; max-width: 32rem; margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) 1rem calc(6rem + env(safe-area-inset-bottom)); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
  .langs { display: flex; gap: 0.5rem; direction: ltr; }
  .pill { min-height: 2.75rem; border: 0; border-radius: 999px; padding: 0 0.9rem; background: var(--surface-2);
    font-size: 0.9rem; font-weight: 500; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; }
  .pill[aria-pressed="true"] { background: var(--accent); }
  .clock { text-align: center; margin: 1.75rem 0 0; }
  .now { font-size: clamp(3.5rem, 18vw, 5.5rem); font-weight: 700; letter-spacing: 0.02em; direction: ltr;
    font-variant-numeric: tabular-nums; line-height: 1;
    background: linear-gradient(to bottom right, #fff, #c7d2fe); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .today { margin-top: 0.5rem; color: var(--muted); }
  .next { margin-top: 0.4rem; color: var(--accent); font-size: 0.95rem; min-height: 1.4em; }
  .note { margin-top: 1.25rem; border: 1px solid var(--line); border-radius: 0.75rem; background: rgba(30,41,59,0.7);
    padding: 0.9rem 1rem; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  .note .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .note .ok { color: #86efac; }
  h2 { font-size: 1.15rem; margin: 1.75rem 0 0.75rem; display: flex; justify-content: space-between; align-items: center; }
  .count { color: var(--faint); font-size: 0.85rem; font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
  .alarm { display: flex; align-items: center; gap: 0.75rem; border: 1px solid var(--line); border-radius: 0.9rem;
    background: var(--surface); padding: 0.9rem 1rem; transition: opacity 0.2s; }
  .alarm.off { opacity: 0.5; }
  .alarm .main { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: start; }
  .alarm .t { font-size: 1.9rem; font-weight: 700; direction: ltr; display: inline-block; font-variant-numeric: tabular-nums; }
  .alarm .title { color: var(--muted); font-size: 0.95rem; line-height: 1.4; margin-top: 0.15rem; overflow-wrap: anywhere; }
  .badge { display: inline-block; margin-inline-start: 0.5rem; vertical-align: middle; font-size: 0.75rem; padding: 0.15rem 0.55rem;
    border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .badge.once { background: rgba(139,92,246,0.25); color: #ddd6fe; }
  .switch { position: relative; width: 3.4rem; height: 2rem; flex: none; border-radius: 999px; border: 0; background: var(--field); padding: 0; }
  .switch::after { content: ""; position: absolute; top: 0.25rem; inset-inline-start: 0.25rem; width: 1.5rem; height: 1.5rem;
    border-radius: 50%; background: #fff; transition: inset-inline-start 0.2s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { inset-inline-start: 1.65rem; }
  .fab { position: fixed; bottom: calc(1.25rem + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    min-height: 3.5rem; padding: 0 1.75rem; border: 0; border-radius: 999px; font-size: 1.05rem; font-weight: 600;
    background: linear-gradient(to bottom right, var(--accent), var(--violet)); color: var(--ink);
    box-shadow: 0 10px 30px rgba(59,130,246,0.35); }
  .empty { text-align: center; color: var(--faint); padding: 1rem; }
  /* sheets */
  .veil { position: fixed; inset: 0; background: rgba(2,6,23,0.75); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  @media (min-width: 640px) { .veil { align-items: center; } }
  .sheet { width: 100%; max-width: 32rem; max-height: 92vh; overflow: auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: 1.25rem 1.25rem 0 0; padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .sheet { border-radius: 1.25rem; } }
  .sheet h3 { margin: 0 0 1rem; font-size: 1.25rem; }
  .field { display: block; margin-bottom: 1rem; }
  .field > span { display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 0.35rem; }
  input[type=time], input[type=date], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--field); border-radius: 0.75rem; padding: 0.75rem; min-height: 3rem; color-scheme: dark; }
  input[type=time] { font-size: 1.75rem; font-weight: 600; text-align: center; direction: ltr; }
  textarea { min-height: 6rem; resize: vertical; line-height: 1.5; }
  .seg { display: flex; gap: 0.5rem; }
  .seg button { flex: 1; min-height: 3rem; border-radius: 0.75rem; border: 1px solid var(--field); background: var(--bg); }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .hint { color: var(--faint); font-size: 0.8rem; margin-top: 0.35rem; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.25rem; }
  .btn { flex: 1; min-height: 3.25rem; border-radius: 0.85rem; border: 0; background: var(--surface-2); font-weight: 600; padding: 0 1rem; }
  .btn.primary { background: var(--accent); }
  .btn.danger { background: transparent; color: #fca5a5; border: 1px solid rgba(239,68,68,0.5); }
  .err { color: #fca5a5; font-size: 0.9rem; margin: 0; }
  /* ringing */
  .ring { position: fixed; inset: 0; z-index: 20; display: flex; align-items: safe center; justify-content: center; overflow-y: auto;
    padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
    background: radial-gradient(circle at 50% 25%, rgba(139,92,246,0.45), rgba(15,23,42,0) 60%), var(--bg); }
  .ring .box { margin: auto 0; }
  .ring .box { width: 100%; max-width: 30rem; text-align: center; }
  .bell { font-size: 3.5rem; animation: shake 1s ease-in-out infinite; display: inline-block; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-15deg); } 40% { transform: rotate(13deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
  @media (prefers-reduced-motion: reduce) { .bell { animation: none; } }
  .ring .t { font-size: clamp(3.5rem, 20vw, 6rem); font-weight: 700; direction: ltr; margin: 0.25rem 0; font-variant-numeric: tabular-nums; }
  .tasks { text-align: start; margin: 1rem 0 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .tasks li { background: rgba(30,41,59,0.9); border: 1px solid var(--line); border-radius: 0.75rem; }
  .tasks label { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; font-size: 1.15rem; cursor: pointer; min-height: 3.25rem; }
  .tasks input { width: 1.4rem; height: 1.4rem; accent-color: var(--accent); flex: none; }
  .tasks input:checked + span { text-decoration: line-through; color: var(--faint); }
  .ring .actions .btn { min-height: 4rem; font-size: 1.15rem; }
  .ring .more { color: var(--faint); font-size: 0.85rem; margin-top: 0.75rem; }
  .toast { position: fixed; bottom: calc(5.5rem + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: var(--surface-2); padding: 0.7rem 1.1rem; border-radius: 999px; font-size: 0.9rem; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
  .back { color: var(--faint); font-size: 0.85rem; text-align: center; margin-top: 2rem; }
  .back a { color: var(--muted); }
  .install-hint { color: var(--muted, inherit); font-size: 0.85rem; line-height: 1.5; margin-top: 0.6rem; }
  .install-hint ol { margin: 0.2rem 0 0.4rem; padding-inline-start: 1.3em; }
  .install-hint li { margin: 0.15rem 0; }
  .cal { margin-top: 1.25rem; border: 1px solid rgba(212,175,55,0.55); border-radius: 0.9rem; padding: 1rem;
    background: linear-gradient(to bottom right, rgba(59,130,246,0.18), rgba(30,41,59,0.85)); text-align: center; }
  .cal-btn { width: 100%; min-height: 3.5rem; border: 1px solid #d4af37; border-radius: 0.85rem; padding: 0.6rem 1rem;
    font-size: 1.05rem; font-weight: 700; color: #fff; background: linear-gradient(to bottom right, #2563eb, #1e3a8a);
    box-shadow: 0 6px 20px rgba(37,99,235,0.35); }
  .cal-btn:active { transform: translateY(1px); }
  .cal-help { color: var(--muted); font-size: 0.85rem; line-height: 1.5; margin: 0.6rem 0 0; }
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="langs" role="group" aria-label="Language">
      <button type="button" class="pill" id="he" aria-pressed="true">עברית</button>
      <button type="button" class="pill" id="en" aria-pressed="false">English</button>
    </div>
    <span style="display:inline-flex;align-items:center;gap:0.5rem;flex-wrap:wrap;justify-content:flex-end"><span data-rg-account></span><button type="button" class="pill" id="test-sound"></button></span>
  </div>

  <h1 class="app-title" id="app-title"><img src="icon.svg?v=3" alt="" width="36" height="36"><span id="app-name"></span></h1>

  <section class="clock" aria-live="off">
    <div class="now" id="now">--:--</div>
    <div class="today" id="today"></div>
    <div class="next" id="next"></div>
  </section>

  <section class="note" id="note">
    <div id="note-text"></div>
    <div class="row">
      <button type="button" class="pill" id="notif-btn"></button>
      <button type="button" class="pill" id="wake-btn" aria-pressed="false"></button>
      <button type="button" class="pill" id="install-btn"></button>
    </div>
    <div class="hint install-hint" id="install-hint" hidden></div>
    <div class="hint" id="notif-state"></div>
  </section>

  <section class="cal" id="cal">
    <button type="button" class="cal-btn" id="cal-btn"></button>
    <p class="cal-help" id="cal-help"></p>
  </section>
  <h2><span id="list-title"></span><span class="count" id="count"></span></h2>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden></p>
  <p class="back"><a href="../" id="back"></a> · <button type="button" id="reset" style="background:none;border:0;color:var(--faint);text-decoration:underline;font-size:inherit;padding:0.5rem"></button></p>
</main>

<button type="button" class="fab" id="add"></button>

<div class="veil" id="editor" hidden>
  <form class="sheet" id="form" novalidate role="dialog" aria-modal="true" aria-labelledby="form-title">
    <h3 id="form-title"></h3>
    <label class="field"><span id="l-time"></span><input type="time" id="f-time" required></label>
    <div class="field"><span id="l-type"></span>
      <div class="seg" role="group">
        <button type="button" id="t-daily" aria-pressed="true"></button>
        <button type="button" id="t-once" aria-pressed="false"></button>
      </div>
    </div>
    <label class="field" id="date-wrap" hidden><span id="l-date"></span><input type="date" id="f-date"></label>
    <label class="field"><span id="l-tasks"></span><textarea id="f-tasks" rows="4"></textarea>
      <div class="hint" id="h-tasks"></div></label>
    <p class="err" id="f-err" hidden></p>
    <div class="actions">
      <button type="submit" class="btn primary" id="save"></button>
      <button type="button" class="btn" id="cancel"></button>
    </div>
    <div class="actions"><button type="button" class="btn danger" id="del" hidden></button></div>
  </form>
</div>

<div class="ring" id="ring" hidden role="alertdialog" aria-modal="true" aria-labelledby="ring-time">
  <div class="box">
    <div class="bell" aria-hidden="true">⏰</div>
    <div class="t" id="ring-time"></div>
    <div class="today" id="ring-label"></div>
    <ul class="tasks" id="ring-tasks"></ul>
    <div class="actions">
      <button type="button" class="btn primary" id="stop"></button>
      <button type="button" class="btn" id="snooze"></button>
    </div>
    <div class="more" id="ring-more"></div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="alarm-core.js"></script>
<script src="ics.js"></script>
<script>
(function () {

  var T = {

      empty: "אין עדיין שעונים. לחץ על ״שעון חדש״.",

      more: function (n) { return "ועוד " + n + " שעונים מצלצלים"; },
      ringLabelSnooze: "נודניק",
      back: "← חזרה לאתר", reset: "שחזור שעוני ברירת המחדל", confirmReset: "להחזיר את רשימת השעונים המקורית? השעונים הנוכחיים יימחקו.",
      notifBody: "השעון מצלצל",
      cal: "📅 הוסף את השעונים ליומן בטלפון",

  var lang = localStorage.getItem(LANG) === "en" ? "en" : "he";
  var alarms = load(KEY, null);
  if (!Array.isArray(alarms)) { alarms = C.defaults(Date.now()); save(); }

  var ringing = []; // [{label, title, time}]
  var editingId = null, formType = "daily";
  var $ = function (id) { return document.getElementById(id); };

  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(msg) {
    var el = $("toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2200);
  }

  /* ---------- sound ---------- */
  var ctx = null, beepTimer = null;
  function audio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function chime(c) {
    var now = c.currentTime;
    [880, 1108.73, 1318.51].forEach(function (f, i) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      var s = now + i * 0.18;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.35, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.7);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + 0.75);
    });
  }
  function startSound() {
    stopSound();
    var c = audio();
    var tick = function () { if (c) chime(c); buzz([400, 200, 400]); };
    tick(); beepTimer = setInterval(tick, 1600);
  }
  function buzz(p) {
    if (!navigator.vibrate) return;
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
    try { navigator.vibrate(p); } catch (e) {}
  }
  function stopSound() { if (beepTimer) clearInterval(beepTimer); beepTimer = null; buzz(0); }
  document.addEventListener("pointerdown", function () { audio(); }, { once: true });

  /* ---------- notifications ---------- */
  var swReg = null;
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").then(function (r) { swReg = r; }).catch(function () {});
  }
  function notify(title, body) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    var opts = { body: body, icon: "icon-192.png", badge: "icon-192.png", tag: "rg-alarm", renotify: true, requireInteraction: true, vibrate: [400, 200, 400] };
    try {
      if (swReg && swReg.showNotification) swReg.showNotification(title, opts);
      else new Notification(title, opts);
    } catch (e) { try { new Notification(title, { body: body }); } catch (e2) {} }
  }
  function renderNotif() {
    var b = $("notif-btn"), s = $("notif-state");
    if (!("Notification" in window)) { b.hidden = true; s.textContent = t("notifNA"); return; }
    var p = Notification.permission;
    b.hidden = p === "granted";
    b.textContent = t("notif");
    s.innerHTML = p === "granted" ? '<span class="ok">' + esc(t("notifOn")) + "</span>" : p === "denied" ? esc(t("notifDenied")) : "";
  }
  $("notif-btn").onclick = function () {
    if (!("Notification" in window)) return;
    var r = Notification.requestPermission(renderNotif);
    if (r && r.then) r.then(renderNotif);
  };

  /* ---------- wake lock ---------- */
  var wakeLock = null, wantWake = false;
  function renderWake() {
    var b = $("wake-btn");
    if (!("wakeLock" in navigator)) { b.hidden = true; return; }
    b.textContent = wakeLock ? t("wakeOn") : t("wake");
    b.setAttribute("aria-pressed", wakeLock ? "true" : "false");
  }
  function requestWake() {
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l; l.addEventListener("release", function () { wakeLock = null; renderWake(); }); renderWake();
    }).catch(function () { wantWake = false; toast(t("wakeNA")); renderWake(); });
  }
  $("wake-btn").onclick = function () {
    if (wakeLock) { wantWake = false; wakeLock.release(); wakeLock = null; renderWake(); return; }
    wantWake = true; requestWake();
  };

/* ---------- Install to home screen ----------
   Always visible unless already running as an installed app. Tap: native prompt when
   the browser offers one, otherwise short instructions for this device. */
var INST_TXT = {
  he: {
    iosSafari: "<ol><li>לוחצים על כפתור השיתוף <b>(□↑)</b> בסרגל של Safari.</li><li>גוללים ובוחרים <b>„הוסף למסך הבית”</b>.</li><li>לוחצים <b>„הוסף”</b>.</li></ol>",
    iosOther: "<ol><li>קודם פותחים את הדף ב־<b>Safari</b>: בתפריט (⋯ או ⋮) בוחרים <b>„פתח ב־Safari”</b> או <b>„פתח בדפדפן”</b>.</li><li>ב־Safari לוחצים על כפתור השיתוף <b>(□↑)</b>.</li><li>בוחרים <b>„הוסף למסך הבית”</b> ואז <b>„הוסף”</b>.</li></ol>",
    android: "<ol><li>פותחים את תפריט הדפדפן: <b>⋮</b> למעלה ב־Chrome, או <b>☰</b> למטה ב־Samsung Internet.</li><li>בוחרים <b>„התקנת אפליקציה”</b> או <b>„הוספה למסך הבית”</b> (ב־Samsung: <b>„הוסף דף אל” ← „מסך הבית”</b>).</li></ol>פתחת מתוך וואטסאפ, אינסטגרם או פייסבוק? קודם בוחרים בתפריט <b>„פתח בדפדפן”</b>.",
    desktop: "<ol><li>ב־Chrome או Edge: סמל ההתקנה בצד שורת הכתובת, או תפריט <b>⋮</b> ← <b>„התקנה”</b>.</li><li>בטלפון: פותחים את הכתובת בדפדפן ובוחרים <b>„הוספה למסך הבית”</b>.</li></ol>"
  },
  en: {
    iosSafari: "<ol><li>Tap the Share button <b>(□↑)</b> in Safari's toolbar.</li><li>Scroll and choose <b>“Add to Home Screen”</b>.</li><li>Tap <b>“Add”</b>.</li></ol>",
    iosOther: "<ol><li>First open this page in <b>Safari</b>: from the menu (⋯ or ⋮) choose <b>“Open in Safari”</b> or <b>“Open in browser”</b>.</li><li>In Safari, tap the Share button <b>(□↑)</b>.</li><li>Choose <b>“Add to Home Screen”</b>, then <b>“Add”</b>.</li></ol>",
    android: "<ol><li>Open the browser menu: <b>⋮</b> at the top in Chrome, or <b>☰</b> at the bottom in Samsung Internet.</li><li>Choose <b>“Install app”</b> or <b>“Add to Home screen”</b> (Samsung: <b>“Add page to” → “Home screen”</b>).</li></ol>Opened from WhatsApp, Instagram or Facebook? First choose <b>“Open in browser”</b> from its menu.",
    desktop: "<ol><li>In Chrome or Edge: click the install icon at the end of the address bar, or menu <b>⋮</b> → <b>“Install”</b>.</li><li>On a phone: open this address in the browser and choose <b>“Add to Home screen”</b>.</li></ol>"
  }
};
var instDeferred = null, instDone = false;
function instStandalone() {
  return (window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches || window.matchMedia("(display-mode: minimal-ui)").matches)) || navigator.standalone === true;
}
function instKey() {
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) return (/Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|YaBrowser|DuckDuckGo|FBAN|FBAV|Instagram|WhatsApp|Line\//.test(ua)) ? "iosSafari" : "iosOther";
  if (/Android/i.test(ua)) return "android";
  return "desktop";
}
function instHint(l) { return INST_TXT[l === "en" ? "en" : "he"][instKey()]; }
function updateInstall() {
  var show = !instStandalone() && !instDone;
  document.getElementById("install-btn").hidden = !show;
  if (!show) document.getElementById("install-hint").hidden = true;
}
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); instDeferred = e; updateInstall(); });
window.addEventListener("appinstalled", function () { instDeferred = null; instDone = true; updateInstall(); });
if (window.matchMedia) { var instMq = window.matchMedia("(display-mode: standalone)"); if (instMq.addEventListener) instMq.addEventListener("change", updateInstall); else if (instMq.addListener) instMq.addListener(updateInstall); }
document.getElementById("install-btn").addEventListener("click", function () {
  var hint = document.getElementById("install-hint");
  if (instDeferred) {
    var d = instDeferred; instDeferred = null;
    try { d.prompt(); (d.userChoice || Promise.resolve()).then(updateInstall, updateInstall); return; } catch (e) {}
  }
  hint.innerHTML = instHint(lang);
  hint.hidden = !hint.hidden;
});

  /* ---------- rendering ---------- */
  function render() {
    var L = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
    document.title = L.title; $("app-name").textContent = L.title;
    $("he").setAttribute("aria-pressed", lang === "he"); $("en").setAttribute("aria-pressed", lang === "en");
    $("test-sound").textContent = L.test; $("note-text").innerHTML = L.note;
    $("install-btn").textContent = L.install; if (!$("install-hint").hidden) $("install-hint").innerHTML = instHint(lang); $("list-title").textContent = L.list; $("add").textContent = L.add;
    $("empty").textContent = L.empty; $("back").textContent = L.back; $("reset").textContent = L.reset;
    $("cal-btn").textContent = L.cal; $("cal-help").textContent = L.calHelp;
    $("l-time").textContent = L.lTime; $("l-type").textContent = L.lType; $("l-date").textContent = L.lDate;
    $("l-tasks").textContent = L.lTasks; $("h-tasks").textContent = L.hTasks; $("t-daily").textContent = L.daily;
    $("t-once").textContent = L.once; $("save").textContent = L.save; $("cancel").textContent = L.cancel; $("del").textContent = L.del;
    $("form-title").textContent = editingId ? L.editA : L.newA;
    $("stop").textContent = L.stop; $("snooze").textContent = L.snooze;
    renderNotif(); renderWake(); renderList(); tickClock(); if (ringing.length) renderRing();
  }

  function renderList() {
    var ul = $("list"); ul.innerHTML = "";
    var sorted = C.sortAlarms(alarms), on = 0;
    sorted.forEach(function (a) {
      if (a.enabled) on++;
      var li = document.createElement("li");
      li.className = "alarm" + (a.enabled ? "" : " off");
      var badge = a.type === "once" ? '<span class="badge once">' + esc(t("once") + " · " + fmtDate(a.date)) + "</span>" : '<span class="badge">' + esc(t("daily")) + "</span>";
      li.innerHTML = '<button type="button" class="main" aria-label="' + esc(t("edit") + " " + a.time) + '"><span class="t">' + esc(a.time) + "</span>" + badge +
        '<div class="title">' + esc(titleOf(a)) + "</div></button>" +
        '<button type="button" class="switch" role="switch" aria-checked="' + !!a.enabled + '" aria-label="' + esc(t("toggle")) + '"></button>';
      li.querySelector(".main").onclick = function () { openEditor(a.id); };
      li.querySelector(".switch").onclick = function () { toggle(a.id); };
      ul.appendChild(li);
    });
    $("empty").hidden = alarms.length > 0;
    $("count").textContent = alarms.length ? t("count")(alarms.length, on) : "";
    renderNext();
  }

  function renderNext() {
    var now = new Date(), best = null, bestA = null;
    alarms.forEach(function (a) { var n = C.nextOccurrence(a, now); if (n && (!best || n < best)) { best = n; bestA = a; } });
    snoozes.forEach(function (s) { var d = new Date(s.at); if (d > now && (!best || d < best)) { best = d; bestA = null; } });
    if (!best) { $("next").textContent = t("noNext"); return; }
    var mins = Math.ceil((best - now) / 60000), h = Math.floor(mins / 60), m = mins % 60;
    var day = C.dateKey(best) === C.dateKey(now) ? "" : " · " + fmtDate(C.dateKey(best));
    $("next").textContent = t("next")(hm(best) + day + " (" + t("inMin")(h, m) + ")");
  }

  function tickClock() {
    var now = new Date();
    $("now").textContent = hm(now);
    $("today").textContent = now.toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  /* ---------- editing ---------- */
  function setType(type) {
    formType = type;
    $("t-daily").setAttribute("aria-pressed", type === "daily"); $("t-once").setAttribute("aria-pressed", type === "once");
    $("date-wrap").hidden = type !== "once";
  }
  function openEditor(id) {
    editingId = id || null;
    var a = id ? alarms.filter(function (x) { return x.id === id; })[0] : null;
    var now = new Date();
    $("f-time").value = a ? a.time : C.pad((now.getHours() + 1) % 24) + ":00";
    $("f-date").value = a && a.date ? a.date : C.dateKey(now);
    $("f-tasks").value = a ? titleOf(a) : "";
    setType(a ? a.type : "daily");
    $("del").hidden = !a; $("f-err").hidden = true;
    $("form-title").textContent = a ? t("editA") : t("newA");
    $("editor").hidden = false;
    setTimeout(function () { $("f-time").focus(); }, 50);
  }
  function closeEditor() { $("editor").hidden = true; editingId = null; }
  $("t-daily").onclick = function () { setType("daily"); };
  $("t-once").onclick = function () { setType("once"); };
  $("cancel").onclick = closeEditor;
  $("editor").addEventListener("click", function (e) { if (e.target === $("editor")) closeEditor(); });
  $("add").onclick = function () { openEditor(null); };
  $("form").onsubmit = function (e) {
    e.preventDefault();
    var time = $("f-time").value, date = $("f-date").value, text = $("f-tasks").value.trim(), err = "";
    if (!C.parseTime(time)) err = t("errTime");
    else if (formType === "once" && !/^\d{4}-\d{2}-\d{2}$/.test(date)) err = t("errDate");
    else if (!text) err = t("errTasks");
    if (err) { $("f-err").textContent = err; $("f-err").hidden = false; return; }
    var a = editingId ? alarms.filter(function (x) { return x.id === editingId; })[0] : null;
    if (!a) {
      a = { id: "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: { he: text, en: text } };
      alarms.push(a);
    } else if (text !== titleOf(a)) {
      a.title = a.title || {}; a.title[lang] = text;
      var other = lang === "he" ? "en" : "he";
      if (!a.title[other]) a.title[other] = text;
    }
    var changedWhen = a.time !== time || a.type !== formType || (formType === "once" && a.date !== date);
    a.time = time; a.type = formType; a.date = formType === "once" ? date : "";
    if (changedWhen || !a.created) { a.created = Date.now(); a.lastFired = ""; }
    a.enabled = true;
    save(); closeEditor(); renderList(); toast(t("saved"));
  };
  $("del").onclick = function () {
    if (!editingId || !confirm(t("confirmDel"))) return;
    var id = editingId;
    alarms = alarms.filter(function (x) { return x.id !== id; });
    snoozes = snoozes.filter(function (s) { return s.alarmId !== id; });
    save(); saveSnoozes(); closeEditor(); renderList(); toast(t("deleted"));
  };
  function toggle(id) {
    alarms.forEach(function (a) {
      if (a.id !== id) return;
      a.enabled = !a.enabled;
      if (a.enabled) { a.created = Date.now(); } // don't ring for a time that already passed
      toast(a.enabled ? t("on") : t("off"));
    });
    save(); renderList();
  }
  $("reset").onclick = function () {
    if (!confirm(t("confirmReset"))) return;
    alarms = C.defaults(Date.now()); snoozes = []; save(); saveSnoozes(); renderList();
  };


  /* ---------- export to phone calendar (.ics) ---------- */
  function downloadIcs(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener"; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
  }
  $("cal-btn").onclick = function () {
    var current = load(KEY, null);
    if (!Array.isArray(current)) current = C.defaults(Date.now());
    var res = window.AlarmIcs.build(current, { now: new Date(), titleOf: titleOf });
    if (!res.count) { toast(t("calNone")); return; }
    var name = "clockify-alarms.ics", type = "text/calendar;charset=utf-8";
    var blob = new Blob([res.text], { type: type });
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var mobile = ios || /Android/i.test(ua);
    // iOS Safari opens a downloaded .ics straight in "Add to Calendar", so download there; other phones try the share sheet.
    if (mobile && !ios && typeof File === "function" && navigator.canShare) {
      try {
        var file = new File([res.text], name, { type: "text/calendar" });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: t("title") }).then(function () { toast(t("calDone")); }, function (e) {
            if (!e || e.name !== "AbortError") { downloadIcs(blob, name); toast(t("calDone")); }
          });
          return;
        }
      } catch (e) {}
    }
    downloadIcs(blob, name); toast(t("calDone"));
  };

  /* ---------- ringing ---------- */
  var ringStarted = 0;
  function ring(item) {
    ringing.push(item);
    if (ringing.length === 1) { ringStarted = Date.now(); startSound(); }
    renderRing();
    notify(item.time + " · " + t("title"), item.title || t("notifBody"));
  }
  function renderRing() {
    var cur = ringing[0];
    $("ring-time").textContent = cur.time;
    $("ring-label").textContent = cur.snooze ? t("ringLabelSnooze") : (cur.type === "once" ? t("once") : t("daily"));
    var ul = $("ring-tasks"); ul.innerHTML = "";
    C.splitTasks(cur.title).forEach(function (task) {
      var li = document.createElement("li");
      li.innerHTML = '<label><input type="checkbox"><span>' + esc(task) + "</span></label>";
      ul.appendChild(li);
    });
    $("ring-more").textContent = ringing.length > 1 ? t("more")(ringing.length - 1) : "";
    $("ring").hidden = false;
  }
  function dismiss(snooze) {
    var cur = ringing.shift();
    if (snooze && cur) {
      var at = Date.now() + SNOOZE_MIN * 60000;
      snoozes.push({ at: at, alarmId: cur.alarmId, title: cur.title, type: cur.type });
      saveSnoozes(); toast(t("snoozed")(hm(new Date(at))));
    }
    if (!ringing.length) { stopSound(); $("ring").hidden = true; renderList(); }
    else { ringStarted = Date.now(); renderRing(); }
  }
  $("stop").onclick = function () { dismiss(false); };
  $("snooze").onclick = function () { dismiss(true); };
  $("test-sound").onclick = function () {
    var c = audio(); if (c) chime(c); buzz(300);
  };

  function check() {
    var now = new Date(), changed = false;
    C.dueAlarms(alarms, now).forEach(function (d) {
      C.markFired(d.alarm, d.key); changed = true;
      ring({ alarmId: d.alarm.id, title: titleOf(d.alarm), time: d.alarm.time, type: d.alarm.type });
    });
    var due = C.dueSnoozes(snoozes, now);
    if (due.length) {
      snoozes = snoozes.filter(function (s) { return due.indexOf(s) < 0; }); saveSnoozes();
      due.forEach(function (s) { ring({ alarmId: s.alarmId, title: s.title, time: hm(now), type: s.type, snooze: true }); });
    }
    if (changed) { save(); renderList(); }
    // auto-snooze if nobody answers for 5 minutes
    if (ringing.length && Date.now() - ringStarted > RING_MAX_MS) dismiss(true);
  }

  var lastMinute = "";
  function loop() {
    tickClock(); check();
    var m = hm(new Date()); if (m !== lastMinute) { lastMinute = m; renderNext(); }
  }

  /* ---------- wiring ---------- */
  $("he").onclick = function () { lang = "he"; localStorage.setItem(LANG, lang); render(); };
  $("en").onclick = function () { lang = "en"; localStorage.setItem(LANG, lang); render(); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("editor").hidden) closeEditor(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { loop(); if (wantWake && !wakeLock) requestWake(); }
  });
  window.addEventListener("storage", function (e) {
    if (e.key === KEY) { alarms = load(KEY, alarms); renderList(); }
    if (e.key === SNZ) { snoozes = load(SNZ, snoozes); }
    if (e.key === LANG) { lang = e.newValue === "en" ? "en" : "he"; render(); }
  });

  render(); updateInstall(); loop();
  setInterval(loop, 1000);
  window.__alarmApp = { check: check, get alarms() { return alarms; }, get ringing() { return ringing; } };
})();
</script>
