var lang = localStorage.getItem("rg-lang") === "en" ? "en" : "he";

function isEmail(value) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

function text(id, value) {

function render() {
  var t = copy[lang];
  var he = lang === "he";

  var list = document.getElementById("list");

  topics.forEach(function (topic) {
    var li = document.createElement("li");

      var name = document.createElement("span");

function notifySignup(email, l) {
  return fetch("https://formsubmit.co/ajax/" + encodeURIComponent(CONTACT), {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({ email: email, lang: l, _subject: "Waitlist — Ron Gershinsky", _template: "table" })
  }).then(function (r) { if (!r.ok) throw new Error("notify"); return r; });
}
// Resolves when the signup is stored (Appwrite) or at least emailed (FormSubmit); rejects only if both fail.
function saveSignup(email, l) {
  var w = WAITLIST;
  var row = fetch(w.endpoint + "/tablesdb/" + w.db + "/tables/" + w.table + "/rows", {
    method: "POST",
    credentials: "omit",
    headers: { "Content-Type": "application/json", "X-Appwrite-Project": w.project },
    body: JSON.stringify({ rowId: "unique()", data: { email: email.toLowerCase(), app: w.app, lang: l, createdAt: new Date().toISOString() } })
  }).then(function (r) {
    if (r.ok || r.status === 409) return r.status; // 409: this email is already on the list
    throw new Error("store " + r.status);
  });
  return row.then(function (status) {
    if (status !== 409) notifySignup(email, l).catch(function () {});
  }, function () {
    return notifySignup(email, l);
  });
}

document.getElementById("form").addEventListener("submit", function (event) {
  event.preventDefault();
  var input = document.getElementById("email");
  var value = input.value.trim();
  var invalid = document.getElementById("invalid");
  var thanks = document.getElementById("thanks");
  var t = copy[lang];
  if (!isEmail(value)) {
    invalid.hidden = false;
    invalid.textContent = t.invalid;
    thanks.hidden = true;
    return;
  }
  invalid.hidden = true;
  var join = document.getElementById("join");
  join.disabled = true;
  var request = saveSignup(value, lang);
  request.then(function () {
    input.value = "";
    thanks.hidden = false;
    thanks.textContent = t.thanks;
  }).catch(function () {
    thanks.hidden = true;
    invalid.hidden = false;
    invalid.textContent = t.sendFail;
  }).finally(function () {
    join.disabled = false;
  });
});

var instDeferred = null, instDone = false;
function instStandalone() {
  return (window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches || window.matchMedia("(display-mode: minimal-ui)").matches)) || navigator.standalone === true;
}
function instKey() {
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) return (/Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|YaBrowser|DuckDuckGo|FBAN|FBAV|Instagram|WhatsApp|Line\//.test(ua)) ? "iosSafari" : "iosOther";
  if (/Android/i.test(ua)) return "android";
  return "desktop";
}
function instHint(l) { return INST_TXT[l === "en" ? "en" : "he"][instKey()]; }
function updateInstall() {
  var show = !instStandalone() && !instDone;
  document.getElementById("install-wrap").hidden = !show;
  if (!show) document.getElementById("install-hint").hidden = true;
}
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); instDeferred = e; updateInstall(); });
window.addEventListener("appinstalled", function () { instDeferred = null; instDone = true; updateInstall(); });
if (window.matchMedia) { var instMq = window.matchMedia("(display-mode: standalone)"); if (instMq.addEventListener) instMq.addEventListener("change", updateInstall); else if (instMq.addListener) instMq.addListener(updateInstall); }
document.getElementById("install-btn").addEventListener("click", function () {
  var hint = document.getElementById("install-hint");
  if (instDeferred) {
    var d = instDeferred; instDeferred = null;
    try { d.prompt(); (d.userChoice || Promise.resolve()).then(updateInstall, updateInstall); return; } catch (e) {}
  }
  hint.innerHTML = instHint(lang);
  hint.hidden = !hint.hidden;
});

/* ---------- Background picker (same backgrounds as Updatify; 0 = original) ---------- */
var BG_KEY = "rg-home-bg", THEME_KEY = "rg-home-theme";

var theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg>';
var LBG_KEY = "rg-home-bg-light", lbg = document.documentElement.getAttribute("data-lbg") || "0";
function themeColor() { return theme === "light" ? ((window.RG_LBG_TC || {})[lbg] || "#f3efe6") : ((window.RG_BG_TC || {})[bg] || "#0f172a"); }
// night (default, the original look) / light; each mode has its own background picker (rg-home-bg / rg-home-bg-light)
function applyTheme() {
  var t = copy[lang];
  document.documentElement.setAttribute("data-theme", theme);
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", themeColor());
  if (!document.getElementById("bg-sheet").hidden) renderSwatches(); // each mode shows its own backgrounds
  var b = document.getElementById("theme-btn");
  b.querySelector(".ti").innerHTML = theme === "light" ? MOON : SUN;
  b.querySelector(".tl").textContent = theme === "light" ? t.dark : t.light;
  b.setAttribute("aria-label", theme === "light" ? t.toDark : t.toLight);
}
function setTheme(v) { theme = v === "light" ? "light" : "dark"; try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} applyTheme(); }
document.getElementById("theme-btn").addEventListener("click", function () { setTheme(theme === "light" ? "dark" : "light"); });
function renderSwatches() {
  var t = copy[lang], light = theme === "light", cur = light ? lbg : bg, names = light ? t.lbgs : t.bgs, html = "";
  for (var i = 0; i <= 10; i++) {
    var pv = i === 0 ? (light ? "linear-gradient(180deg,#f6f2ea 0%,#ebe5d8 100%)" : "linear-gradient(180deg,#0f172a 0%,#1e293b 100%)")
      : light ? "var(--lbgi-" + i + "),var(--lbgc-" + i + ")" : "var(--bgi-" + i + "),var(--bgc-" + i + ")";
    html += '<button type="button" class="sw" data-bg="' + i + '" aria-pressed="' + (String(i) === cur ? "true" : "false") + '">' +
      '<span class="pv" style="background:' + pv + '"><span class="num">' + (i === 0 ? "★" : i) + "</span></span>" +
      '<span class="nm">' + names[i] + "</span></button>";
  }
  document.getElementById("swatches").innerHTML = html;
}
function setBg(v, mode) {
  v = /^([0-9]|10)$/.test(String(v)) ? String(v) : "0";
  if ((mode || theme) === "light") { lbg = v; try { localStorage.setItem(LBG_KEY, v); } catch (e) {} document.documentElement.setAttribute("data-lbg", v); }
  else { bg = v; try { localStorage.setItem(BG_KEY, v); } catch (e) {} document.documentElement.setAttribute("data-bg", v); }
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", themeColor());
  renderSwatches();
}

});

/* ---------- "My private apps": shown right under the public grid, only to the site owner ----------
   The owner is matched by Appwrite user ID (the account's $id, never the email). The list itself is not in this page:
   it is loaded from my/apps.js only after the signed-in user is the owner, and a signed-out visitor or anyone else
   never requests it. The session is re-checked with Appwrite on load (RGAccount.ready); a 401 hides the section. */
function isOwner(u) { return !!(u && u.id && OWNER_IDS.indexOf(u.id) !== -1); }
function privHide() {
  document.getElementById("priv-apps").hidden = true;
  document.getElementById("priv-grid").innerHTML = "";
}
function renderPriv() { // the owner's private apps are merged into the main grid (renderApps); the separate section stays hidden
  privHide();
  renderApps(lang === "he");
}
function loadPriv() {
  var u = window.RGAccount ? RGAccount.user() : null;
  document.documentElement.classList.toggle("rg-owner", isOwner(u)); // owner: hide brand block + waitlist / contact / about / recommended game
  if (!isOwner(u)) { privData = null; try { localStorage.removeItem(PRIV_CACHE); } catch (e) {} renderPriv(); return; }
  if (!privData) { try { privData = JSON.parse(localStorage.getItem(PRIV_CACHE) || "null"); } catch (e) { privData = null; } }
  renderPriv();
  if (privLoading) return;
  privLoading = true;
  var s = document.createElement("script");
  s.src = "my/apps.js?v=" + Date.now();
  s.onload = function () {
    privLoading = false; s.remove();
    if (!isOwner(RGAccount.user()) || !window.RGMY_APPS) return;
    privData = window.RGMY_APPS;
    try { localStorage.setItem(PRIV_CACHE, JSON.stringify(privData)); } catch (e) {}
    renderPriv();
  };
  s.onerror = function () { privLoading = false; s.remove(); };
  document.head.appendChild(s);
}
if (window.RGAccount) {
  loadPriv();
  RGAccount.onChange(loadPriv);
  RGAccount.ready.then(loadPriv);
}
/* ---------- Account: language + background follow the signed-in user across devices ---------- */
if (window.RGAccount) {
  RGAccount.syncPrefs(["rg-lang", THEME_KEY, BG_KEY, LBG_KEY], function (c) {
    if ("rg-lang" in c) lang = c["rg-lang"] === "en" ? "en" : "he";
    if (THEME_KEY in c) setTheme(c[THEME_KEY]);
    if (BG_KEY in c) setBg(c[BG_KEY], "dark");
    if (LBG_KEY in c) setBg(c[LBG_KEY], "light");
    render(); return true;
  });
}
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
}
