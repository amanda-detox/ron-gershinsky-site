<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a3f">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="עדכונים">
<meta name="description" content="עדכונים · חדשות יומיות על האנשים והחברות שאתה עוקב אחריהם. Updates, daily news on the people and companies you follow.">
<script>/* theme before first paint: dark (default) / light */(function(){var t="dark";try{t=localStorage.getItem("rg-news-theme")==="light"?"light":"dark";}catch(e){}document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#f3efe6":"#0a1a3f");try{if(localStorage.getItem("rg-lang")==="en"){document.documentElement.lang="en";document.documentElement.dir="ltr";}}catch(e){}})();</script>
<title>עדכונים · Updates</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0a1a3f; --bg2:#06112b; --card:#0f2350; --card2:#132b5f; --ink:#ffffff; --ink2:#d6e2fb; --mute:#a3b6dc; --dim:#7a8fb9;
  --em:#7fb6ff; --em2:#5fa8ff; --line:rgba(127,182,255,.16); --line2:rgba(127,182,255,.38);
  --accent:#ffffff; --accentink:#0a1a3f; --chip:rgba(127,182,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.2);
  --pagebg:radial-gradient(120% 60% at 50% -10%,#173a85 0%,#0f2760 38%,#0a1a3f 65%,#06112b 100%);
  --sans:"Assistant","Heebo","Rubik","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#f3efe6; --bg2:#ebe5d8; --card:#fffdf8; --card2:#f7f2e7; --ink:#0b1f4d; --ink2:#22396b; --mute:#44557b; --dim:#66779b;
  --em:#1a47a0; --em2:#0b2a6b; --line:rgba(11,42,107,.12); --line2:rgba(11,42,107,.3);
  --accent:#0b2a6b; --accentink:#ffffff; --chip:rgba(26,71,160,.07);
  --shadow:0 1px 2px rgba(11,31,77,.05),0 8px 22px rgba(11,42,107,.07);
  --pagebg:linear-gradient(180deg,#f6f2ea 0%,#f3efe6 50%,#ebe5d8 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2)}
body{color:var(--ink);background:var(--pagebg) fixed,var(--bg2);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.wrap{max-width:680px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.tools{display:inline-flex;align-items:center;gap:8px}
a.back{color:var(--mute);text-decoration:none;padding:8px 2px;white-space:nowrap}
a.back:hover{color:var(--em)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{font:600 13px var(--sans);color:var(--mute);background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--accentink);background:var(--accent)}
.themebtn{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.themebtn svg{width:16px;height:16px;flex:none}
:focus-visible{outline:3px solid rgba(127,182,255,.55);outline-offset:2px}
html[data-theme=light] :focus-visible{outline-color:rgba(26,71,160,.4)}

.hero{display:flex;align-items:center;gap:14px;padding:20px 2px 6px}
.hero img{width:60px;height:60px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,.22);flex:none}
h1{font-weight:800;font-size:34px;line-height:1.1;margin:0;letter-spacing:.005em}
.tagline{color:var(--mute);margin:2px 0 0;font-size:15.5px}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 4px;font-size:14px;color:var(--mute)}
.status .upd b{color:var(--ink2);font-weight:700}
.status .dot{width:8px;height:8px;border-radius:50%;background:#3ccf8e;display:inline-block;margin-inline-end:6px;vertical-align:middle}
.status .dot.stale{background:#f0b44c}
.status .dot.off{background:#e46b6b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font:600 14px var(--sans);cursor:pointer;color:var(--ink2);background:var(--card)}
.btn svg{width:15px;height:15px}
.btn.primary{color:var(--accentink);background:var(--accent);border-color:transparent}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.install{margin:10px 0 0}
.install[hidden],.hint[hidden]{display:none}
.hint{font-size:14px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;margin:6px -16px 0;padding-inline:16px;scrollbar-width:none;position:sticky;top:0;z-index:3;background:linear-gradient(var(--bg2),var(--bg2)) ;}
html[data-theme=dark] .chips{background:rgba(6,17,43,.92);backdrop-filter:blur(8px)}
html[data-theme=light] .chips{background:rgba(243,239,230,.94);backdrop-filter:blur(8px)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--chip);color:var(--ink2);border-radius:999px;padding:7px 13px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap}
.chip .n{font-weight:700;color:var(--dim);margin-inline-start:6px;font-size:12.5px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accentink);border-color:transparent}
.chip[aria-pressed=true] .n{color:inherit;opacity:.75}
.sep{flex:none;width:1px;background:var(--line2);margin:4px 2px}

.group{margin:18px 0 6px}
.group h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--em);margin:0 2px 8px;font-weight:800;display:flex;align-items:center;gap:8px}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin:10px 0}
.card h3{margin:0 0 6px;font-size:17.5px;line-height:1.35;font-weight:700;color:var(--ink)}
.card p{margin:0;color:var(--ink2);font-size:15.5px}
.card .meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:10px;font-size:13.5px;color:var(--dim)}
.card .meta a{color:var(--em);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.card .meta a:hover{text-decoration:underline}
.card .meta a svg{width:14px;height:14px}
html[dir=rtl] .card .meta a svg{transform:scaleX(-1)}
.empty,.err{text-align:center;color:var(--mute);padding:30px 10px;font-size:15px}
.note{font-size:13px;color:var(--dim);margin-top:22px;text-align:center}
footer{text-align:center;font-size:12.5px;color:var(--dim);margin-top:10px}
@media (max-width:380px){body{font-size:16px}h1{font-size:29px}.wrap{padding-left:12px;padding-right:12px}.chips{margin:6px -12px 0;padding-inline:12px}.themebtn .tl{display:none}.lang button{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../" id="back"></a>
    <div class="tools">
      <button type="button" class="themebtn" id="theme-btn"><span class="ti" aria-hidden="true"></span><span class="tl"></span></button>
      <div class="lang" role="group" aria-label="Language / שפה">
        <button type="button" id="lang-he" aria-pressed="true">עברית</button>
        <button type="button" id="lang-en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <div class="hero">
    <img src="icon.svg" alt="" width="60" height="60">
    <div>
      <h1 id="title"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </div>

  <div class="status">
    <span class="upd" id="updated"></span>
    <button type="button" class="btn" id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span id="refresh-l"></span></button>
  </div>
  <div class="install" id="install-wrap" hidden>
    <button type="button" class="btn primary" id="install-btn"></button>
    <div class="hint" id="install-hint" hidden></div>
  </div>

  <nav class="chips" id="chips" aria-label="Topics"></nav>
  <main id="feed" aria-live="polite"></main>
  <p class="note" id="note"></p>
  <footer>© Ron Gershinsky</footer>
</div>
<script src="app.js"></script>
</body>
</html>
