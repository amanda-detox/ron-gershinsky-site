<style>
:root{
  --bg:#0a1a3f; --bg2:#06112b; --card:#0f2350; --card2:#132b5f; --ink:#ffffff; --ink2:#d6e2fb; --mute:#a3b6dc; --dim:#7a8fb9;
  --em:#7fb6ff; --em2:#5fa8ff; --line:rgba(127,182,255,.16); --line2:rgba(127,182,255,.38);
  --accent:#ffffff; --accentink:#0a1a3f; --chip:rgba(127,182,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.2);
  --pagebg:radial-gradient(120% 60% at 50% -10%,#173a85 0%,#0f2760 38%,#0a1a3f 65%,#06112b 100%);
  --sans:"Assistant","Heebo","Rubik","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#f3efe6; --bg2:#ebe5d8; --card:#fffdf8; --card2:#f7f2e7; --ink:#0b1f4d; --ink2:#22396b; --mute:#44557b; --dim:#66779b;
  --em:#1a47a0; --em2:#0b2a6b; --line:rgba(11,42,107,.12); --line2:rgba(11,42,107,.3);
  --accent:#0b2a6b; --accentink:#ffffff; --chip:rgba(26,71,160,.07);
  --shadow:0 1px 2px rgba(11,31,77,.05),0 8px 22px rgba(11,42,107,.07);
  --pagebg:linear-gradient(180deg,#f6f2ea 0%,#f3efe6 50%,#ebe5d8 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2)}
body{color:var(--ink);background:var(--pagebg) fixed,var(--bg2);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.wrap{max-width:680px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;font-size:14px}
.tools{display:inline-flex;align-items:center;gap:8px}
.acct{display:inline-flex;min-width:0}
a.back{color:var(--mute);text-decoration:none;padding:8px 2px;white-space:nowrap}
a.back:hover{color:var(--em)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{font:600 13px var(--sans);color:var(--mute);background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--accentink);background:var(--accent)}
.themebtn{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.themebtn svg{width:16px;height:16px;flex:none}
:focus-visible{outline:3px solid rgba(127,182,255,.55);outline-offset:2px}
html[data-theme=light] :focus-visible{outline-color:rgba(26,71,160,.4)}

.hero{display:flex;align-items:center;gap:14px;padding:20px 2px 6px}
.hero img{width:60px;height:60px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,.22);flex:none}
h1{font-family:"Fredoka",var(--sans);font-weight:600;font-size:36px;line-height:1.1;margin:0;letter-spacing:.005em}
.tagline{color:var(--mute);margin:2px 0 0;font-size:15.5px}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 4px;font-size:14px;color:var(--mute)}
.status .upd b{color:var(--ink2);font-weight:700}
.status .dot{width:8px;height:8px;border-radius:50%;background:#f5c542;display:inline-block;margin-inline-end:6px;vertical-align:middle}
.status .dot.stale{background:#f0b44c}
.status .dot.off{background:#e46b6b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font:600 14px var(--sans);cursor:pointer;color:var(--ink2);background:var(--card)}
.btn svg{width:15px;height:15px}
.btn.primary{color:var(--accentink);background:var(--accent);border-color:transparent}
.install{margin:10px 0 0}
.install[hidden],.hint[hidden]{display:none}
.hint{font-size:14px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}

.chipbar{position:sticky;top:0;z-index:3;margin:6px -16px 0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
html[data-theme=dark] .chipbar{background:rgba(10,8,20,.38)}
html[data-theme=light] .chipbar{background:rgba(243,239,230,.94)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none;scroll-behavior:smooth;-webkit-user-select:none;user-select:none}
.chips.dragging{scroll-behavior:auto;cursor:grabbing}
.chips.dragging .chip{pointer-events:none}
.arrow{position:absolute;top:0;bottom:0;width:58px;display:flex;align-items:center;border:0;padding:0 8px;cursor:pointer;z-index:2;background:none}
.arrow[hidden]{display:none}
.arrow span{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accentink);box-shadow:0 3px 12px rgba(0,0,0,.3);transition:transform .15s}
.arrow:hover span{transform:scale(1.08)}
.arrow svg{width:18px;height:18px}
.arrow.prev{inset-inline-start:0;justify-content:flex-start}
.arrow.next{inset-inline-end:0;justify-content:flex-end}
html[dir=rtl] .arrow svg{transform:scaleX(-1)}
html[data-theme=dark] .arrow.prev{background:linear-gradient(to var(--fade-s),rgba(14,10,24,0),rgba(14,10,24,.75))}
html[data-theme=dark] .arrow.next{background:linear-gradient(to var(--fade-e),rgba(14,10,24,0),rgba(14,10,24,.75))}
html[data-theme=light] .arrow.prev{background:linear-gradient(to var(--fade-s),rgba(243,239,230,0),rgba(243,239,230,.95))}
html[data-theme=light] .arrow.next{background:linear-gradient(to var(--fade-e),rgba(243,239,230,0),rgba(243,239,230,.95))}
html[dir=ltr]{--fade-s:left;--fade-e:right}
html[dir=rtl]{--fade-s:right;--fade-e:left}
@media (pointer:coarse){.arrow{display:none!important}}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--chip);color:var(--ink2);border-radius:999px;padding:7px 13px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap}
.chip .n{font-weight:700;color:var(--dim);margin-inline-start:6px;font-size:12.5px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accentink);border-color:transparent}
.chip[aria-pressed=true] .n{color:inherit;opacity:.75}
.sep{flex:none;width:1px;background:var(--line2);margin:4px 2px}

.group{margin:18px 0 6px}
.group h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--em);margin:0 2px 8px;font-weight:800;display:flex;align-items:center;gap:8px}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin:10px 0}
.card h3{margin:0 0 6px;font-size:17.5px;line-height:1.35;font-weight:700;color:var(--ink)}
.card p{margin:0;color:var(--ink2);font-size:15.5px}
.card .meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:10px;font-size:13.5px;color:var(--dim)}
.card .meta a{color:var(--em);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.card .meta a:hover{text-decoration:underline}
.card .meta a svg{width:14px;height:14px}
html[dir=rtl] .card .meta a svg{transform:scaleX(-1)}
.card{transition:opacity .35s ease,transform .35s ease,height .35s ease,margin .35s ease,padding .35s ease}
.card.gone{opacity:0;transform:scale(.97);height:0!important;margin:0;padding-top:0;padding-bottom:0;border-width:0;overflow:hidden}
.card.isread{opacity:.55}
.card .acts{display:inline-flex;align-items:center;gap:12px}
.card .rd{font:700 13px var(--sans);color:var(--ink2);background:var(--chip);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.card .rd:hover{border-color:var(--em)}
.card .sm{font:700 12px var(--sans);color:#f5c542;background:rgba(26,71,160,.22);border:1px solid rgba(245,197,66,.55);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap;text-decoration:none}
.card .sm:hover{border-color:#f5c542}
.card .sm.sent{opacity:.7;cursor:default}
html[data-theme=light] .card .sm{color:#0b2a6b;background:rgba(245,197,66,.18);border-color:#c99a1e}
.feedbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 2px -6px;font-size:13.5px}
.lnk{background:none;border:0;padding:4px 0;font:700 13.5px var(--sans);color:var(--em);cursor:pointer}
.lnk.dim{color:var(--dim);font-weight:600}
.lnk:hover{text-decoration:underline}
.caught{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:44px 16px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);color:var(--mute);font-size:15px}
.caught .big{font-size:40px;line-height:1.2}
.caught b{font-size:20px;color:var(--ink)}
.empty,.err{text-align:center;color:var(--mute);padding:30px 10px;font-size:15px}
.note{font-size:13px;color:var(--dim);margin-top:22px;text-align:center}
footer{text-align:center;font-size:12.5px;color:var(--dim);margin-top:10px}

/* the picker sheet itself goes light in light mode */
html[data-theme=light] .sheet{background:rgba(255,253,248,.94);color:#0b1f4d;border-color:rgba(11,42,107,.14);box-shadow:0 -10px 40px rgba(11,31,77,.18)}
html[data-theme=light] .sheet .grab{background:rgba(11,42,107,.25)}
html[data-theme=light] .sheet .x{color:#22396b}
html[data-theme=light] .sw{color:#22396b}
html[data-theme=light] .sw .pv{border-color:rgba(11,42,107,.18)}
html[data-theme=light] .sw[aria-pressed=true] .pv{border-color:#0b2a6b;outline-color:rgba(201,162,39,.85)}
html[data-theme=light] .sw[aria-pressed=true] .pv::after{background:#0b2a6b;color:#fff}
html[data-theme=light] .sw .num{background:rgba(11,42,107,.7)}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-back[hidden]{display:none}
.sheet{width:100%;max-width:520px;background:rgba(20,14,30,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;border:1px solid rgba(255,255,255,.14);border-bottom:0;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:0 auto 10px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet h2{margin:0;font-size:18px;font-weight:800}
.sheet .x{background:none;border:0;color:#ddd;font-size:26px;line-height:1;cursor:pointer;padding:2px 8px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:440px){.swatches{grid-template-columns:repeat(6,1fr)}}
.sw{border:0;background:none;padding:0;cursor:pointer;color:#e9e4f3;font:600 12px var(--sans);text-align:center}
.sw .pv{position:relative;display:block;aspect-ratio:3/4;border-radius:12px;border:2px solid rgba(255,255,255,.18);overflow:hidden}
.sw .num{position:absolute;top:5px;inset-inline-start:5px;min-width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.55);color:#fff;font:800 12.5px/22px var(--sans);padding:0 5px}
.sw[aria-pressed=true] .pv{border-color:#fff;outline:3px solid rgba(255,214,160,.75);outline-offset:1px}
.sw[aria-pressed=true] .pv::after{content:"✓";position:absolute;bottom:5px;inset-inline-end:6px;width:22px;height:22px;border-radius:50%;background:#fff;color:#2a0a2e;font:800 13px/22px var(--sans)}
.sw:focus-visible{outline:none}.sw:focus-visible .pv{outline:3px solid rgba(255,214,160,.8);outline-offset:2px}
.sw .nm{display:block;margin-top:5px;line-height:1.25}
@media (max-width:380px){.swatches{gap:7px}.sw{font-size:11px}}
@media (max-width:380px){body{font-size:16px}h1{font-size:29px}.wrap{padding-left:12px;padding-right:12px}.chipbar{margin:6px -12px 0}.chips{padding-inline:12px}.themebtn .tl{display:none}.lang button{padding:6px 10px}}
/* ---- in-app reader (full text): blue + gold, light & night ---- */
.card .more{display:inline-flex;align-items:center;gap:4px;font:800 13.5px var(--sans);color:var(--rd-btnink);background:var(--rd-btn);border:1px solid var(--rd-gold);border-radius:999px;padding:5px 12px 5px 13px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(8,22,60,.18)}
.card .more svg{width:14px;height:14px}
html[dir=rtl] .card .more svg{transform:scaleX(-1)}
.card .more:hover{filter:brightness(1.08)}
:root{--rd-bg:#0b1d47;--rd-bg2:#0e2558;--rd-ink:#f4f7ff;--rd-ink2:#d7e2fb;--rd-dim:#a9bbdf;--rd-gold:#e3bd5b;--rd-gold2:#f3d58a;--rd-line:rgba(227,189,91,.35);--rd-btn:linear-gradient(180deg,#1d4fb8,#143a8c);--rd-btnink:#fff6dc}
html[data-theme=light]{--rd-bg:#fffdf8;--rd-bg2:#f6f0e2;--rd-ink:#0b1f4d;--rd-ink2:#1f3768;--rd-dim:#5a6b90;--rd-gold:#b8892b;--rd-gold2:#8a6414;--rd-line:rgba(184,137,43,.4);--rd-btn:linear-gradient(180deg,#1a47a0,#0b2a6b);--rd-btnink:#fff6dc}
html.noscroll,html.noscroll body{overflow:hidden}
#rd-sheet{z-index:30;background:rgba(4,10,28,.55)}
.rdr{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--rd-bg2),var(--rd-bg) 140px);color:var(--rd-ink);border:1px solid var(--rd-line);border-bottom:0;border-top:3px solid var(--rd-gold);border-radius:20px 20px 0 0;box-shadow:0 -12px 44px rgba(0,0,0,.45);animation:up .25s ease-out;overflow:hidden}
.rdr .grab{width:42px;height:5px;border-radius:9px;background:var(--rd-line);margin:9px auto 0;flex:none}
.rdr .rhd{display:flex;align-items:flex-start;gap:10px;padding:8px 16px 10px;border-bottom:1px solid var(--rd-line);flex:none}
.rdr .rhd .tt{flex:1;min-width:0}
.rdr h2{margin:0;font-size:19px;line-height:1.35;font-weight:800;color:var(--rd-ink)}
.rdr .rmeta{margin-top:4px;font-size:13px;color:var(--rd-gold2);font-weight:700}
html[data-theme=dark] .rdr .rmeta{color:var(--rd-gold)}
.rdr .x{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--rd-line);background:transparent;color:var(--rd-ink2);font-size:24px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.rdr .x:hover{border-color:var(--rd-gold)}
.rdr-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 18px calc(18px + env(safe-area-inset-bottom))}
.rdr .body{font-size:16.5px;line-height:1.7;color:var(--rd-ink2);overflow-wrap:anywhere}
.rdr .body p{margin:0 0 12px}
.rdr .body ul{margin:0 0 12px;padding-inline-start:22px}
.rdr .body li{margin:0 0 7px}
.rdr .body li::marker{color:var(--rd-gold)}
.rdr .body p.step{display:flex;gap:9px;align-items:flex-start;margin:0 0 8px}
.rdr .body .sn{flex:none;min-width:24px;height:24px;border-radius:12px;background:var(--rd-gold);color:#0b1d47;font:800 13px/24px var(--sans);text-align:center;margin-top:3px}
.rdr .body .na{font-size:14px;color:var(--rd-dim);border-inline-start:3px solid var(--rd-gold);padding-inline-start:10px}
.rdr .rft{margin-top:6px;padding-top:12px;border-top:1px solid var(--rd-line);display:flex;justify-content:flex-end}
.rdr .rft a{font-size:13px;font-weight:700;color:var(--rd-dim);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.rdr .rft a:hover{color:var(--rd-gold2);text-decoration:underline}
.rdr .rft a svg{width:13px;height:13px}
.rdr[dir=rtl] .rft a svg{transform:scaleX(-1)}
@media (max-width:380px){.rdr h2{font-size:18px}.rdr-scroll{padding-left:14px;padding-right:14px}.rdr .body{font-size:16px}.card .acts{gap:8px}}
/* ---- saved (bookmarked) updates: gold bookmark ---- */
.card{position:relative}
.card h3{padding-inline-end:38px}
.card .bm{position:absolute;top:9px;inset-inline-end:9px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid transparent;border-radius:50%;background:none;color:var(--dim);cursor:pointer;transition:color .15s,background .15s,transform .15s}
.card .bm svg{width:19px;height:19px}
.card .bm:hover{color:var(--rd-gold);background:var(--chip)}
.card .bm[aria-pressed=true]{color:var(--rd-gold)}
html[data-theme=dark] .card .bm[aria-pressed=true]{color:#f5c542}
.card .bm:active{transform:scale(.9)}
.chip.savedchip{display:inline-flex;align-items:center;gap:5px}
.chip .bi{display:inline-flex;color:var(--rd-gold)}
html[data-theme=dark] .chip .bi{color:#f5c542}
.chip .bi svg{width:14px;height:14px}
.chip[aria-pressed=true] .bi{color:inherit}
.card .meta .tp{color:var(--em);font-weight:700}
/* podcast episodes: gold "new episode" line */
.card .pod{display:inline-flex;align-items:center;gap:4px;margin:0 0 6px;padding:2px 10px;border:1px solid var(--rd-line);border-radius:999px;font-size:13px;color:var(--rd-gold2);background:rgba(227,189,91,.1);max-width:calc(100% - 44px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[data-theme=dark] .card .pod{color:#f5c542}
.card .pod b{font-weight:800}
.savedn{font-size:13.5px;color:var(--dim);margin:-2px 2px 4px}
.bmbig{color:var(--rd-gold)}
.bmbig svg{width:44px;height:44px}
html[data-theme=dark] .bmbig{color:#f5c542}
/* ---- share (cards + reader), refresh button, toast: blue + gold, light & night ---- */
.card .acts{flex-wrap:wrap;justify-content:flex-end}
.card .sh,.rdr .rsh{display:inline-flex;align-items:center;gap:5px;font:700 13px var(--sans);color:var(--ink2);background:var(--chip);border:1px solid var(--rd-line);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.card .sh svg,.rdr .rsh svg{width:14px;height:14px;color:var(--rd-gold);flex:none}
html[data-theme=dark] .card .sh svg{color:#f5c542}
.card .sh:hover,.rdr .rsh:hover{border-color:var(--rd-gold)}
.card .sh:active,.rdr .rsh:active,.refresh:active{transform:scale(.95)}
.rdr .rsh{flex:none;height:36px;padding:0 13px;color:var(--rd-ink2);background:transparent}
.card{scroll-margin-top:84px}
.card.deep{outline:2px solid var(--rd-gold);outline-offset:2px}
.refresh{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--sans);color:var(--rd-btnink);background:var(--rd-btn);border:1px solid var(--rd-gold);border-radius:999px;padding:4px 12px 4px 11px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(8,22,60,.18)}
.refresh .ri{display:inline-flex}
.refresh svg{width:14px;height:14px}
.refresh:hover{filter:brightness(1.08)}
.refresh[disabled]{cursor:progress;opacity:.85}
.refresh.spin svg{animation:rgspin .8s linear infinite}
@keyframes rgspin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:40;max-width:calc(100% - 32px);background:var(--rd-bg);color:var(--rd-ink);border:1px solid var(--rd-gold);border-radius:999px;padding:9px 18px;font:700 14.5px var(--sans);box-shadow:0 8px 28px rgba(0,0,0,.35);opacity:0;transition:opacity .2s,transform .2s;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
