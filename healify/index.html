<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a6b">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="היליפיי">
<meta name="description" content="היליפיי · מרחב אישי לדרך הריפוי שלך. Healify, a personal space for your healing journey.">
<script>/* theme before first paint: dark (default) / light */(function(){var t="dark";try{t=localStorage.getItem("rg-healify-theme")==="light"?"light":"dark";}catch(e){}document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#faf3dc":"#0b2a6b");})();</script>
<title>היליפיי · Healify</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0b2a6b; --bg2:#071c4a; --card:#0f2557; --card2:#132d66; --field:#0a1f4d; --ink:#ffffff; --ink2:#dbe8ff; --mute:#a9c1e6; --dim:#7f9ac4;
  --em:#9cc8ff; --em2:#7fb4ff; --em3:#5b93e6; --mint:rgba(156,200,255,.12); --mint2:rgba(156,200,255,.16); --warm:#f3c98b; --warm2:rgba(243,201,139,.14); --warmink:#f3d7a6;
  --line:rgba(156,200,255,.18); --line2:rgba(156,200,255,.4);
  --accent:#ffffff; --accentink:#0b2a6b; --accent2:#9cc8ff;
  --glow:radial-gradient(circle at 50% 50%,#fff 0 18%,#fff6c8 26%,rgba(255,158,199,.75) 42%,rgba(143,216,255,.5) 60%,rgba(167,139,250,0) 78%);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.22);
  --pagebg:radial-gradient(120% 70% at 50% -10%,#1a47a0 0%,#0f3380 35%,#0b2a6b 60%,#071c4a 100%);
  --disc-bg:rgba(243,201,139,.08); --disc-line:rgba(243,201,139,.32); --disc-ink:#f1dfc0; --disc-b:#ffe7bf; --disc-a:#ffd08a;
  --tlow-bg:rgba(143,216,255,.14); --tlow-ink:#bfe6ff; --danger:#ffb4a8;
  --serif:"Assistant","Heebo","Rubik","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  --sans:"Assistant","Heebo","Rubik","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#faf3dc; --bg2:#f4e9c6; --card:#fffbee; --card2:#fdf6e1; --field:#fffdf5; --ink:#0b1f4d; --ink2:#22396b; --mute:#4c6290; --dim:#7d8fb3;
  --em:#1a47a0; --em2:#0b2a6b; --em3:#5b8ad6; --mint:#f6edd0; --mint2:#efe3bf; --warm2:#fff4e0; --warmink:#8a5a14;
  --line:rgba(11,42,107,.12); --line2:rgba(11,42,107,.32);
  --accent:#0b2a6b; --accentink:#ffffff; --accent2:#1a47a0;
  --shadow:0 1px 2px rgba(11,31,77,.05),0 8px 24px rgba(11,42,107,.07);
  --pagebg:linear-gradient(180deg,#f6ebc8 0%,#faf3dc 40%,#faf3dc 100%);
  --disc-bg:#fffaf0; --disc-line:rgba(214,160,80,.4); --disc-ink:#5a4526; --disc-b:#4a3512; --disc-a:#8a4b12;
  --tlow-bg:#e6f2f8; --tlow-ink:#2b6f8f; --danger:#9b3b2f;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2)}
body{color:var(--ink);background:var(--pagebg) fixed,var(--bg2);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.tools{display:inline-flex;align-items:center;gap:8px}
a.back{color:var(--mute);text-decoration:none;padding:8px 2px;white-space:nowrap}
a.back:hover,a.back:focus-visible{color:var(--em)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{font:600 13px var(--sans);color:var(--mute);background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--accentink);background:var(--accent)}
.themebtn{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.themebtn svg{width:16px;height:16px;flex:none}
.themebtn:hover{border-color:var(--line2)}
button,textarea,input{font-family:inherit}
:focus-visible{outline:3px solid rgba(156,200,255,.55);outline-offset:2px}
html[data-theme=light] :focus-visible{outline-color:rgba(26,71,160,.4)}

/* hero */
.hero{text-align:center;padding:22px 4px 6px}
.crest{width:96px;height:96px;margin:6px auto 12px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.28))}
.crest svg{width:100%;height:100%}
.breath .pt{animation:breath 6s ease-in-out infinite;transform-origin:256px 272px}
@keyframes breath{0%,100%{transform:scale(.92);opacity:.9}50%{transform:scale(1.05);opacity:1}}
.eyebrow{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--em);font-weight:700}
h1{font-family:var(--serif);font-weight:800;font-size:44px;line-height:1.15;margin:4px 0 6px;letter-spacing:.005em;color:var(--ink)}
.tagline{font-size:19px;font-weight:600;color:var(--ink2);margin:0 0 10px}
.sub{color:var(--mute);margin:0 auto 18px;max-width:30em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:13px 26px;font:700 17px var(--sans);cursor:pointer;text-decoration:none;color:var(--accentink);background:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:hover{opacity:.92}
.btn:active{transform:scale(.98)}
.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line2);box-shadow:none}
.btn.ghost:hover{background:var(--mint)}
.btn.small{padding:9px 16px;font-size:15px}
.btn.danger{color:var(--danger);background:transparent;border:1px solid var(--danger);box-shadow:none;opacity:.9}
.meta{font-size:14px;color:var(--mute);margin-top:10px}
.install{margin-top:14px}
.install[hidden]{display:none}
.hint{font-size:14px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px auto 0;max-width:30em}
.hint[hidden]{display:none}

/* disclaimer */
.disc{background:var(--disc-bg);border:1px solid var(--disc-line);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--disc-ink);margin:16px 0 4px}
.disc b{color:var(--disc-b)}
.disc a{color:var(--disc-a);font-weight:700;white-space:nowrap}
.disc .em{display:block;margin-top:6px}

/* stepper */
.steps{display:flex;gap:6px;margin:14px 0 4px;padding:0;list-style:none}
.steps li{flex:1}
.steps button{width:100%;border:0;background:none;padding:6px 0 2px;cursor:pointer;color:var(--dim);font:600 12.5px var(--sans);display:flex;flex-direction:column;align-items:center;gap:5px}
.steps .bar{display:block;width:100%;height:4px;border-radius:9px;background:var(--mint2)}
.steps .done .bar{background:var(--em3)}
.steps .cur .bar{background:var(--em);box-shadow:0 0 10px rgba(156,200,255,.45)}
.steps .cur{color:var(--em)}
.steps .done{color:var(--ink2)}
.stepnum{font-size:13px;color:var(--mute);margin:8px 0 0}

section.screen{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}
section.screen[hidden]{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-family:var(--serif);font-weight:800;font-size:28px;line-height:1.2;margin:4px 0 8px;color:var(--ink)}
h2::after{content:"";display:block;width:44px;height:3px;border-radius:9px;margin-top:10px;background:var(--em)}
.lead{color:var(--mute);margin:0 0 14px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px 16px;box-shadow:var(--shadow);margin:12px 0}
.card h3{margin:0 0 4px;font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px}
.card h3 .ic{width:32px;height:32px;border-radius:9px;background:var(--mint);border:1px solid var(--line);color:var(--em);display:inline-flex;align-items:center;justify-content:center;flex:none}
.card h3 .ic svg{width:18px;height:18px}
.card .help{color:var(--mute);font-size:14.5px;margin:0 0 10px}

/* fields */
.field{margin:14px 0 0}
.field label{display:block;font-weight:600;font-size:15.5px;color:var(--ink2);margin-bottom:5px}
.field .opt{font-weight:400;color:var(--dim);font-size:13px}
textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:11px 13px;font-size:16px;line-height:1.55;color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea:focus{outline:none;border-color:var(--em2);box-shadow:0 0 0 3px rgba(127,180,255,.18)}
textarea::placeholder{color:var(--dim)}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:10px 12px;font-size:16px;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--em2);box-shadow:0 0 0 3px rgba(127,180,255,.18)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:999px;padding:9px 15px;font:600 15px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.chip .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.chip[aria-pressed=true]{background:var(--mint);border-color:var(--em);color:var(--ink)}
.chip[aria-pressed=true] .tick{background:var(--accent);border-color:transparent;color:var(--accentink)}
#other-wrap{margin-top:10px}
#other-wrap[hidden]{display:none}

/* scales */
.scale{margin:16px 0 4px}
.scale .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;color:var(--ink2);font-size:15.5px}
.scale .val{direction:ltr;unicode-bidi:isolate;font-family:var(--serif);font-weight:700;font-size:21px;color:var(--em);min-width:2.5em;text-align:end}
.scale .val.none{font-family:var(--sans);font-size:13px;color:var(--dim);font-weight:400}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:6px;direction:ltr}
html[dir=rtl] .dots{direction:rtl}
.dots button{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink2);font:700 15px var(--sans);cursor:pointer;padding:0;transition:all .15s}
.dots button.on{color:#0b1f4d;border-color:transparent}
.dots button.sel{transform:scale(1.08);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:4px}
.clearscore{background:none;border:0;color:var(--dim);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:2px 0}
.clearscore[hidden]{display:none}

/* content lists */
.items{list-style:none;margin:8px 0 0;padding:0}
.items li{border-top:1px solid var(--line);padding:10px 0}
.items li:first-child{border-top:0}
.items .t{font-weight:700}
.items .d{color:var(--ink2);font-size:15px;white-space:pre-line}
.items a{color:var(--em);font-weight:600;font-size:14.5px;word-break:break-all}
.soon{display:flex;align-items:center;gap:10px;background:var(--mint);border:1px dashed var(--line2);border-radius:10px;padding:12px 14px;color:var(--em);font-weight:600;font-size:15px;margin-top:6px}
.soon svg{width:22px;height:22px;flex:none}
.tier{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:3px 10px;margin-inline-start:auto}
.tier.free{background:var(--mint);color:var(--em)}
.tier.low{background:var(--tlow-bg);color:var(--tlow-ink)}
.tier.premium{background:var(--warm2);color:var(--warmink)}
.card.premium{border-color:var(--disc-line)}
.card.sel{border-color:var(--em);box-shadow:0 0 0 2px rgba(156,200,255,.25),var(--shadow)}
.card.sel::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:3px;background:var(--em)}
.note{font-size:14px;color:var(--mute);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:10px 0}
.othertext{font-style:italic;color:var(--ink2);font-size:15px;margin:2px 0 6px}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--em);font-weight:600;padding:8px 0}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 6px}
.nav .btn{flex:1;max-width:220px}
.saved{text-align:center;font-size:13px;color:var(--dim);min-height:20px;margin-top:4px;transition:color .3s}
.saved.on{color:var(--em)}

/* summary */
.sumrow{border-top:1px solid var(--line);padding:9px 0}
.sumrow:first-of-type{border-top:0}
.sumrow .k{font-size:13.5px;font-weight:700;color:var(--em);letter-spacing:.02em}
.sumrow .v{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.sumrow .v.empty{color:var(--dim);font-style:italic}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.score{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.score .n{direction:ltr;unicode-bidi:isolate;font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.1;color:var(--ink)}
.score .n small{font-size:15px;color:var(--dim)}
.score .l{font-size:13px;color:var(--mute);font-weight:600}
.score .meter{height:5px;border-radius:9px;background:var(--mint2);margin:6px 8px 0;overflow:hidden}
.score .meter i{display:block;height:100%;border-radius:9px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.privacy{font-size:13.5px;color:var(--mute);margin-top:10px}
footer{text-align:center;font-size:12.5px;color:var(--dim);margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:var(--accentink);padding:10px 18px;border-radius:999px;font-size:14.5px;z-index:9;box-shadow:var(--shadow)}
.toast[hidden]{display:none}

@media (max-width:380px){
  body{font-size:16px}
  h1{font-size:36px}
  h2{font-size:25px}
  .wrap{padding-left:12px;padding-right:12px}
  .card{padding:14px 12px;border-radius:12px}
  .dots{grid-template-columns:repeat(5,1fr);gap:6px}
  .steps button{font-size:11.5px}
  .lang button{padding:6px 10px}
  .themebtn .tl{display:none}
  .btn{padding:12px 18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../" id="back"></a>
    <div class="tools">
    <button type="button" class="themebtn" id="theme-btn"><span class="ti" aria-hidden="true"></span><span class="tl"></span></button>
    <div class="lang" role="group" aria-label="Language / שפה">
      <button type="button" id="lang-he" aria-pressed="true">עברית</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
    </div>
  </header>

  <!-- Welcome -->
  <section class="screen" id="s-welcome">
    <div class="hero">
      <div class="crest" aria-hidden="true">
        <svg viewBox="0 0 512 512" class="breath"><defs><linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a6b"/><stop offset="1" stop-color="#1a47a0"/></linearGradient>
          <linearGradient id="hst" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9cc8ff"/></linearGradient>
          <radialGradient id="hgl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.18" stop-color="#fff6c8"/><stop offset="0.38" stop-color="#ff9ec7" stop-opacity="0.8"/><stop offset="0.58" stop-color="#8fd8ff" stop-opacity="0.55"/><stop offset="0.78" stop-color="#a78bfa" stop-opacity="0.3"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient></defs>
          <rect width="512" height="512" rx="110" fill="url(#hbg)"/>
          <path d="M256 92 C 214 140 160 160 104 166 L 104 266 C 104 352 168 412 256 444 C 344 412 408 352 408 266 L 408 166 C 352 160 298 140 256 92 Z" fill="none" stroke="url(#hst)" stroke-width="20" stroke-linejoin="round"/>
          <g class="pt"><circle cx="256" cy="272" r="92" fill="url(#hgl)"/><circle cx="256" cy="272" r="13" fill="#fff"/></g></svg>
      </div>
      <div class="eyebrow" id="w-eyebrow"></div>
      <h1 id="w-title"></h1>
      <p class="tagline" id="w-tagline"></p>
      <p class="sub" id="w-sub"></p>
      <button type="button" class="btn" id="start"></button>
      <div class="meta" id="w-meta"></div>
      <div class="install" id="install-wrap" hidden>
        <button type="button" class="btn ghost small" id="install-btn"></button>
        <div class="hint" id="install-hint" hidden></div>
      </div>
    </div>
    <div class="disc" id="disc-w"></div>
  </section>

  <!-- Flow -->
  <div id="flow" hidden>
    <ol class="steps" id="steps"></ol>
    <div class="stepnum" id="stepnum"></div>

    <!-- A -->
    <section class="screen" id="s-a" hidden>
      <h2 id="a-title"></h2>
      <p class="lead" id="a-lead"></p>

      <div class="card">
        <h3><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg></span><span id="cases-title"></span></h3>
        <p class="help" id="cases-help"></p>
        <div class="chips" id="cases"></div>
        <div id="other-wrap" hidden>
          <input type="text" id="other-text" maxlength="300">
        </div>
      </div>

      <div class="card">
        <h3><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></span><span id="desc-title"></span></h3>
        <p class="help" id="desc-help"></p>
        <div id="fields"></div>
      </div>

      <div class="card">
        <h3><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 18h16M6 14v4M10 10v8M14 12v6M18 7v11"/></svg></span><span id="scales-title"></span></h3>
        <p class="help" id="scales-help"></p>
        <div id="scales"></div>
      </div>
    </section>

    <!-- B -->
    <section class="screen" id="s-b" hidden>
      <h2 id="b-title"></h2>
      <p class="lead" id="b-lead"></p>
      <div id="b-groups"></div>
    </section>

    <!-- C -->
    <section class="screen" id="s-c" hidden>
      <h2 id="c-title"></h2>
      <p class="lead" id="c-lead"></p>
      <div id="c-groups"></div>
    </section>

    <!-- D -->
    <section class="screen" id="s-d" hidden>
      <h2 id="d-title"></h2>
      <p class="lead" id="d-lead"></p>
      <div id="d-groups"></div>
    </section>

    <!-- Summary -->
    <section class="screen" id="s-sum" hidden>
      <h2 id="sum-title"></h2>
      <p class="lead" id="sum-lead"></p>
      <div class="card">
        <h3 id="sum-scores-title"></h3>
        <div class="scores" id="sum-scores"></div>
      </div>
      <div class="card">
        <h3 id="sum-cases-title"></h3>
        <div id="sum-cases"></div>
      </div>
      <div class="card">
        <h3 id="sum-desc-title"></h3>
        <div id="sum-desc"></div>
      </div>
      <div class="card">
        <h3 id="sum-data-title"></h3>
        <div class="actions">
          <button type="button" class="btn ghost small" id="exp-txt"></button>

<script src="app.js"></script>
<script>/* theme toggle (night default / light), label follows rg-lang via <html lang> */
(function(){
  var KEY="rg-healify-theme",root=document.documentElement,btn=document.getElementById("theme-btn");
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  function cur(){return root.getAttribute("data-theme")==="light"?"light":"dark";}
  function label(){
    var t=cur(),en=root.lang==="en",next=t==="dark"?"light":"dark";
    var L=en?{light:"Light",dark:"Night"}:{light:"מצב מואר",dark:"מצב לילה"};
    btn.querySelector(".ti").innerHTML=next==="light"?SUN:MOON;
    btn.querySelector(".tl").textContent=L[next];
    var a=(en?"Switch to ":"מעבר ל")+L[next];btn.setAttribute("aria-label",a);btn.title=a;
  }
  function apply(t){
    root.setAttribute("data-theme",t);
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#faf3dc":"#0b2a6b");
    try{localStorage.setItem(KEY,t);}catch(e){}
    label();
  }
  btn.addEventListener("click",function(){apply(cur()==="dark"?"light":"dark");});
  new MutationObserver(label).observe(root,{attributes:true,attributeFilter:["lang"]});
  label();
})();</script>
</body>
