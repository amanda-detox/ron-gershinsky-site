<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="היליפיי">
<meta name="description" content="היליפיי · מרחב אישי לדרך הריפוי שלך. Healify, a personal space for your healing journey.">
<title>היליפיי · Healify</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#ffffff; --bg2:#f7f7fc; --card:#ffffff; --ink:#1d1b3a; --ink2:#3b3863; --mute:#66648a; --dim:#9896b4;
  --em:#6d28d9; --em2:#7c3aed; --em3:#a78bfa; --mint:#f3efff; --mint2:#e6e2f5; --warm:#f3c98b; --warm2:#fff1d6;
  --line:rgba(109,40,217,.14); --line2:rgba(109,40,217,.38);
  --rb:linear-gradient(90deg,#ff5e7e,#ff9f43,#ffd93d,#4ade80,#38bdf8,#818cf8,#c084fc);
  --rbsoft:linear-gradient(90deg,rgba(255,94,126,.16),rgba(255,159,67,.16),rgba(255,217,61,.18),rgba(74,222,128,.16),rgba(56,189,248,.16),rgba(129,140,248,.16),rgba(192,132,252,.16));
  --grad:linear-gradient(110deg,#e11d48 0%,#ea580c 28%,#c026d3 62%,#4f46e5 100%);
  --shadow:0 1px 2px rgba(29,27,58,.05),0 10px 30px rgba(109,40,217,.08);
  --serif:"Frank Ruhl Libre","David Libre","David","Noto Serif Hebrew",Georgia,"Times New Roman",serif;
  --sans:"Assistant","Heebo","Rubik","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Hebrew",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-30vmax;z-index:0;pointer-events:none;opacity:.55;filter:blur(60px);
  background:radial-gradient(28vmax 22vmax at 20% 18%,rgba(255,94,126,.35),transparent 70%),radial-gradient(26vmax 20vmax at 78% 14%,rgba(56,189,248,.35),transparent 70%),radial-gradient(30vmax 22vmax at 85% 70%,rgba(192,132,252,.32),transparent 70%),radial-gradient(28vmax 22vmax at 18% 78%,rgba(74,222,128,.30),transparent 70%),radial-gradient(22vmax 18vmax at 50% 50%,rgba(255,217,61,.28),transparent 70%);
  animation:aura 26s ease-in-out infinite alternate}
@keyframes aura{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(12deg) scale(1.06)}100%{transform:rotate(-10deg) scale(1)}}
body::after{content:"";position:fixed;top:0;left:0;right:0;height:4px;z-index:5;background:var(--rb);background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
a.back{color:var(--mute);text-decoration:none;padding:8px 2px;white-space:nowrap}
a.back:hover,a.back:focus-visible{color:var(--em)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(255,255,255,.85)}
.lang button{font:600 13px var(--sans);color:var(--mute);background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
.lang button[aria-pressed=true]{color:#fff;background:var(--grad);box-shadow:0 2px 10px rgba(192,38,211,.3)}
button,textarea,input{font-family:inherit}
:focus-visible{outline:3px solid rgba(124,58,237,.45);outline-offset:2px}

/* hero */
.hero{text-align:center;padding:22px 4px 6px}
.crest{width:104px;height:104px;margin:6px auto 10px;filter:drop-shadow(0 10px 22px rgba(192,132,252,.35))}
.crest svg{width:100%;height:100%}
.breath{animation:breath 7s ease-in-out infinite;transform-origin:50% 50%}
@keyframes breath{0%,100%{transform:scale(.96)}50%{transform:scale(1.04)}}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--em2);font-weight:700}
h1{font-family:var(--serif);font-weight:700;font-size:48px;line-height:1.15;margin:4px 0 6px;letter-spacing:.01em;color:#7c3aed;background:linear-gradient(90deg,#e11d48,#ea580c,#ca8a04,#16a34a,#0284c7,#4f46e5,#9333ea,#e11d48,#ea580c,#ca8a04,#16a34a,#0284c7,#4f46e5,#9333ea,#e11d48);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 10s linear infinite}
.tagline{font-family:var(--serif);font-size:20px;color:var(--ink2);margin:0 0 10px}
.sub{color:var(--mute);margin:0 auto 18px;max-width:30em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 26px;font:700 17px var(--sans);cursor:pointer;text-decoration:none;color:#fff;background:var(--grad);background-size:180% 100%;box-shadow:0 6px 20px rgba(192,38,211,.28),0 2px 6px rgba(234,88,12,.18);transition:transform .15s,box-shadow .2s,background-position .6s}
.btn:hover{background-position:100% 0}
.btn:active{transform:scale(.98)}
.btn.ghost{color:var(--em);background:linear-gradient(#fff,#fff) padding-box,var(--rb) border-box;border:2px solid transparent;box-shadow:none}
.btn.small{padding:9px 16px;font-size:15px}
.btn.danger{color:#9b3b2f;background:#fff;border:1px solid rgba(155,59,47,.35);box-shadow:none}
.meta{font-size:14px;color:var(--mute);margin-top:10px}
.install{margin-top:14px}
.install[hidden]{display:none}
.hint{font-size:14px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px auto 0;max-width:30em}
.hint[hidden]{display:none}

/* disclaimer */
.disc{background:#fffaf0;border:1px solid rgba(214,160,80,.4);border-radius:16px;padding:12px 14px;font-size:14.5px;color:#5a4526;margin:16px 0 4px}
.disc b{color:#4a3512}
.disc a{color:#8a4b12;font-weight:700;white-space:nowrap}
.disc .em{display:block;margin-top:6px}

/* stepper */
.steps{display:flex;gap:6px;margin:14px 0 4px;padding:0;list-style:none}
.steps li{flex:1}
.steps button{width:100%;border:0;background:none;padding:6px 0 2px;cursor:pointer;color:var(--dim);font:600 12.5px var(--sans);display:flex;flex-direction:column;align-items:center;gap:5px}
.steps .bar{display:block;width:100%;height:6px;border-radius:9px;background:var(--mint2)}
.steps .done .bar{background:var(--rb);opacity:.55}
.steps .cur .bar{background:var(--rb);background-size:200% 100%;animation:flow 6s linear infinite;box-shadow:0 0 12px rgba(192,132,252,.55)}
.steps .cur{color:var(--em)}
.steps .done{color:var(--ink2)}
.stepnum{font-size:13px;color:var(--mute);margin:8px 0 0}

section.screen{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both}
section.screen[hidden]{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.2;margin:4px 0 8px;color:var(--ink)}
h2::after{content:"";display:block;width:84px;height:4px;border-radius:9px;margin-top:8px;background:var(--rb)}
.lead{color:var(--mute);margin:0 0 14px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px 16px;box-shadow:var(--shadow);margin:12px 0}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--rb);opacity:.85}
.card h3{margin:0 0 4px;font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.card h3 .ic{width:32px;height:32px;border-radius:11px;background:var(--rbsoft),#fff;color:var(--em);display:inline-flex;align-items:center;justify-content:center;flex:none}
.card h3 .ic svg{width:18px;height:18px}
.card .help{color:var(--mute);font-size:14.5px;margin:0 0 10px}

/* fields */
.field{margin:14px 0 0}
.field label{display:block;font-weight:600;font-size:15.5px;color:var(--ink2);margin-bottom:5px}
.field .opt{font-weight:400;color:var(--dim);font-size:13px}
textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 13px;font-size:16px;line-height:1.55;color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea:focus{outline:none;border-color:var(--em2);box-shadow:0 0 0 4px rgba(124,58,237,.13)}
textarea::placeholder{color:var(--dim)}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font-size:16px;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--em2);box-shadow:0 0 0 4px rgba(124,58,237,.13)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:#fff;color:var(--ink2);border-radius:999px;padding:9px 15px;font:600 15px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.chip .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.chip[aria-pressed=true]{background:var(--rbsoft),#fff;border-color:var(--em);color:var(--em)}
.chip[aria-pressed=true] .tick{background:var(--grad);border-color:transparent;color:#fff}
#other-wrap{margin-top:10px}
#other-wrap[hidden]{display:none}

/* scales */
.scale{margin:16px 0 4px}
.scale .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;color:var(--ink2);font-size:15.5px}
.scale .val{direction:ltr;unicode-bidi:isolate;font-family:var(--serif);font-size:22px;color:var(--em);min-width:2.5em;text-align:end}
.scale .val.none{font-family:var(--sans);font-size:13px;color:var(--dim);font-weight:400}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:6px;direction:ltr}
html[dir=rtl] .dots{direction:rtl}
.dots button{height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink2);font:700 15px var(--sans);cursor:pointer;padding:0;transition:all .15s}
.dots button.on{color:var(--ink);border-color:transparent}
.dots button.sel{transform:scale(1.08);box-shadow:0 4px 12px rgba(23,58,53,.2)}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:4px}
.clearscore{background:none;border:0;color:var(--dim);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:2px 0}
.clearscore[hidden]{display:none}

/* content lists */
.items{list-style:none;margin:8px 0 0;padding:0}
.items li{border-top:1px solid var(--line);padding:10px 0}
.items li:first-child{border-top:0}
.items .t{font-weight:700}
.items .d{color:var(--ink2);font-size:15px;white-space:pre-line}
.items a{color:var(--em);font-weight:600;font-size:14.5px;word-break:break-all}
.soon{display:flex;align-items:center;gap:10px;background:var(--rbsoft),#fff;border:1px dashed var(--line2);border-radius:14px;padding:12px 14px;color:var(--em);font-weight:600;font-size:15px;margin-top:6px}
.soon svg{width:22px;height:22px;flex:none}
.tier{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:3px 10px;margin-inline-start:auto}
.tier.free{background:var(--mint);color:var(--em)}
.tier.low{background:#e6f2f8;color:#2b6f8f}
.tier.premium{background:var(--warm2);color:#8a5a14}
.card.premium{border-color:rgba(214,160,80,.45);background:linear-gradient(180deg,#fff,#fff8ec)}
.card.sel{border-color:var(--em3);box-shadow:0 0 0 3px rgba(192,132,252,.22),var(--shadow)}
.card.sel::before{height:6px;opacity:1}
.note{font-size:14px;color:var(--mute);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:10px 0}
.othertext{font-style:italic;color:var(--ink2);font-size:15px;margin:2px 0 6px}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--em);font-weight:600;padding:8px 0}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 6px}
.nav .btn{flex:1;max-width:220px}
.saved{text-align:center;font-size:13px;color:var(--dim);min-height:20px;margin-top:4px;transition:color .3s}
.saved.on{color:var(--em)}

/* summary */
.sumrow{border-top:1px solid var(--line);padding:9px 0}
.sumrow:first-of-type{border-top:0}
.sumrow .k{font-size:13.5px;font-weight:700;color:var(--em);letter-spacing:.02em}
.sumrow .v{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.sumrow .v.empty{color:var(--dim);font-style:italic}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.score{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.score .n{direction:ltr;unicode-bidi:isolate;font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.1;color:var(--ink)}
.score .n small{font-size:15px;color:var(--dim)}
.score .l{font-size:13px;color:var(--mute);font-weight:600}
.score .meter{height:6px;border-radius:9px;background:var(--mint2);margin:6px 8px 0;overflow:hidden}
.score .meter i{display:block;height:100%;border-radius:9px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.privacy{font-size:13.5px;color:var(--mute);margin-top:10px}
footer{text-align:center;font-size:12.5px;color:var(--dim);margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14.5px;z-index:9;box-shadow:var(--shadow)}
.toast[hidden]{display:none}

@media (max-width:380px){
  body{font-size:16px}
  h1{font-size:38px}
  h2{font-size:26px}
  .wrap{padding-left:12px;padding-right:12px}
  .card{padding:14px 12px;border-radius:18px}
  .dots{grid-template-columns:repeat(5,1fr);gap:6px}
  .steps button{font-size:11.5px}
  .lang button{padding:6px 10px}
  .btn{padding:12px 18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}body::before{opacity:.4}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../" id="back"></a>
    <div class="lang" role="group" aria-label="Language / שפה">
      <button type="button" id="lang-he" aria-pressed="true">עברית</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </header>

  <!-- Welcome -->
  <section class="screen" id="s-welcome">
    <div class="hero">
      <div class="crest" aria-hidden="true">
        <svg viewBox="0 0 120 120" class="breath"><defs>
          <radialGradient id="cw" cx=".5" cy=".62" r=".5"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient></defs>
          <circle cx="60" cy="60" r="57" fill="#fff"/><circle cx="60" cy="70" r="40" fill="url(#cw)"/>
          <g fill="none" stroke-linecap="round" stroke-width="6">
            <path d="M18 80a42 42 0 0 1 84 0" stroke="#ff5e7e"/><path d="M25 80a35 35 0 0 1 70 0" stroke="#ff9f43"/>
            <path d="M32 80a28 28 0 0 1 56 0" stroke="#ffd93d"/><path d="M39 80a21 21 0 0 1 42 0" stroke="#4ade80"/>
            <path d="M46 80a14 14 0 0 1 28 0" stroke="#38bdf8"/><path d="M53 80a7 7 0 0 1 14 0" stroke="#a78bfa"/></g>
          
        </svg>
      </div>
      <div class="eyebrow" id="w-eyebrow"></div>
      <h1 id="w-title"></h1>
      <p class="tagline" id="w-tagline"></p>
      <p class="sub" id="w-sub"></p>
      <button type="button" class="btn" id="start"></button>
      <div class="meta" id="w-meta"></div>
      <div class="install" id="install-wrap" hidden>
        <button type="button" class="btn ghost small" id="install-btn"></button>
        <div class="hint" id="install-hint" hidden></div>
      </div>
    </div>
    <div class="disc" id="disc-w"></div>
  </section>

  <!-- Flow -->
  <div id="flow" hidden>
    <ol class="steps" id="steps"></ol>
    <div class="stepnum" id="stepnum"></div>

    <!-- A -->
    <section class="screen" id="s-a" hidden>
      <h2 id="a-title"></h2>
      <p class="lead" id="a-lead"></p>

      <div class="card">
        <h3><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg></span><span id="cases-title"></span></h3>
        <p class="help" id="cases-help"></p>
        <div class="chips" id="cases"></div>
        <div id="other-wrap" hidden>
          <input type="text" id="other-text" maxlength="300">
        </div>
      </div>

      <div class="card">
        <h3><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></span><span id="desc-title"></span></h3>
        <p class="help" id="desc-help"></p>
        <div id="fields"></div>
      </div>

      <div class="card">
        <h3><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 18h16M6 14v4M10 10v8M14 12v6M18 7v11"/></svg></span><span id="scales-title"></span></h3>
        <p class="help" id="scales-help"></p>
        <div id="scales"></div>
      </div>
    </section>

    <!-- B -->
    <section class="screen" id="s-b" hidden>
      <h2 id="b-title"></h2>
      <p class="lead" id="b-lead"></p>
      <div id="b-groups"></div>
    </section>

    <!-- C -->
    <section class="screen" id="s-c" hidden>
      <h2 id="c-title"></h2>
      <p class="lead" id="c-lead"></p>
      <div id="c-groups"></div>
    </section>

    <!-- D -->
    <section class="screen" id="s-d" hidden>
      <h2 id="d-title"></h2>
      <p class="lead" id="d-lead"></p>
      <div id="d-groups"></div>
    </section>

    <!-- Summary -->
    <section class="screen" id="s-sum" hidden>
      <h2 id="sum-title"></h2>
      <p class="lead" id="sum-lead"></p>
      <div class="card">
        <h3 id="sum-scores-title"></h3>
        <div class="scores" id="sum-scores"></div>
      </div>
      <div class="card">
        <h3 id="sum-cases-title"></h3>
        <div id="sum-cases"></div>
      </div>
      <div class="card">
        <h3 id="sum-desc-title"></h3>
        <div id="sum-desc"></div>
      </div>
      <div class="card">
        <h3 id="sum-data-title"></h3>
        <div class="actions">
          <button type="button" class="btn ghost small" id="exp-txt"></button>
          <button type="button" class="btn ghost small" id="exp-json"></button>
          <button type="button" class="btn danger small" id="clear"></button>
        </div>
        <p class="privacy" id="privacy"></p>
      </div>
    </section>

    <div class="nav">
      <button type="button" class="btn ghost" id="prev"></button>
      <button type="button" class="btn" id="next"></button>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
    <div class="disc" id="disc-f"></div>
  </div>

  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
