<style>

  /* ---- light mode (toggle + backgrounds from shared/rg-bg.js): cream + navy, blue/gold accents ---- */

<script>
(function () {
  "use strict";

  var SOUNDS = [
    { id: "ocean", e: "🌊", he: "אוקיינוס", en: "Ocean", c: "#38bdf8" },
