<style>

    <p class="install-hint" id="install-hint" hidden></p>

  <p class="note" id="note"></p>
  <footer><a href="../" id="back"></a> · <a href="../relax/" id="games"></a></footer>
</main>

<div class="bar">
  <div class="bar-in">
    <div class="row">
      <button type="button" class="play" id="play" aria-label="Play">▶</button>
      <div class="master">

        <input type="range" id="master" min="0" max="100" value="80" style="--c: #c9b8ff">

      <button type="button" class="stopall" id="stopall"></button>
    </div>
    <div class="timer" role="group" id="timer">
      <span class="long" id="timer-l"></span><span class="short" aria-hidden="true">⏲</span>
      <button type="button" class="chip" data-min="0" aria-pressed="true"></button>
      <button type="button" class="chip" data-min="15" aria-pressed="false"></button>
      <button type="button" class="chip" data-min="30" aria-pressed="false"></button>
      <button type="button" class="chip" data-min="60" aria-pressed="false"></button>
      <span class="left" id="left"></span>
    </div>
  </div>
</div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status" hidden></div>

  /* ---------- actions ---------- */

      var li = document.createElement("li");
