<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2148a8"/>
      <stop offset=".55" stop-color="#0f2366"/>
      <stop offset="1" stop-color="#071236"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset=".5" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#d99a1e"/>
    </linearGradient>
    <radialGradient id="lens" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#5f8dff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0b1c55" stop-opacity=".9"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- clipboard / checklist sheet -->
  <rect x="104" y="96" width="232" height="300" rx="26" fill="#f4f7ff" opacity=".96"/>
  <rect x="170" y="78" width="100" height="40" rx="14" fill="url(#gd)"/>
  <g stroke="#1b3a8f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M140 168 l14 14 26 -28"/>
    <path d="M140 238 l14 14 26 -28"/>
  </g>
  <g stroke="#9fb2e0" stroke-width="14" stroke-linecap="round">
    <line x1="204" y1="170" x2="300" y2="170"/>
    <line x1="204" y1="240" x2="262" y2="240"/>
    <line x1="146" y1="310" x2="226" y2="310"/>
  </g>
  <!-- gold magnifying glass -->
  <line x1="372" y1="372" x2="430" y2="430" stroke="url(#gd)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="318" cy="318" r="80" fill="url(#lens)" stroke="url(#gd)" stroke-width="26"/>
  <path d="M276 296 a48 48 0 0 1 36 -28" stroke="#ffffff" stroke-opacity=".7" stroke-width="10" stroke-linecap="round" fill="none"/>
