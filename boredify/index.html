<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>(function(){try{var z=+localStorage.getItem("rg-zoom");if([75,90,110,125,150].indexOf(z)>-1)document.documentElement.style.zoom=z/100;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1238">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>בורדיפיי · Boredify</title>
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="../shared/fonts/heebo.css">
<style>
:root{--gold:#f3cf6b;--gold2:#ffe7a3;--ink:#eaf0ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#1a2f8a,#070d2e 70%) fixed;color:var(--ink);font-family:Heebo,system-ui,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 24px;text-align:center}
.logo{width:120px;height:120px;margin:18px auto 6px;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
h1{margin:4px 0;font-size:32px;background:linear-gradient(180deg,#fff,var(--gold2) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{font-size:17px;line-height:1.5;color:#dfe7ff;margin:6px 0 18px}
.soon{display:inline-block;border:1px solid rgba(243,207,107,.55);background:rgba(30,52,150,.6);border-radius:999px;padding:10px 22px;color:var(--gold2);font-weight:700}
.back{display:inline-block;margin-top:24px;color:#9fb4ff;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top"></div>
  <img class="logo" src="icon.svg" alt="">
  <h1 id="t"></h1>
  <p class="desc" id="d"></p>
  <div class="soon" id="s"></div><br>
  <a class="back" id="b" href="../"></a>
</div>
<script>
var S={"he": {"t": "בורדיפיי", "d": "להפגת שעמום", "s": "בקרוב · התוכן בבנייה", "b": "→ לדף הראשי"}, "en": {"t": "Boredify", "d": "Beat boredom", "s": "Coming soon · content in progress", "b": "← Home"}};
function R(){var l="he";try{l=localStorage.getItem("rg-lang")==="en"?"en":"he";}catch(e){}var d=document.documentElement;d.lang=l;d.dir=l==="en"?"ltr":"rtl";var s=S[l];document.title=s.t;["t","d","s","b"].forEach(function(k){document.getElementById(k).textContent=s[k];});}
R();addEventListener("storage",function(e){if(e.key==="rg-lang")R();});addEventListener("rg-lang",R);
</script>
<script src="../shared/rg-topbar.js?v=3" data-slot="#top" data-where="prepend"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js");});</script>
</body>
</html>
